<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="900" height="300" fill="#ffffff"/>
  <text x="50" y="34" font-size="18" font-weight="700" fill="#1f2937">原题示意图 · t = 0（初始位置）</text>
  <text x="50" y="56" font-size="13" fill="#6b7280">数轴上 A、B、C 分别表示 −20、−8、16；点 Q 与 A 重合、点 N 与 B 重合（P 在 Q 左、M 在 N 左）。</text>

  <!-- 数轴 -->
  <line x1="50" y1="150" x2="820" y2="150" stroke="#9aa3b2" stroke-width="2"/>
  <!-- 刻度 -->
  <g stroke="#c2c8d2" stroke-width="1">
    <line x1="120" y1="143" x2="120" y2="157"/>
    <line x1="330" y1="143" x2="330" y2="157"/>
    <line x1="750" y1="143" x2="750" y2="157"/>
  </g>
  <g font-size="14" fill="#374151" text-anchor="middle">
    <text x="120" y="175">A</text>
    <text x="120" y="193" font-size="12" fill="#6b7280">−20</text>
    <text x="330" y="175">B</text>
    <text x="330" y="193" font-size="12" fill="#6b7280">−8</text>
    <text x="750" y="175">C</text>
    <text x="750" y="193" font-size="12" fill="#6b7280">16</text>
  </g>

  <!-- PQ 上轨 -->
  <rect x="85" y="98" width="35" height="22" rx="6" fill="#2563eb"/>
  <text x="92" y="113" font-size="13" font-weight="700" fill="#ffffff">P</text>
  <text x="113" y="113" font-size="13" font-weight="700" fill="#ffffff">Q</text>
  <text x="102" y="90" font-size="12" fill="#2563eb" text-anchor="middle">PQ = 2，速度 3</text>
  <!-- 端点虚线到轴 -->
  <g stroke="#9aa3b2" stroke-width="1" stroke-dasharray="3 3">
    <line x1="85" y1="120" x2="85" y2="150"/>
    <line x1="120" y1="120" x2="120" y2="150"/>
  </g>

  <!-- MN 下轨 -->
  <rect x="260" y="180" width="70" height="22" rx="6" fill="#ea580c"/>
  <text x="267" y="195" font-size="13" font-weight="700" fill="#ffffff">M</text>
  <text x="323" y="195" font-size="13" font-weight="700" fill="#ffffff">N</text>
  <text x="295" y="222" font-size="12" fill="#ea580c" text-anchor="middle">MN = 4，速度 1</text>
  <g stroke="#9aa3b2" stroke-width="1" stroke-dasharray="3 3">
    <line x1="260" y1="180" x2="260" y2="150"/>
    <line x1="330" y1="180" x2="330" y2="150"/>
  </g>

  <!-- 运动方向箭头 -->
  <g stroke="#16a34a" stroke-width="2" fill="none">
    <line x1="150" y1="80" x2="200" y2="80"/>
    <path d="M200 80 l-7 -4 v8 z" fill="#16a34a" stroke="none"/>
    <line x1="360" y1="240" x2="410" y2="240"/>
    <path d="M410 240 l-7 -4 v8 z" fill="#16a34a" stroke="none"/>
  </g>
  <text x="155" y="74" font-size="12" fill="#16a34a">向右匀速运动</text>
  <text x="365" y="234" font-size="12" fill="#16a34a">向右匀速运动</text>
</svg>
