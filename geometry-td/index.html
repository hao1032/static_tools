<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prism Bastion · Voxel TD</title><style>
:root{--bg:#06101e;--panel:#0d1c31dc;--line:#294363;--text:#eaf4ff;--muted:#8ca5c8;--cyan:#62eaff;--lime:#a8f56f;--gold:#ffd36b;--pink:#ff769a}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% -20%,#1d3b61,#06101e 65%);color:var(--text);font:14px system-ui,"Microsoft YaHei",sans-serif}#app{height:100%;display:grid;grid-template-rows:70px 1fr 92px}header,footer{display:flex;align-items:center;gap:16px;padding:0 26px;background:#071323e8;backdrop-filter:blur(14px);z-index:3}header{border-bottom:1px solid #203653}.brand{display:flex;align-items:center;gap:10px;min-width:240px}.logo{width:31px;height:31px;display:grid;place-items:center;background:linear-gradient(135deg,#64edff,#7d8fff);clip-path:polygon(50% 0,100% 28%,86% 82%,50% 100%,14% 82%,0 28%);color:#061321;font-weight:900}.brand strong{letter-spacing:.12em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.16em;margin-top:3px}.hud{display:flex;gap:8px}.stat{min-width:100px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:#10213b99}.stat span{display:block;color:var(--muted);font-size:10px}.stat b{font-size:18px}.energy b{color:var(--gold)}.core b{color:var(--lime)}.wave b{color:var(--cyan)}.actions{margin-left:auto}.btn{padding:9px 13px;border:1px solid var(--line);border-radius:7px;background:#fff0a;color:var(--text);cursor:pointer}.btn:hover{border-color:var(--cyan);color:var(--cyan)}.primary{border:0;background:linear-gradient(135deg,#6feaff,#728fff);color:#061321;font-weight:800}.primary:hover{color:#061321;filter:brightness(1.12)}#stage{position:relative;min-height:0}#scene{position:absolute;inset:0;cursor:grab}#scene:active{cursor:grabbing}.info,.tip{position:absolute;top:22px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px 15px;color:var(--muted);font-size:11px;line-height:1.8;pointer-events:none}.info{left:25px}.tip{right:25px;text-align:right}.info b{display:block;color:var(--text);font-size:12px;letter-spacing:.08em}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px}.cyan{background:var(--cyan)}.green{background:var(--lime)}.pink{background:var(--pink)}kbd{padding:3px 6px;background:#132740;border:1px solid #385675;border-radius:4px;color:var(--text)}#toast{position:absolute;top:22px;left:50%;transform:translate(-50%,-10px);opacity:0;padding:9px 15px;border:1px solid #4b759b;border-radius:6px;background:#102845ee;transition:.2s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}#panel{display:none;position:absolute;right:25px;bottom:22px;width:235px;padding:15px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.p-title{display:flex;justify-content:space-between;font-weight:800}.p-title button{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}.sub{color:var(--muted);font-size:11px;margin:5px 0 13px}.row{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:8px 0}.row b{color:var(--text)}.p-actions{display:flex;gap:7px;margin-top:13px}.p-actions .btn{flex:1;font-size:11px}footer{border-top:1px solid #203653;padding:12px 26px}.towerbar{display:flex;gap:8px}.tower{width:118px;height:64px;display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#0d1e35;cursor:pointer}.tower:hover,.tower.active{border-color:var(--cyan);box-shadow:0 0 0 1px #62eaff66}.shape{width:28px;text-align:center;color:var(--cyan);font-size:22px}.tower strong{display:block;font-size:11px}.tower small{display:block;color:var(--gold);font-size:10px;margin-top:4px}.grow{flex:1}.status{color:var(--muted);font-size:11px}.status b{color:var(--text)}@media(max-width:700px){#app{grid-template-rows:auto 1fr auto}header{padding:10px 13px;flex-wrap:wrap;gap:8px}.brand{min-width:auto}.hud{gap:4px}.stat{min-width:70px;padding:6px 8px}.stat b{font-size:15px}.actions{display:none}.info{left:13px;top:13px}.tip{right:13px;top:13px}.tower{width:86px}.tower strong{font-size:10px}.status{display:none}footer{padding:9px 12px;gap:7px;overflow:auto}}
</style></head><body><div id="app"><header><div class="brand"><div class="logo">◇</div><div><strong>PRISM BASTION</strong><small>VOXEL GEOMETRIC TOWER DEFENSE</small></div></div><div class="hud"><div class="stat energy"><span>能量</span><b id="energy">240</b></div><div class="stat core"><span>核心完整度</span><b id="lives">20</b></div><div class="stat wave"><span>波次</span><b id="wave">0 / 12</b></div></div><div class="actions"><button class="btn" id="reset">↻</button></div></header><main id="stage"><div id="scene"></div><div class="info"><b>VOXEL SECTOR 07</b><span><i class="dot cyan"></i>半透明通道方块</span><br><span><i class="dot green"></i>透明防御方块</span><br><span><i class="dot pink"></i>入侵单位</span></div><div class="tip"><kbd>拖动</kbd> 旋转空间　<kbd>滚轮</kbd> 缩放<br>先选择武器，再点击通道周围高亮方块</div><div id="toast"></div><div id="panel"><div class="p-title"><span id="p-name">脉冲棱镜</span><button id="close">×</button></div><div class="sub" id="p-sub">LEVEL 1 · VOXEL NODE</div><div class="row"><span>攻击力</span><b id="p-dmg">26</b></div><div class="row"><span>覆盖半径</span><b id="p-range">3.4</b></div><div class="row"><span>击破数</span><b id="p-kills">0</b></div><div class="p-actions"><button class="btn primary" id="upgrade">升级 · 90</button><button class="btn" id="sell">拆除</button></div></div></main><footer><div class="towerbar"><div class="tower active" data-type="pulse"><div class="shape">△</div><div><strong>脉冲棱镜</strong><small>50 能量</small></div></div><div class="tower" data-type="frost"><div class="shape">✧</div><div><strong>冰晶节点</strong><small>75 能量</small></div></div><div class="tower" data-type="cannon"><div class="shape">⬡</div><div><strong>重力炮台</strong><small>110 能量</small></div></div></div><div class="grow"></div><div class="status">状态：<b id="status">待命</b></div><button class="btn" id="pause">暂停</button><button class="btn primary" id="start">启动波次</button></footer></div>
<script type="module">
import * as THREE from '../clsf-viewer/three.module.js';
import {OrbitControls} from '../clsf-viewer/jsm/controls/OrbitControls.js';
const $=s=>document.querySelector(s), stage=$('#scene'), scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x06101e,.028);
const camera=new THREE.PerspectiveCamera(45,1,.1,200);camera.position.set(12,11,14);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.dampingFactor=.07;orbit.minDistance=8;orbit.maxDistance=25;orbit.maxPolarAngle=Math.PI-.15;orbit.target.set(0,1,0);
scene.add(new THREE.HemisphereLight(0xa8d7ff,0x06101e,1.7));const sun=new THREE.DirectionalLight(0xd9f6ff,3.5);sun.position.set(8,14,9);sun.castShadow=true;scene.add(sun);const glow=new THREE.PointLight(0x27dfff,18,20);glow.position.set(-4,5,-4);scene.add(glow);const world=new THREE.Group();scene.add(world);
const material=(c,r=.45,m=.25)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const W=9,D=7,H=5,unit=1.25,offsetX=-(W-1)*unit/2,offsetZ=-(D-1)*unit/2,offsetY=-(H-1)*unit/2+1.3;const cell=(x,y,z)=>new THREE.Vector3(offsetX+x*unit,offsetY+y*unit,offsetZ+z*unit);const key=(x,y,z)=>`${x},${y},${z}`;
// A continuous voxel volume: every position is a cube, with the route filled and other cubes transparent.
const route=[[0,2,0],[1,2,0],[2,2,0],[3,2,0],[3,2,1],[3,2,2],[2,2,2],[1,2,2],[0,2,2],[0,2,3],[0,2,4],[1,2,4],[2,2,4],[3,2,4],[4,2,4],[5,2,4],[6,2,4],[6,2,5],[6,2,6],[7,2,6],[8,2,6]];const routeSet=new Set(route.map(a=>key(...a)));const cubes=[];const towers=[];const enemies=[];let energy=240,lives=20,wave=0,running=false,paused=false,spawnLeft=0,spawnTimer=0,selected='pulse',selectedTower=null;let hoverCube=null;
function cube(x,y,z){const isRoute=routeSet.has(key(x,y,z));const g=new THREE.BoxGeometry(unit*.9,unit*.9,unit*.9);const m=material(isRoute?0x1c9bb2:0x4e8fb2,isRoute?.28:.75,isRoute?.35:.05);m.transparent=true;m.opacity=isRoute?.46:0;m.depthWrite=isRoute;const mesh=new THREE.Mesh(g,m);mesh.position.copy(cell(x,y,z));mesh.userData={x,y,z,isRoute};mesh.castShadow=isRoute;mesh.receiveShadow=true;world.add(mesh);cubes.push(mesh);return mesh}for(let x=0;x<W;x++)for(let y=0;y<H;y++)for(let z=0;z<D;z++)cube(x,y,z);
const edgeMat=new THREE.LineBasicMaterial({color:0x4d779b,transparent:true,opacity:0,depthWrite:false});for(const c of cubes){if(c.userData.isRoute)continue;const edges=new THREE.LineSegments(new THREE.EdgesGeometry(c.geometry),edgeMat);edges.position.copy(c.position);edges.userData=c.userData;world.add(edges)}
const routeLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(route.map(a=>cell(...a))),new THREE.LineBasicMaterial({color:0x9bf7ff}));world.add(routeLine);const core=cubes.find(c=>c.userData.x===8&&c.userData.y===2&&c.userData.z===6);if(core)core.material=material(0xa8f56f,.25,.5),core.material.transparent=true,core.material.opacity=.6;
const types={pulse:{name:'脉冲棱镜',cost:50,color:0x62eaff,damage:26,range:3.4,rate:1.1},frost:{name:'冰晶节点',cost:75,color:0x86eaff,damage:13,range:3,rate:1.35},cannon:{name:'重力炮台',cost:110,color:0xffd36b,damage:58,range:3.8,rate:2.1}};function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>$('#toast').classList.remove('show'),1500)}function hud(){$('#energy').textContent=energy;$('#lives').textContent=lives;$('#wave').textContent=`${wave} / 12`;$('#status').textContent=running?'防御中':'待命'}
function towerMesh(t){const d=types[t.type],g=new THREE.Group();g.position.copy(cell(t.x,t.y,t.z));g.userData.t=t;const base=new THREE.Mesh(new THREE.CylinderGeometry(.25,.31,.12,6),material(0x1f3c52,.45,.5));base.userData.t=t;g.add(base);const body=new THREE.Mesh(t.type==='cannon'?new THREE.CylinderGeometry(.16,.23,.38,6):new THREE.OctahedronGeometry(.27),material(d.color,.25,.68));body.position.y=.04;body.userData.t=t;body.castShadow=true;g.add(body);const lamp=new THREE.PointLight(d.color,.8,1.8);lamp.position.y=.05;g.add(lamp);return g}
function place(c){if(!c||c.userData.isRoute||c.userData.tower)return;const d=types[selected];if(energy<d.cost){toast('能量不足');return}energy-=d.cost;const t={x:c.userData.x,y:c.userData.y,z:c.userData.z,type:selected,level:1,cool:0,kills:0,mesh:null};t.mesh=towerMesh(t);c.userData.tower=t;world.add(t.mesh);towers.push(t);hud();toast(`${d.name} 已部署在透明方块`)}function show(t){selectedTower=t;const d=types[t.type];$('#panel').style.display='block';$('#p-name').textContent=d.name;$('#p-sub').textContent=`LEVEL ${t.level} · VOXEL NODE`;$('#p-dmg').textContent=d.damage*t.level;$('#p-range').textContent=d.range.toFixed(1);$('#p-kills').textContent=t.kills;$('#upgrade').textContent=`升级 · ${70+t.level*20}`}
function enemyMesh(k){const g=new THREE.Group(),c=k==='tank'?0xff8da9:0xff557d,b=new THREE.Mesh(k==='tank'?new THREE.IcosahedronGeometry(.4):new THREE.TetrahedronGeometry(.31),material(c,.25,.7));b.castShadow=true;g.add(b);g.add(new THREE.PointLight(c,1.2,2.2));return g}function spawn(){const k=wave>3&&Math.random()<.22?'tank':'grunt',e={idx:0,progress:0,speed:k==='tank'?1.05:1.6,hp:k==='tank'?150:55,max:k==='tank'?150:55,kind:k,mesh:enemyMesh(k)};e.mesh.position.copy(cell(...route[0]));e.mesh.position.y+=.55;world.add(e.mesh);enemies.push(e)}function hit(e,d){e.hp-=d;if(e.hp<=0){energy+=8;const i=enemies.indexOf(e);if(i>=0){world.remove(e.mesh);enemies.splice(i,1)}}}
function update(dt){if(paused)return;if(running){spawnTimer-=dt;if(spawnLeft&&spawnTimer<=0){spawn();spawnLeft--;spawnTimer=Math.max(.35,.85-wave*.025)}for(const e of [...enemies]){e.progress+=e.speed*dt;e.idx=Math.floor(e.progress);if(e.idx>=route.length-1){world.remove(e.mesh);enemies.splice(enemies.indexOf(e),1);lives--;continue}const a=cell(...route[e.idx]),b=cell(...route[e.idx+1]);a.y+=.55;b.y+=.55;e.mesh.position.lerpVectors(a,b,e.progress-e.idx)}if(!spawnLeft&&!enemies.length){running=false;energy+=25+wave*4;toast(`第 ${wave} 波清除 · +${25+wave*4} 能量`)}}for(const t of towers){t.cool-=dt;const d=types[t.type];if(t.cool>0)continue;let target=null,near=99;for(const e of enemies){const dis=t.mesh.position.distanceTo(e.mesh.position);if(dis<d.range*unit&&dis<near){near=dis;target=e}}if(target){t.cool=d.rate;hit(target,d.damage*t.level);t.kills++;const beam=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,near,6),new THREE.MeshBasicMaterial({color:d.color,transparent:true,opacity:.8}));beam.position.copy(t.mesh.position).lerp(target.mesh.position,.5);beam.lookAt(target.mesh.position);beam.rotateX(Math.PI/2);world.add(beam);setTimeout(()=>world.remove(beam),100)}}hud()}
document.querySelectorAll('.tower').forEach(x=>x.onclick=()=>{document.querySelectorAll('.tower').forEach(y=>y.classList.remove('active'));x.classList.add('active');selected=x.dataset.type;toast(`已选择 ${types[selected].name}`)});$('#start').onclick=()=>{if(running||wave>=12)return;wave++;running=true;spawnLeft=6+wave*2;spawnTimer=0;hud();toast(`第 ${wave} 波入侵开始`)};$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'继续':'暂停';toast(paused?'模拟已暂停':'模拟继续')};$('#reset').onclick=()=>location.reload();$('#close').onclick=()=>{$('#panel').style.display='none';selectedTower=null};$('#upgrade').onclick=()=>{if(!selectedTower)return;const c=70+selectedTower.level*20;if(energy<c){toast('能量不足');return}energy-=c;selectedTower.level++;show(selectedTower);hud()};$('#sell').onclick=()=>{if(!selectedTower)return;energy+=Math.floor(types[selectedTower.type].cost*.7);world.remove(selectedTower.mesh);const c=cubes.find(x=>x.userData.tower===selectedTower);if(c)c.userData.tower=null;towers.splice(towers.indexOf(selectedTower),1);selectedTower=null;$('#panel').style.display='none';hud()};
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let dragStart=null;renderer.domElement.addEventListener('pointerdown',e=>{dragStart={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',e=>{if(!dragStart)return;const moved=Math.hypot(e.clientX-dragStart.x,e.clientY-dragStart.y);dragStart=null;if(moved>6)return;const r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera);const h=ray.intersectObjects(world.children,true).find(x=>x.object.userData?.t||x.object.userData?.isRoute===false);if(!h)return;const u=h.object.userData;if(u.t){show(u.t);return}const c=cubes.find(x=>x.userData.x===u.x&&x.userData.y===u.y&&x.userData.z===u.z);if(c)place(c)});renderer.domElement.addEventListener("pointermove",e=>{const r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera);const h=ray.intersectObjects(world.children,true).find(x=>x.object.userData?.isRoute===false);const c=h?cubes.find(x=>x.userData.x===h.object.userData.x&&x.userData.y===h.object.userData.y&&x.userData.z===h.object.userData.z):null;if(hoverCube&&hoverCube!==c&&!hoverCube.userData.tower)hoverCube.material.opacity=0;hoverCube=c;if(c&&!c.userData.tower&&!c.userData.isRoute){c.material.opacity=.18;c.material.color.set(types[selected].color)}});function resize(){const r=stage.getBoundingClientRect();camera.aspect=r.width/r.height;camera.updateProjectionMatrix();renderer.setSize(r.width,r.height)}addEventListener('resize',resize);resize();hud();let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;orbit.update();update(dt);renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
