<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>几何塔防 · Geometry Tower Defense</title>
<style>
  :root{
    --bg:#070b18; --bg2:#0c1226; --panel:rgba(16,22,44,.82);
    --line:rgba(120,160,255,.18); --text:#dce6ff; --muted:#8aa0d8;
    --cyan:#00e5ff; --mag:#ff3df0; --lime:#7cff5e; --gold:#ffd23d; --vio:#9d7bff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(1200px 700px at 50% -10%, #142046 0%, var(--bg) 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden; user-select:none;
  }
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}

  /* 顶栏 */
  #topbar{
    display:flex;align-items:center;gap:14px;padding:10px 16px;
    background:linear-gradient(180deg, rgba(10,16,36,.95), rgba(10,16,36,.5));
    border-bottom:1px solid var(--line); backdrop-filter:blur(6px); flex-wrap:wrap;
  }
  #title{font-weight:800;letter-spacing:1px;font-size:15px;
    background:linear-gradient(90deg,var(--cyan),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent;
    display:flex;align-items:center;gap:8px;margin-right:6px;}
  .stat{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:4px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);}
  .stat .k{color:var(--muted);font-weight:500;font-size:12px;}
  .stat .v{font-variant-numeric:tabular-nums;}
  #lives .v{color:var(--mag);} #money .v{color:var(--gold);} #wave .v{color:var(--cyan);} #score .v{color:var(--lime);}
  .spacer{flex:1;}

  /* 画布 */
  #stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  canvas{display:block;max-width:100%;max-height:100%;border-radius:14px;
    box-shadow:0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.5);}

  /* 底栏 */
  #bottombar{
    display:flex;align-items:center;gap:10px;padding:12px 16px;
    background:linear-gradient(0deg, rgba(10,16,36,.96), rgba(10,16,36,.4));
    border-top:1px solid var(--line); backdrop-filter:blur(6px); flex-wrap:wrap;
  }
  .tower-btn{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;
    min-width:92px;padding:8px 10px;border-radius:12px;cursor:pointer;
    background:rgba(255,255,255,.03);border:1px solid var(--line);transition:.15s;
  }
  .tower-btn:hover{transform:translateY(-2px);border-color:rgba(120,160,255,.5);}
  .tower-btn.sel{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 18px rgba(0,229,255,.35);background:rgba(0,229,255,.08);}
  .tower-btn.poor{opacity:.45;filter:grayscale(.4);}
  .tower-btn canvas{box-shadow:none;border-radius:8px;background:rgba(0,0,0,.25);}
  .tower-btn .nm{font-size:12px;font-weight:600;}
  .tower-btn .cost{font-size:12px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;}

  .ctl{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;}
  .btn{
    padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;border:none;
    color:#04101f;background:linear-gradient(90deg,var(--cyan),#39ffd0);
    box-shadow:0 6px 18px rgba(0,229,255,.3);transition:.15s;
  }
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.5);box-shadow:none;transform:none;}
  .btn.ghost{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line);box-shadow:none;}
  .icon-btn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.05);border:1px solid var(--line);cursor:pointer;font-size:18px;color:var(--text);}
  .icon-btn:hover{border-color:var(--cyan);}
  .icon-btn.active{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 16px rgba(0,229,255,.4);background:rgba(0,229,255,.1);color:var(--cyan);}

  /* 地图选择：横向排布，最多 2 行（5 列网格） */
  #maps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 6px;}
  .map-card{padding:7px;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.03);border:1px solid var(--line);transition:.15s;}
  .map-card:hover{transform:translateY(-2px);border-color:rgba(120,160,255,.5);}
  .map-card.sel{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 18px rgba(0,229,255,.35);background:rgba(0,229,255,.07);}
  .map-card canvas{box-shadow:none;border-radius:8px;background:rgba(0,0,0,.25);display:block;margin:0 auto;}
  .map-card .mn{font-size:12px;font-weight:700;margin-top:6px;}
  .map-card .md{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4;}

  /* 升级面板 */
  #panel{
    position:absolute;right:16px;top:50%;transform:translateY(-50%);
    width:210px;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);
    box-shadow:0 20px 50px rgba(0,0,0,.5);display:none;backdrop-filter:blur(8px);
  }
  #panel h4{margin:0 0 4px;font-size:14px;}
  #panel .sub{color:var(--muted);font-size:12px;margin-bottom:10px;}
  #panel .row{display:flex;justify-content:space-between;font-size:12px;margin:3px 0;color:var(--muted);}
  #panel .row b{color:var(--text);font-variant-numeric:tabular-nums;}
  #panel .acts{display:flex;gap:8px;margin-top:12px;}
  #panel .acts .btn{flex:1;padding:9px 0;font-size:13px;}
  #panel .acts .sell{background:linear-gradient(90deg,#ff6b6b,#ff9b6b);color:#1a0606;}

  /* 遮罩 */
  #overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(800px 500px at 50% 40%, rgba(8,12,28,.7), rgba(4,7,16,.92));
    backdrop-filter:blur(3px);z-index:20;
  }
  #overlay .card{text-align:center;padding:30px 34px;border-radius:20px;background:var(--panel);border:1px solid var(--line);
    box-shadow:0 30px 80px rgba(0,0,0,.6);max-width:600px;}
  #overlay h1{margin:0 0 8px;font-size:26px;
    background:linear-gradient(90deg,var(--cyan),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent;}
  #overlay p{margin:6px 0;color:var(--muted);font-size:14px;line-height:1.7;}
  #overlay .hint{font-size:12px;color:var(--muted);margin-top:14px;opacity:.8;}
  .hidden{display:none!important;}

  #toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);
    background:rgba(255,80,120,.92);color:#fff;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;
    opacity:0;transition:.25s;pointer-events:none;z-index:15;}
  #toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="title">◆ 几何塔防</div>
    <div class="stat" id="lives"><span class="k">生命</span><span class="v">20</span></div>
    <div class="stat" id="money"><span class="k">能量</span><span class="v">200</span></div>
    <div class="stat" id="wave"><span class="k">波次</span><span class="v">0</span></div>
      <div class="stat" id="score"><span class="k">得分</span><span class="v">0</span></div>
      <div class="stat" id="mapname"><span class="k">地图</span><span class="v">经典蛇道</span></div>
      <div class="spacer"></div>
  </div>

  <div id="stage">
    <canvas id="game"></canvas>
    <div id="panel">
      <h4 id="p-name">炮塔</h4>
      <div class="sub" id="p-sub">等级 1</div>
      <div class="row"><span>伤害</span><b id="p-dmg">0</b></div>
      <div class="row"><span>射程</span><b id="p-rng">0</b></div>
      <div class="row"><span>射速</span><b id="p-rate">0</b></div>
      <div class="acts">
        <button class="btn" id="p-up">升级</button>
        <button class="btn sell" id="p-sell">出售</button>
      </div>
    </div>
    <div id="toast"></div>
    <div id="overlay">
      <div class="card">
        <h1 id="ov-title">几何塔防</h1>
        <p id="ov-desc">选择一张地图，用几何炮塔守住能量核心。</p>
        <div id="maps"></div>
        <p class="hint">点击下方炮塔 → 在空地落子 · 点击已有炮塔可升级/出售<br/>每波清完自动进入下一波（空格可立即开始）· 1~4 选炮塔 · P 暂停 · T 时停慢动作</p>
        <button class="btn" id="ov-btn" style="margin-top:14px;">开始游戏</button>
      </div>
    </div>
  </div>

  <div id="bottombar">
    <div id="towerbar" style="display:flex;gap:10px;flex-wrap:wrap;"></div>
    <div class="ctl">
      <div class="icon-btn" id="btn-timestop" title="时停（慢动作，便于思考）">⏳</div>
      <div class="icon-btn" id="btn-speed" title="加速">⏩</div>
      <div class="icon-btn" id="btn-sound" title="音效">🔊</div>
      <button class="btn" id="btn-wave">开始第 1 波</button>
    </div>
  </div>
</div>

<script>
"use strict";
(function(){
  // ---------- 配置 ----------
  const W = 1120, H = 620;          // 逻辑分辨率（画布内部坐标）
  const CELL = 56;
  const COLS = Math.floor(W/CELL), ROWS = Math.floor(H/CELL);
  const MAX_WAVE = 20;
  const WAVE_BREAK = 5;        // 波间自动进入下一波的等待秒数（真实时间）
  const SLOW_FACTOR = 0.3;     // 时停时的速度倍率

  // 地图：网格折线（c,r 为单元格坐标，均在 20×11 网格内）
  const MAPS = [
    { id:"snake",  name:"经典蛇道", desc:"标准 S 形双折，留白充足", color:"#00e5ff",
      way:[[0,1],[18,1],[18,5],[2,5],[2,9],[19,9]] },
    { id:"loop",   name:"短回环",   desc:"紧凑 U 形，转角更多",   color:"#ff3df0",
      way:[[0,2],[16,2],[16,8],[3,8],[3,5],[19,5]] },
    { id:"long",   name:"三折长道", desc:"三道折返，路线最长",   color:"#7cff5e",
      way:[[0,1],[18,1],[18,3],[2,3],[2,5],[18,5],[18,7],[2,7],[2,9],[19,9]] },
    { id:"spiral", name:"右旋臂",   desc:"螺旋向内，终点藏核心", color:"#ffd23d",
      way:[[0,5],[16,5],[16,9],[4,9],[4,2],[13,2],[13,7],[8,7]] },
    { id:"zig",    name:"Z 字峡谷", desc:"窄幅之字，逼你精准布防", color:"#9d7bff",
      way:[[0,3],[8,3],[8,7],[12,7],[12,3],[19,3]] },
    { id:"dloop",  name:"双环道",   desc:"两个回环，路程适中",   color:"#ff8a3d",
      way:[[0,2],[7,2],[7,8],[13,8],[13,2],[19,2],[19,9]] },
    { id:"stair",  name:"阶梯峡谷", desc:"阶梯上下，塔位交错",   color:"#3dffd2",
      way:[[0,9],[4,9],[4,7],[8,7],[8,5],[12,5],[12,3],[16,3],[16,9],[19,9]] },
    { id:"bigc",   name:"巨 C 弯",  desc:"大 C 形，中段狭长",   color:"#ff5e7c",
      way:[[0,1],[19,1],[19,9],[1,9],[1,4],[19,4]] },
    { id:"bolt",   name:"闪电折线", desc:"竖向电锯，节奏紧凑",   color:"#5ea0ff",
      way:[[0,2],[6,2],[6,8],[10,8],[10,2],[14,2],[14,8],[18,8],[18,4],[19,4]] },
    { id:"outer",  name:"外环绕",   desc:"外圈包抄，核心居中",   color:"#ff9bd6",
      way:[[0,9],[19,9],[19,1],[1,1],[1,7],[2,7],[2,3],[18,3]] },
  ];
  let PATH_CELLS = new Set();
  let WAY = [];
  function buildPathSet(wp){
    const set=new Set(); const add=(c,r)=>set.add(c+","+r);
    const line=(c0,r0,c1,r1)=>{
      const dc=Math.sign(c1-c0), dr=Math.sign(r1-r0);
      let c=c0,r=r0; add(c,r);
      while(c!==c1||r!==r1){ c+=dc; r+=dr; add(c,r); }
    };
    for(let i=0;i<wp.length-1;i++) line(wp[i][0],wp[i][1],wp[i+1][0],wp[i+1][1]);
    return set;
  }
  function applyMap(m){
    WAY = m.way.map(([c,r])=>({x:c*CELL+CELL/2, y:r*CELL+CELL/2}));
    PATH_CELLS = buildPathSet(m.way);
    G.mapColor=m.color; G.mapName=m.name;
    const mv=document.querySelector("#mapname .v");
    if(mv) mv.textContent=m.name;
  }
  const cellCenter=(c,r)=>({x:c*CELL+CELL/2, y:r*CELL+CELL/2});

  // 炮塔类型
  const TOWERS = {
    blaster:{ key:"blaster", name:"脉冲炮", shape:"square",   color:"#00e5ff", cost:50,  range:130, dmg:20, rate:0.55, proj:"bullet", desc:"均衡单体" },
    sniper: { key:"sniper",  name:"棱镜狙击", shape:"triangle", color:"#ff3df0", cost:95,  range:280, dmg:80, rate:1.5,  proj:"bullet", desc:"远程高伤" },
    frost:  { key:"frost",   name:"寒冰核", shape:"hexagon",  color:"#7cff5e", cost:75,  range:120, dmg:10, rate:0.7,  proj:"frost",  slow:0.45, slowDur:1.6, desc:"减速敌人" },
    laser:  { key:"laser",   name:"聚能激光", shape:"pentagon", color:"#ffd23d", cost:130, range:175, dmg:55, rate:0, proj:"beam", desc:"持续光束" },
  };
  const TOWER_ORDER = ["blaster","sniper","frost","laser"];

  // 敌人类型
  const ENEMY = {
    grunt:{ name:"游兵",  shape:"circle",   color:"#ff6b6b", hp:42,  speed:62,  reward:9,  r:14 },
    fast: { name:"疾矢",  shape:"triangle", color:"#ffd23d", hp:26,  speed:128, reward:11, r:12 },
    tank: { name:"重甲",  shape:"square",   color:"#9d7bff", hp:160, speed:40,  reward:20, r:18 },
    boss: { name:"核心",  shape:"hexagon",  color:"#ff3df0", hp:1100,speed:32,  reward:140,r:30 },
  };

  // ---------- 状态 ----------
  const cv = document.getElementById("game");
  const ctx = cv.getContext("2d");
  let dpr = Math.min(window.devicePixelRatio||1, 1.5);
  cv.width = W*dpr; cv.height = H*dpr; cv.style.width=W+"px"; cv.style.height=H+"px";
  ctx.scale(dpr,dpr);

  const G = {
    state:"menu",          // menu | ready | wave | over | win
    money:200, lives:20, wave:0, score:0,
    enemies:[], towers:[], shots:[], parts:[], beams:[],
    spawnQ:[], waveTime:0, waveActive:false,
    selType:null, selTower:null, hover:null,
    speed:1, paused:false, sound:true, shake:0, time:0,
    timestop:false, breakT:0, laserActive:false,
    selMapIndex:0, mapColor:"#00e5ff", mapName:"经典蛇道",
  };

  // ---------- 工具函数 ----------
  const TAU = Math.PI*2;
  const rand=(a,b)=>a+Math.random()*(b-a);
  const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;

  // 音效（WebAudio 轻量合成）
  let AC=null, MASTER=null;
  function audio(){
    if(!AC){ try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      // 主音量 + 限幅器：之前所有音直连 destination，多音叠加会破音/过响
      MASTER=AC.createGain(); MASTER.gain.value=0.4;
      const comp=AC.createDynamicsCompressor();
      comp.threshold.value=-14; comp.knee.value=8; comp.ratio.value=12; comp.attack.value=0.003; comp.release.value=0.25;
      MASTER.connect(comp); comp.connect(AC.destination);
    }catch(e){ AC=null; } }
    return AC;
  }
  function beep(freq,dur,type,vol){
    if(!G.sound) return; const ac=audio(); if(!ac) return;
    try{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=type||"square"; o.frequency.value=freq;
      g.gain.value=(vol||0.05); o.connect(g); g.connect(MASTER||ac.destination);
      const t=ac.currentTime; g.gain.setValueAtTime(g.gain.value,t);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.start(t); o.stop(t+dur);
    }catch(e){}
  }
  function noise(dur,vol){
    if(!G.sound) return; const ac=audio(); if(!ac) return;
    try{
      const n=Math.floor(ac.sampleRate*dur), buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
      const s=ac.createBufferSource(); s.buffer=buf;
      const g=ac.createGain(); g.gain.value=vol||0.08; s.connect(g); g.connect(MASTER||ac.destination);
      g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dur);
      s.start();
    }catch(e){}
  }
  // 频率扫频（武器发射感）
  function sweep(f0,f1,dur,type,vol){
    if(!G.sound) return; const ac=audio(); if(!ac) return;
    try{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=type||"sawtooth";
      const t=ac.currentTime;
      o.frequency.setValueAtTime(f0,t);
      o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
      g.gain.setValueAtTime(vol||0.05,t);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(MASTER||ac.destination);
      o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  }
  // 双音和弦（寒冰清脆感）
  function chord(f0,f1,dur,type,vol){
    if(!G.sound) return; const ac=audio(); if(!ac) return;
    try{
      [f0,f1].forEach((f,i)=>{
        const o=ac.createOscillator(), g=ac.createGain();
        o.type=type||"sine"; o.frequency.value=f;
        const t=ac.currentTime;
        g.gain.setValueAtTime((vol||0.04)*(i?0.7:1),t);
        g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
        o.connect(g); g.connect(MASTER||ac.destination); o.start(t); o.stop(t+dur+0.02);
      });
    }catch(e){}
  }
  // 聚能激光：持续嗡鸣（按需启停，全局唯一）
  let laserNodes=null;
  function laserHum(on){
    const ac=audio(); if(!ac) return;
    if(on && !laserNodes){
      try{
        const o=ac.createOscillator(), g=ac.createGain(), lfo=ac.createOscillator(), lg=ac.createGain();
        o.type="sawtooth"; o.frequency.value=130;
        lfo.type="sine"; lfo.frequency.value=28; lg.gain.value=28; lfo.connect(lg); lg.connect(o.frequency);
        g.gain.setValueAtTime(0.0001,ac.currentTime);
        g.gain.linearRampToValueAtTime(0.02,ac.currentTime+0.05);
        o.connect(g); g.connect(MASTER||ac.destination); o.start(); lfo.start();
        laserNodes={o,g,lfo};
      }catch(e){}
    } else if(!on && laserNodes){
      try{
        const {o,g,lfo}=laserNodes, t=ac.currentTime;
        g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value,t);
        g.gain.linearRampToValueAtTime(0.0001,t+0.06);
        o.stop(t+0.08); lfo.stop(t+0.08); laserNodes=null;
      }catch(e){ laserNodes=null; }
    }
  }

  // ---------- 波次生成 ----------
  function buildWave(n){
    const q=[]; const base = 6 + Math.floor(n*1.8);
    let t=0; const gap = Math.max(0.35, 0.95 - n*0.025);
    for(let i=0;i<base;i++){
      let type="grunt";
      if(n>=3 && i%4===0) type="fast";
      if(n>=5 && i%5===0) type="tank";
      q.push({type, t}); t+=gap*rand(0.7,1.3);
    }
    if(n%5===0) q.push({type:"boss", t:t+0.5});
    return q;
  }
  function startWave(){
    if(G.state!=="ready" && G.state!=="menu") return;
    if(G.state==="menu") G.state="ready";
    G.wave++;
    G.spawnQ = buildWave(G.wave);
    G.waveTime=0; G.waveActive=true; G.state="wave";
    updateWaveBtn();
    beep(440,0.12,"sawtooth",0.035);
  }
  function waveCleared(){
    G.waveActive=false; G.state="ready";
    const bonus = 30 + G.wave*8;
    G.money += bonus;
    if(G.wave>=MAX_WAVE){ win(); return; }
    toast("第 "+G.wave+" 波清除！+ "+bonus+" 能量");
    G.breakT = WAVE_BREAK;   // 自动进入下一波倒计时
    updateWaveBtn();
  }

  // ---------- 敌人 ----------
  function spawnEnemy(type){
    const def=ENEMY[type];
    const scale = 1 + (G.wave-1)*0.22;
    const hp = Math.round(def.hp*scale);
    G.enemies.push({
      type, def, x:WAY[0].x, y:WAY[0].y, seg:0,
      hp, maxhp:hp, speed:def.speed, r:def.r, color:def.color,
      slowT:0, slowF:1, dead:false, hitFlash:0, spin:rand(0,TAU),
    });
  }
  function enemyProgress(e){
    // 已走距离（用于选最靠前目标）
    let d=0; for(let i=0;i<e.seg;i++) d+=dist(WAY[i].x,WAY[i].y,WAY[i+1].x,WAY[i+1].y);
    if(e.seg<WAY.length-1) d+=dist(WAY[e.seg].x,WAY[e.seg].y,e.x,e.y);
    return d;
  }
  function moveEnemy(e,dt){
    let sp=e.speed*(e.slowT>0?e.slowF:1);
    let remain=sp*dt;
    while(remain>0 && e.seg<WAY.length-1){
      const tgt=WAY[e.seg+1];
      const dx=tgt.x-e.x, dy=tgt.y-e.y, dd=Math.hypot(dx,dy);
      if(dd<=remain){ e.x=tgt.x; e.y=tgt.y; e.seg++; remain-=dd; }
      else { e.x+=dx/dd*remain; e.y+=dy/dd*remain; remain=0; }
    }
    if(e.seg>=WAY.length-1){ // 到达终点
      e.dead=true; e.reached=true;
    }
  }

  // ---------- 炮塔 ----------
  function placeTower(c,r,type){
    const def=TOWERS[type];
    if(G.money<def.cost) { toast("能量不足"); return; }
    if(PATH_CELLS.has(c+","+r)) { toast("不能建在路径上"); return; }
    if(G.towers.some(t=>t.c===c&&t.r===r)) { toast("此处已有炮塔"); return; }
    const ctr=cellCenter(c,r);
    G.towers.push({
      key:type, def, c, r, x:ctr.x, y:ctr.y, level:1,
      range:def.range, dmg:def.dmg, rate:def.rate, cd:0,
      angle:-Math.PI/2, spent:def.cost, pulse:0,
    });
    G.money-=def.cost;
    beep(660,0.08,"triangle",0.03);
    syncHUD();
  }
  function towerStats(t){
    const lvl=t.level;
    return {
      dmg: Math.round(t.def.dmg*(1+0.6*(lvl-1))),
      range: Math.round(t.def.range*(1+0.10*(lvl-1))),
      rate: t.def.rate*(1+0.12*(lvl-1)),
    };
  }
  function upgradeCost(t){ return Math.round(t.def.cost*0.75*t.level); }

  function fire(t,target,dt){
    const s=towerStats(t);
    if(t.def.proj==="beam"){
      // 持续光束：按 dps 直接扣血
      target.hp -= s.dmg*dt;
      target.hitFlash=0.12;
      G.beams.push({x1:t.x,y1:t.y,x2:target.x,y2:target.y,color:t.def.color,life:0.06});
      G.laserActive=true;
      return;
    }
    if(t.cd>0) return;
    t.cd = 1/Math.max(0.05,s.rate);
    const ang=Math.atan2(target.y-t.y,target.x-t.x);
    t.angle=ang;
    G.shots.push({
      x:t.x,y:t.y,target, speed:420, dmg:s.dmg, color:t.def.color,
      kind:t.def.proj, slow:t.def.slow, slowDur:t.def.slowDur, r:4, dead:false,
    });
    // 枪口火花
    for(let i=0;i<4;i++) G.parts.push(mkPart(t.x+Math.cos(ang)*16,t.y+Math.sin(ang)*16,t.def.color,2,90));
    // 各武器专属发射音
    if(t.key==="sniper") sweep(1300,520,0.05,"triangle",0.03);      // 锐利狙击「咔」
    else if(t.key==="blaster") sweep(340,150,0.07,"square",0.03);  // 脉冲炮「啾」
    else if(t.key==="frost") chord(1040,1560,0.11,"sine",0.025);    // 寒冰核「叮」脆响
    // 聚能激光：持续嗡鸣在 update 中统一控制
  }
  function pickTarget(t){
    let best=null,bp=-1;
    for(const e of G.enemies){
      if(e.dead) continue;
      if(dist(t.x,t.y,e.x,e.y)<=t.range){
        const p=enemyProgress(e);
        if(p>bp){bp=p;best=e;}
      }
    }
    return best;
  }

  // ---------- 子弹 ----------
  function updateShot(s,dt){
    if(!s.target || s.target.dead){ s.dead=true; return; }
    const ang=Math.atan2(s.target.y-s.y,s.target.x-s.x);
    const step=s.speed*dt;
    const dd=dist(s.x,s.y,s.target.x,s.target.y);
    if(dd<=step+ s.target.r){
      // 命中
      s.target.hp-=s.dmg; s.target.hitFlash=0.12;
      if(s.kind==="frost"){ s.target.slowT=s.slowDur; s.target.slowF=s.slow; }
      burst(s.target.x,s.target.y,s.color,10);
      s.dead=true;
    } else {
      s.x+=Math.cos(ang)*step; s.y+=Math.sin(ang)*step;
      // 拖尾
      if(Math.random()<0.6) G.parts.push(mkPart(s.x,s.y,s.color,2,60));
    }
  }

  // ---------- 粒子 ----------
  function mkPart(x,y,color,size,life){
    const a=rand(0,TAU), sp=rand(20,160);
    return {x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,color,size:size*rand(.6,1.4),life:life/60,max:life/60};
  }
  function burst(x,y,color,n){
    for(let i=0;i<n;i++) G.parts.push(mkPart(x,y,color,3,50));
    while(G.parts.length>240) G.parts.shift();   // 粒子上限，防止卡顿
    G.shake=Math.min(G.shake+2,8);
  }
  function updateParts(dt){
    for(const p of G.parts){
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.94; p.vy*=0.94; p.life-=dt;
    }
    G.parts=G.parts.filter(p=>p.life>0);
  }

  // ---------- 主循环 ----------
  let last=performance.now(), lastRender=last;
  function loop(now){
    requestAnimationFrame(loop);
    if(document.hidden) return;            // 标签页隐藏：彻底跳过，省 CPU
    let dt=(now-last)/1000; last=now;
    dt=Math.min(dt,0.05);
    // 空闲（菜单/波间无敌人无子弹）时降到 30fps，战斗中保持 60fps
    const active = G.state==="wave" || G.enemies.length>0 || G.shots.length>0 || G.paused;
    if(!active && now-lastRender < 1000/30){ return; }
    lastRender=now;
    if(!G.paused && G.state!=="menu" && G.state!=="over" && G.state!=="win"){
      const sdt=dt*(G.timestop?SLOW_FACTOR:G.speed);
      update(sdt);
      // 波间自动进入下一波倒计时（真实时间，不受倍速/时停影响）
      if(G.state==="ready" && G.breakT>0){
        G.breakT-=dt;
        if(G.breakT<=0){ G.breakT=0; startWave(); }
        else updateWaveBtn();
      }
    }
    G.time+=dt;
    if(G.shake>0) G.shake=Math.max(0,G.shake-dt*30);
    render();
  }

  function update(dt){
    G.laserActive=false;
    // 生成敌人
    if(G.waveActive){
      G.waveTime+=dt;
      while(G.spawnQ.length && G.spawnQ[0].t<=G.waveTime){
        spawnEnemy(G.spawnQ.shift().type);
      }
    }
    // 敌人移动 / 到达
    for(const e of G.enemies){
      if(e.dead) continue;
      if(e.slowT>0) e.slowT-=dt;
      e.spin+=dt*1.5;
      if(e.hitFlash>0) e.hitFlash-=dt;
      moveEnemy(e,dt);
      if(e.reached){ G.lives--; G.shake=10; noise(0.15,0.06);
        if(G.lives<=0){ lose(); } }
    }
    // 击杀结算
    for(const e of G.enemies){
      if(!e.dead && e.hp<=0){
        e.dead=true;
        G.money+=e.def.reward; G.score+=e.def.reward;
        burst(e.x,e.y,e.color,e.type==="boss"?22:9);
        if(e.type==="boss"){ noise(0.4,0.1); sweep(180,55,0.45,"sawtooth",0.06);} else sweep(300,130,0.06,"square",0.025);
      }
    }
    G.enemies=G.enemies.filter(e=>!e.dead);
    // 炮塔开火
    for(const t of G.towers){
      if(t.cd>0) t.cd-=dt;
      if(t.pulse>0) t.pulse-=dt;
      const tgt=pickTarget(t);
      if(tgt){ if(t.def.proj!=="beam") t.angle=Math.atan2(tgt.y-t.y,tgt.x-t.x); fire(t,tgt,dt); }
    }
    laserHum(G.laserActive && G.sound);   // 聚能激光持续嗡鸣随开火状态启停
    // 子弹
    for(const s of G.shots) updateShot(s,dt);
    G.shots=G.shots.filter(s=>!s.dead);
    // 光束寿命
    for(const b of G.beams) b.life-=dt;
    G.beams=G.beams.filter(b=>b.life>0);
    // 粒子
    updateParts(dt);
    // 波次结束判定
    if(G.waveActive && G.spawnQ.length===0 && G.enemies.length===0 && G.lives>0){
      waveCleared();
    }
    syncHUD();
  }

  // ---------- 渲染 ----------
  function render(){
    ctx.save();
    ctx.clearRect(0,0,W,H);
    // 抖动
    if(G.shake>0){ ctx.translate(rand(-G.shake,G.shake),rand(-G.shake,G.shake)); }
    drawBackground();
    drawPath();
    drawTowers();
    drawEnemies();
    drawShots();
    drawBeams();
    drawParts();
    drawPlacement();
    drawSelection();
    if(G.state==="ready" && G.breakT>0) drawBreakHint();
    if(G.timestop) drawSlowBadge();
    ctx.restore();
  }

  let BG_GRAD=null;
  function drawBackground(){
    // 渐变底（只创建一次）
    if(!BG_GRAD){ BG_GRAD=ctx.createLinearGradient(0,0,0,H); BG_GRAD.addColorStop(0,"#0a1024"); BG_GRAD.addColorStop(1,"#060912"); }
    ctx.fillStyle=BG_GRAD; ctx.fillRect(0,0,W,H);
    // 网格
    ctx.strokeStyle="rgba(90,130,220,.07)"; ctx.lineWidth=1;
    ctx.beginPath();
    for(let c=0;c<=COLS;c++){ ctx.moveTo(c*CELL,0); ctx.lineTo(c*CELL,H); }
    for(let r=0;r<=ROWS;r++){ ctx.moveTo(0,r*CELL); ctx.lineTo(W,r*CELL); }
    ctx.stroke();
    // 漂浮星点
    ctx.fillStyle="rgba(150,190,255,.25)";
    for(let i=0;i<26;i++){
      const x=(i*137.5)%W, y=(i*89.3 + G.time*8)%H;
      const a=0.3+0.3*Math.sin(G.time*2+i);
      ctx.globalAlpha=a; ctx.fillRect(x,y,1.5,1.5);
    }
    ctx.globalAlpha=1;
  }

  function drawPath(){
    // 路面：粗描边 + 流光虚线
    ctx.lineJoin="round"; ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(WAY[0].x,WAY[0].y);
    for(let i=1;i<WAY.length;i++) ctx.lineTo(WAY[i].x,WAY[i].y);
    // 暗底
    ctx.strokeStyle="rgba(10,18,40,.9)"; ctx.lineWidth=CELL*0.82; ctx.stroke();
    ctx.strokeStyle="rgba(40,70,140,.55)"; ctx.lineWidth=CELL*0.7; ctx.stroke();
    // 边缘霓虹（主题色）
    ctx.strokeStyle=G.mapColor; ctx.globalAlpha=0.4; ctx.lineWidth=CELL*0.86;
    ctx.shadowColor=G.mapColor; ctx.shadowBlur=10; ctx.stroke(); ctx.shadowBlur=0; ctx.globalAlpha=1;
    // 流光虚线
    ctx.setLineDash([14,18]); ctx.lineDashOffset=-G.time*40;
    ctx.strokeStyle=G.mapColor; ctx.globalAlpha=0.9; ctx.lineWidth=3; ctx.stroke();
    ctx.globalAlpha=1; ctx.setLineDash([]);
    // 终点（核心）
    const end=WAY[WAY.length-1];
    const pr=26+Math.sin(G.time*3)*3;
    const rg=ctx.createRadialGradient(end.x,end.y,2,end.x,end.y,pr);
    rg.addColorStop(0,"rgba(255,61,240,.9)"); rg.addColorStop(1,"rgba(255,61,240,0)");
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(end.x,end.y,pr,0,TAU); ctx.fill();
    ctx.strokeStyle="#ff3df0"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(end.x,end.y,16,0,TAU); ctx.stroke();
    // 起点
    const st=WAY[0];
    ctx.fillStyle="rgba(0,229,255,.8)"; ctx.beginPath(); ctx.arc(st.x,st.y,9,0,TAU); ctx.fill();
  }

  function poly(x,y,r,sides,rot){
    ctx.beginPath();
    for(let i=0;i<sides;i++){
      const a=rot+i/sides*TAU;
      const px=x+Math.cos(a)*r, py=y+Math.sin(a)*r;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.closePath();
  }
  // 廉价辉光：低透明、大一圈的纯填充，替代昂贵的 shadowBlur（每帧上百次模糊是 CPU 元凶）
  function halo(x,y,r,color,a){
    ctx.globalAlpha=a; ctx.fillStyle=color;
    ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); ctx.globalAlpha=1;
  }
  function drawTowerShape(t,x,y,scale){
    const col=t.def.color;
    const s=scale||1, r=15*s;
    halo(x,y,r*1.7,col,0.16);          // 廉价辉光，替代 shadowBlur
    ctx.save();
    ctx.fillStyle=col; ctx.strokeStyle="#fff"; ctx.lineWidth=2;
    if(t.def.shape==="square"){ ctx.save(); ctx.translate(x,y); ctx.rotate(t.angle+Math.PI/4); ctx.fillRect(-r,-r,2*r,2*r); ctx.strokeRect(-r,-r,2*r,2*r); ctx.restore(); }
    else if(t.def.shape==="triangle"){ poly(x,y,r,3,t.angle+Math.PI/2); ctx.fill(); ctx.stroke(); }
    else if(t.def.shape==="hexagon"){ poly(x,y,r,6,t.spin||0); ctx.fill(); ctx.stroke(); }
    else if(t.def.shape==="pentagon"){ poly(x,y,r,5,t.angle); ctx.fill(); ctx.stroke(); }
    ctx.restore();
    // 炮口朝向小点
    ctx.fillStyle="#fff"; ctx.beginPath();
    ctx.arc(x+Math.cos(t.angle)*r,y+Math.sin(t.angle)*r,2.5,0,TAU); ctx.fill();
    // 等级点
    for(let i=0;i<t.level;i++){
      ctx.fillStyle=col; ctx.beginPath();
      ctx.arc(x-8+i*8, y+20, 2.5,0,TAU); ctx.fill();
    }
  }
  function drawTowers(){
    for(const t of G.towers){
      drawTowerShape(t,t.x,t.y,1);
    }
  }

  function drawEnemies(){
    for(const e of G.enemies){
      const col=e.hitFlash>0?"#ffffff":e.color;
      halo(e.x,e.y,e.r*1.6,col,0.16);
      ctx.save();
      ctx.fillStyle=col; ctx.strokeStyle="rgba(255,255,255,.8)"; ctx.lineWidth=2;
      const r=e.r;
      if(e.def.shape==="circle"){ ctx.beginPath(); ctx.arc(e.x,e.y,r,0,TAU); ctx.fill(); ctx.stroke(); }
      else if(e.def.shape==="triangle"){ poly(e.x,e.y,r,3,e.spin); ctx.fill(); ctx.stroke(); }
      else if(e.def.shape==="square"){ ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(e.spin*0.4); ctx.fillRect(-r,-r,2*r,2*r); ctx.strokeRect(-r,-r,2*r,2*r); ctx.restore(); }
      else if(e.def.shape==="hexagon"){ poly(e.x,e.y,r,6,e.spin); ctx.fill(); ctx.stroke(); }
      ctx.restore();
      // 减速光环
      if(e.slowT>0){ ctx.strokeStyle="rgba(124,255,94,.8)"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(e.x,e.y,r+4,0,TAU); ctx.stroke(); }
      // 血条
      const w=r*2, hpr=clamp(e.hp/e.maxhp,0,1);
      ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(e.x-w/2,e.y-r-9,w,4);
      ctx.fillStyle=hpr>0.5?"#7cff5e":hpr>0.25?"#ffd23d":"#ff6b6b";
      ctx.fillRect(e.x-w/2,e.y-r-9,w*hpr,4);
    }
  }

  function drawShots(){
    for(const s of G.shots){
      halo(s.x,s.y,s.r*1.9,s.color,0.28);
      ctx.fillStyle=s.color; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.fill();
    }
  }
  function drawBeams(){
    for(const b of G.beams){
      ctx.save();
      ctx.globalAlpha=clamp(b.life/0.06,0,1);
      ctx.strokeStyle=b.color; ctx.shadowColor=b.color; ctx.shadowBlur=16; ctx.lineWidth=4; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
      ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=1.5; ctx.stroke();
      ctx.restore();
    }
  }
  function drawParts(){
    for(const p of G.parts){
      ctx.globalAlpha=clamp(p.life/p.max,0,1);
      ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,TAU); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  function drawPlacement(){
    if(!G.selType || !G.hover) return;
    const {c,r}=G.hover; const ctr=cellCenter(c,r);
    const ok = !PATH_CELLS.has(c+","+r) && !G.towers.some(t=>t.c===c&&t.r===r) && G.money>=TOWERS[G.selType].cost;
    ctx.save();
    ctx.globalAlpha=0.9;
    ctx.fillStyle= ok?"rgba(124,255,94,.15)":"rgba(255,80,120,.18)";
    ctx.strokeStyle= ok?"#7cff5e":"#ff5078"; ctx.lineWidth=2;
    roundRect(c*CELL+3,r*CELL+3,CELL-6,CELL-6,8); ctx.fill(); ctx.stroke();
    if(ok){
      const fake={def:TOWERS[G.selType],angle:-Math.PI/2,level:1,spin:0};
      drawTowerShape(fake,ctr.x,ctr.y,0.8);
      // 射程
      ctx.strokeStyle="rgba(0,229,255,.4)"; ctx.setLineDash([6,8]);
      ctx.beginPath(); ctx.arc(ctr.x,ctr.y,TOWERS[G.selType].range,0,TAU); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.restore();
  }
  function drawSelection(){
    if(!G.selTower) return;
    const t=G.selTower;
    const pulse=4+Math.sin(G.time*4)*3;
    ctx.strokeStyle=t.def.color; ctx.lineWidth=2; ctx.setLineDash([5,6]);
    roundRect(t.c*CELL+2,t.r*CELL+2,CELL-4,CELL-4,9); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha=0.18; ctx.fillStyle=t.def.color;
    ctx.beginPath(); ctx.arc(t.x,t.y,t.range,0,TAU); ctx.fill(); ctx.globalAlpha=1;
    ctx.strokeStyle=t.def.color; ctx.beginPath(); ctx.arc(t.x,t.y,t.range,0,TAU); ctx.stroke();
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function drawBreakHint(){
    ctx.save();
    ctx.textAlign="center";
    const cx=W/2, cy=H/2-44;
    ctx.fillStyle="rgba(0,229,255,.9)"; ctx.font="bold 22px -apple-system,sans-serif";
    ctx.fillText("第 "+G.wave+" 波清除！", cx, cy);
    ctx.fillStyle="rgba(220,230,255,.85)"; ctx.font="15px -apple-system,sans-serif";
    ctx.fillText("下一波 "+Math.ceil(G.breakT)+" 秒后自动开始（空格立即开始）", cx, cy+28);
    ctx.restore();
  }
  function drawSlowBadge(){
    ctx.save();
    ctx.textAlign="left";
    ctx.fillStyle="rgba(0,229,255,.92)"; ctx.font="bold 14px -apple-system,sans-serif";
    ctx.fillText("⏸ 慢动作 · 思考中", 16, 30);
    ctx.restore();
  }

  // ---------- HUD ----------
  function syncHUD(){
    document.querySelector("#lives .v").textContent=G.lives;
    document.querySelector("#money .v").textContent=G.money;
    document.querySelector("#wave .v").textContent=G.wave+"/"+MAX_WAVE;
    document.querySelector("#score .v").textContent=G.score;
    // 炮塔按钮可买状态
    document.querySelectorAll(".tower-btn").forEach(b=>{
      const def=TOWERS[b.dataset.key];
      b.classList.toggle("poor", G.money<def.cost);
    });
  }
  function updateWaveBtn(){
    const b=document.getElementById("btn-wave");
    if(G.state==="wave"){ b.disabled=true; b.textContent="第 "+G.wave+" 波 · 进行中"; }
    else if(G.state==="ready"){
      if(G.breakT>0){ b.disabled=false; b.textContent="下一波 "+Math.ceil(G.breakT)+"s ⏩"; }
      else { b.disabled=false; b.textContent="开始第 "+(G.wave+1)+" 波"; }
    }
    else if(G.state==="menu"){ b.disabled=false; b.textContent="开始第 1 波"; }
  }

  // ---------- 升级面板 ----------
  const panel=document.getElementById("panel");
  function showPanel(t){
    G.selTower=t;
    document.getElementById("p-name").textContent=t.def.name;
    document.getElementById("p-sub").textContent="等级 "+t.level+(t.level>=3?"（满级）":"");
    const s=towerStats(t);
    document.getElementById("p-dmg").textContent = t.def.proj==="beam" ? s.dmg+" /秒" : s.dmg;
    document.getElementById("p-rng").textContent=s.range;
    document.getElementById("p-rate").textContent = t.def.proj==="beam" ? "持续" : s.rate.toFixed(2)+" /秒";
    const up=document.getElementById("p-up");
    if(t.level>=3){ up.disabled=true; up.textContent="已满级"; }
    else { up.disabled=false; up.textContent="升级 ("+upgradeCost(t)+")"; }
    document.getElementById("p-sell").textContent="出售 ("+Math.floor(t.spent*0.6)+")";
    panel.style.display="block";
  }
  function hidePanel(){ G.selTower=null; panel.style.display="none"; }
  function doUpgrade(){
    const t=G.selTower; if(!t||t.level>=3) return;
    const cost=upgradeCost(t);
    if(G.money<cost){ toast("能量不足"); return; }
    G.money-=cost; t.spent+=cost; t.level++;
    t.pulse=0.3; beep(700,0.1,"triangle",0.03);
    showPanel(t); syncHUD();
  }
  function doSell(){
    const t=G.selTower; if(!t) return;
    G.money+=Math.floor(t.spent*0.6);
    G.towers=G.towers.filter(x=>x!==t);
    hidePanel(); beep(300,0.1,"square",0.025); syncHUD();
  }

  // ---------- 输入 ----------
  function toLogical(ev){
    const rect=cv.getBoundingClientRect();
    const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-rect.left;
    const cy=(ev.touches?ev.touches[0].clientY:ev.clientY)-rect.top;
    return { x:cx/rect.width*W, y:cy/rect.height*H };
  }
  function cellAt(p){ return { c:Math.floor(p.x/CELL), r:Math.floor(p.y/CELL) }; }
  function onDown(ev){
    audio(); // 用户手势激活音频
    if(G.state==="menu"||G.state==="over"||G.state==="win") return;
    const p=toLogical(ev); const {c,r}=cellAt(p);
    if(c<0||r<0||c>=COLS||r>=ROWS) return;
    if(G.selType){
      placeTower(c,r,G.selType);
      const exists=G.towers.find(t=>t.c===c&&t.r===r);
      if(exists) showPanel(exists);
      return;
    }
    // 选中已有炮塔
    const t=G.towers.find(t=>t.c===c&&t.r===r);
    if(t) showPanel(t); else hidePanel();
  }
  cv.addEventListener("mousedown",onDown);
  cv.addEventListener("touchstart",e=>{e.preventDefault();onDown(e);},{passive:false});
  cv.addEventListener("mousemove",e=>{ G.hover=cellAt(toLogical(e)); });
  cv.addEventListener("mouseleave",()=>{ G.hover=null; });

  // 键盘
  window.addEventListener("keydown",e=>{
    if(e.key>="1"&&e.key<="4"){ selectType(TOWER_ORDER[+e.key-1]); }
    else if(e.key===" "){ e.preventDefault(); if(G.state==="ready"||G.state==="menu") startWave(); }
    else if(e.key==="p"||e.key==="P"){ togglePause(); }
    else if(e.key==="t"||e.key==="T"){ toggleTimestop(); }
    else if(e.key==="Escape"){ G.selType=null; clearSelBtns(); hidePanel(); }
  });

  // ---------- 底部炮塔按钮 ----------
  const towerbar=document.getElementById("towerbar");
  function buildTowerButtons(){
    TOWER_ORDER.forEach((key,i)=>{
      const def=TOWERS[key];
      const b=document.createElement("div");
      b.className="tower-btn"; b.dataset.key=key;
      const c=document.createElement("canvas"); c.width=46; c.height=46;
      drawIcon(c,def);
      const nm=document.createElement("div"); nm.className="nm"; nm.textContent=def.name;
      const cost=document.createElement("div"); cost.className="cost"; cost.textContent=def.cost+" ⚡";
      const tag=document.createElement("div"); tag.className="sub"; tag.style.cssText="font-size:11px;color:var(--muted);margin:0;";
      tag.textContent=def.desc;
      b.appendChild(c); b.appendChild(nm); b.appendChild(tag); b.appendChild(cost);
      b.addEventListener("click",()=>selectType(key));
      towerbar.appendChild(b);
    });
  }
  function drawIcon(c,def){
    const x=c.getContext("2d"); x.clearRect(0,0,46,46);
    const fake={def,angle:-Math.PI/2,level:1,spin:0};
    // 借用主绘制逻辑（缩放）
    const saved=ctx; // 临时切换：用一个小技巧，直接画
    x.save(); x.translate(23,23);
    x.shadowColor=def.color; x.shadowBlur=10; x.fillStyle=def.color; x.strokeStyle="#fff"; x.lineWidth=2;
    const r=14;
    if(def.shape==="square"){ x.rotate(Math.PI/4); x.fillRect(-r,-r,2*r,2*r); x.strokeRect(-r,-r,2*r,2*r); }
    else if(def.shape==="triangle"){ poly2(x,0,0,r,3,Math.PI/2); x.fill(); x.stroke(); }
    else if(def.shape==="hexagon"){ poly2(x,0,0,r,6,0); x.fill(); x.stroke(); }
    else if(def.shape==="pentagon"){ poly2(x,0,0,r,5,0); x.fill(); x.stroke(); }
    x.restore();
  }
  function poly2(x,cx,cy,r,sides,rot){
    x.beginPath();
    for(let i=0;i<sides;i++){ const a=rot+i/sides*TAU; const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r; i?x.lineTo(px,py):x.moveTo(px,py);}
    x.closePath();
  }
  function selectType(key){
    G.selType=key; clearSelBtns();
    document.querySelector('.tower-btn[data-key="'+key+'"]').classList.add("sel");
    hidePanel();
  }
  function clearSelBtns(){ document.querySelectorAll(".tower-btn").forEach(b=>b.classList.remove("sel")); }

  // ---------- 地图选择 ----------
  function drawMapThumb(cv,m){
    const x=cv.getContext("2d"); x.clearRect(0,0,cv.width,cv.height);
    const cw=cv.width, ch=cv.height, u=Math.min(cw/COLS, ch/ROWS);
    const px=c=>c*u+u/2, py=r=>r*u+u/2;
    x.lineJoin="round"; x.lineCap="round";
    // 路面底色
    x.strokeStyle="rgba(40,70,140,.55)"; x.lineWidth=u*0.8;
    x.beginPath(); m.way.forEach(([c,r],i)=>{ i?x.lineTo(px(c),py(r)):x.moveTo(px(c),py(r)); }); x.stroke();
    // 主题色辉光
    x.strokeStyle=m.color; x.shadowColor=m.color; x.shadowBlur=6; x.lineWidth=u*0.4;
    x.beginPath(); m.way.forEach(([c,r],i)=>{ i?x.lineTo(px(c),py(r)):x.moveTo(px(c),py(r)); }); x.stroke(); x.shadowBlur=0;
    // 起点 / 终点
    const s=m.way[0], e=m.way[m.way.length-1];
    x.fillStyle="#00e5ff"; x.beginPath(); x.arc(px(s[0]),py(s[1]),3,0,TAU); x.fill();
    x.fillStyle="#ff3df0"; x.beginPath(); x.arc(px(e[0]),py(e[1]),3,0,TAU); x.fill();
  }
  function buildMapPicker(){
    const wrap=document.getElementById("maps"); wrap.innerHTML="";
    MAPS.forEach((m,i)=>{
      const card=document.createElement("div");
      card.className="map-card"+(i===G.selMapIndex?" sel":""); card.dataset.idx=i;
      const cv=document.createElement("canvas"); cv.width=84; cv.height=48;
      drawMapThumb(cv,m);
      const nm=document.createElement("div"); nm.className="mn"; nm.textContent=m.name; nm.style.color=m.color;
      const md=document.createElement("div"); md.className="md"; md.textContent=m.desc;
      card.appendChild(cv); card.appendChild(nm); card.appendChild(md);
      card.addEventListener("click",()=>{
        G.selMapIndex=i; applyMap(m);
        document.querySelectorAll(".map-card").forEach(c=>c.classList.remove("sel"));
        card.classList.add("sel");
        beep(600,0.06,"triangle",0.025);
      });
      wrap.appendChild(card);
    });
  }

  // ---------- 控制按钮 ----------
  document.getElementById("btn-wave").addEventListener("click",()=>{ audio(); startWave(); });
  document.getElementById("p-up").addEventListener("click",doUpgrade);
  document.getElementById("p-sell").addEventListener("click",doSell);
  document.getElementById("btn-sound").addEventListener("click",function(){
    G.sound=!G.sound; this.textContent=G.sound?"🔊":"🔇"; if(G.sound) audio(); else laserHum(false);
  });
  document.getElementById("btn-speed").addEventListener("click",function(){
    G.speed = G.speed===1?2: G.speed===2?3:1; this.textContent= G.speed===1?"⏩": G.speed===2?"⏩⏩":"▶"; 
  });
  function toggleTimestop(){
    G.timestop=!G.timestop;
    const b=document.getElementById("btn-timestop");
    b.classList.toggle("active",G.timestop);
    b.textContent=G.timestop?"⏸":"⏳";
    toast(G.timestop?"时停 · 慢动作（便于思考）":"恢复正常速度");
    beep(G.timestop?330:520,0.08,"sine",0.025);
  }
  document.getElementById("btn-timestop").addEventListener("click",toggleTimestop);
  function togglePause(){
    if(G.state!=="wave"&&G.state!=="ready") return;
    G.paused=!G.paused; if(G.paused) laserHum(false); toast(G.paused?"已暂停":"继续");
  }

  // ---------- 遮罩 / 结束 ----------
  function toast(msg){
    const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1400);
  }
  const overlay=document.getElementById("overlay");
  function showOverlay(title,desc,btn){
    document.getElementById("ov-title").textContent=title;
    document.getElementById("ov-desc").textContent=desc;
    document.getElementById("ov-btn").textContent=btn;
    overlay.classList.remove("hidden");
  }
  function hideOverlay(){ overlay.classList.add("hidden"); }
  document.getElementById("ov-btn").addEventListener("click",()=>{
    audio();
    const m=MAPS[G.selMapIndex];
    if(G.state==="menu"){ applyMap(m); G.state="ready"; hideOverlay(); updateWaveBtn(); }
    else if(G.state==="over"||G.state==="win"){ applyMap(m); resetGame(); hideOverlay(); }
  });
  function lose(){
    G.state="over"; G.waveActive=false; laserHum(false);
    showOverlay("核心失守","你坚持到了第 "+G.wave+" 波，得分 "+G.score+"。再来一局？","重新开始");
    noise(0.45,0.1);
  }
  function win(){
    G.state="win"; laserHum(false);
    showOverlay("防守成功！","你击退了全部 "+MAX_WAVE+" 波入侵，得分 "+G.score+"！","再玩一次");
    beep(880,0.3,"triangle",0.05);
  }
  function resetGame(){
    laserHum(false);
    G.money=200; G.lives=20; G.wave=0; G.score=0;
    G.enemies=[]; G.towers=[]; G.shots=[]; G.parts=[]; G.beams=[];
    G.spawnQ=[]; G.waveTime=0; G.waveActive=false; G.selType=null; G.selTower=null;
    G.speed=1; G.paused=false; G.shake=0; G.timestop=false; G.breakT=0; G.state="ready";
    document.getElementById("btn-speed").textContent="⏩";
    clearSelBtns(); hidePanel(); syncHUD(); updateWaveBtn();
  }

  // ---------- 启动 ----------
  applyMap(MAPS[G.selMapIndex]);
  buildMapPicker();
  buildTowerButtons();
  syncHUD(); updateWaveBtn();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
