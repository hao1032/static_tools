<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>长度有多大？· 三维长度探险</title>
<style>
  :root {
    --cube-face: rgba(56, 132, 255, .82);
    --cube-edge: #ffffff;
    --ink: #1f2937;
    --panel: rgba(255,255,255,.82);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    overflow: hidden;
    background: #e3f2fd;
    user-select: none;
  }

  /* 背景层：随量级平滑变色 */
  #bg {
    position: fixed; inset: 0; z-index: 0;
    transition: background 1.1s ease;
    background: linear-gradient(180deg, #e3f2fd 0%, #bbdefb 100%);
  }

  /* 顶部标题 */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    padding: 16px 20px 0; text-align: center; pointer-events: none;
  }
  .topbar h1 { margin: 0; font-size: 22px; letter-spacing: 1px; }
  .topbar p { margin: 2px 0 0; font-size: 13px; color: #455a6b; }

  /* 3D 舞台 */
  .stage {
    position: fixed; inset: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    perspective: 1100px;
    perspective-origin: 50% 42%;
  }
  .scene {
    position: relative; top: -26px;
    width: 720px; height: 520px;
    transform-style: preserve-3d;
  }
  /* 切换量级的过渡动画 */
  .scene.out-up   { animation: outUp .55s cubic-bezier(.55,.06,.68,.19) forwards; }
  .scene.out-down { animation: outDown .55s cubic-bezier(.55,.06,.68,.19) forwards; }
  .scene.in-up    { animation: inUp .6s cubic-bezier(.22,1,.36,1) forwards; }
  .scene.in-down  { animation: inDown .6s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes outUp   { to { transform: scale(1.7) translateY(-26px); opacity: 0; filter: blur(6px); } }
  @keyframes outDown { to { transform: scale(.55) translateY(40px); opacity: 0; filter: blur(6px); } }
  @keyframes inUp    { from { transform: scale(.5) translateY(40px); opacity: 0; filter: blur(6px); } to { transform: none; opacity: 1; filter: blur(0); } }
  @keyframes inDown  { from { transform: scale(1.7) translateY(-26px); opacity: 0; filter: blur(6px); } to { transform: none; opacity: 1; filter: blur(0); } }

  /* 地面网格（增强 3D 纵深感） */
  .floor {
    position: absolute; left: 50%; bottom: 96px;
    width: 760px; height: 380px;
    transform: translateX(-50%) rotateX(80deg);
    transform-origin: 50% 100%;
    background-image:
      linear-gradient(rgba(255,255,255,.55) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.55) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 35%, transparent 78%);
            mask-image: radial-gradient(ellipse at 50% 30%, #000 35%, transparent 78%);
    opacity: .7;
  }

  /* 立方体（核心：真实 3D CSS 立方体，缓慢自转） */
  .cube-wrap {
    position: absolute; left: 80px; bottom: 150px;
    transform-style: preserve-3d;
  }
  .cube {
    position: relative; width: var(--e,190px); height: var(--e,190px);
    transform-style: preserve-3d;
    animation: spin 14s linear infinite;
  }
  @keyframes spin {
    from { transform: rotateX(-18deg) rotateY(0deg); }
    to   { transform: rotateX(-18deg) rotateY(360deg); }
  }
  .face {
    position: absolute; width: var(--e,190px); height: var(--e,190px);
    background: var(--cube-face);
    border: 2px solid var(--cube-edge);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--e,190px) * 0.20); font-weight: 800; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.25);
    box-shadow: inset 0 0 26px rgba(255,255,255,.18);
  }
  .f-front  { transform: translateZ(calc(var(--e,190px) / 2)); }
  .f-back   { transform: rotateY(180deg) translateZ(calc(var(--e,190px) / 2)); }
  .f-right  { transform: rotateY(90deg) translateZ(calc(var(--e,190px) / 2)); }
  .f-left   { transform: rotateY(-90deg) translateZ(calc(var(--e,190px) / 2)); }
  .f-top    { transform: rotateX(90deg) translateZ(calc(var(--e,190px) / 2)); }
  .f-bottom { transform: rotateX(-90deg) translateZ(calc(var(--e,190px) / 2)); }

  .cube-cap {
    position: absolute; left: 0; bottom: -34px; width: var(--e,190px);
    transform: translateZ(160px); /* 抬到立方体前面，避免被 3D 面遮挡 */
    text-align: center; font-size: 13px; color: #2b3a47; font-weight: 700;
    text-shadow: 0 1px 2px rgba(255,255,255,.7);
  }

  /* 参考物体（emoji，按真实比例缩放） */
  .ref {
    position: absolute; left: 320px; bottom: 150px;
    transform-style: preserve-3d;
    display: flex; align-items: flex-end; justify-content: center;
    transition: transform .5s ease;
  }
  .ref .emoji {
    display: block; line-height: 1;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,.18));
    transform-origin: 50% 100%;
  }
  .ref-cap {
    position: absolute; left: 100%; bottom: -30px; margin-left: 14px;
    white-space: nowrap; font-size: 13px; color: #2b3a47; font-weight: 700;
    text-shadow: 0 1px 2px rgba(255,255,255,.7);
  }

  /* 阴影 */
  .shadow {
    position: absolute; bottom: 132px; left: 50%;
    width: 460px; height: 60px; transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.18), transparent 70%);
    filter: blur(2px);
  }

  /* 底部信息面板 */
  .hud {
    position: fixed; left: 0; right: 0; bottom: 132px; z-index: 4;
    text-align: center; pointer-events: none;
  }
  .hud .name {
    display: inline-block; font-size: 30px; font-weight: 900;
    color: #11212e;
    background: rgba(255,255,255,.8); border-radius: 14px; padding: 2px 18px;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
  }
  .hud .conv {
    display: table; margin: 6px auto 0; font-size: 15px; color: #33485a; font-weight: 600;
    background: rgba(255,255,255,.8); border-radius: 10px; padding: 3px 14px;
  }
  .hud .note {
    display: table; margin: 5px auto 0; font-size: 15px; color: #3a4f60;
    background: rgba(255,255,255,.8); border-radius: 10px; padding: 3px 14px;
  }

  /* 右侧量级阶梯（可点击跳转） */
  .ladder {
    position: fixed; right: 18px; top: 50%; transform: translateY(-50%);
    z-index: 6; display: flex; flex-direction: column; gap: 8px;
  }
  .ladder button {
    border: 1px solid rgba(0,0,0,.12); background: var(--panel);
    border-radius: 10px; padding: 8px 12px; min-width: 78px;
    font-size: 14px; font-weight: 700; color: #33485a; cursor: pointer;
    box-shadow: 0 2px 8px rgba(16,24,40,.08);
    transition: transform .12s ease, background .15s ease, color .15s ease;
  }
  .ladder button:hover { transform: translateX(-3px); }
  .ladder button.active {
    background: #2563eb; color: #fff; border-color: #1d4ed8;
    box-shadow: 0 6px 16px rgba(37,99,235,.4);
  }

  /* 底部控制条 */
  .controls {
    position: fixed; left: 0; right: 0; bottom: 26px; z-index: 6;
    display: flex; gap: 14px; justify-content: center; align-items: center;
  }
  .controls button {
    border: none; cursor: pointer; font-weight: 800; color: #fff;
    border-radius: 999px; padding: 14px 26px; font-size: 17px;
    box-shadow: 0 8px 22px rgba(16,24,40,.22);
    transition: transform .12s ease, opacity .15s ease, box-shadow .15s ease;
  }
  .controls button:active { transform: translateY(2px) scale(.98); }
  .controls .up   { background: linear-gradient(135deg,#ff8a3d,#ff5e62); }
  .controls .down { background: linear-gradient(135deg,#3aa0ff,#2563eb); }
  .controls .auto { background: linear-gradient(135deg,#46c08a,#1f9d6b); padding: 14px 20px; font-size: 15px; }
  .controls button:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

  @media (max-width: 720px) {
    .scene { transform: scale(.78); }
    .ladder { right: 8px; }
    .ladder button { min-width: 60px; padding: 6px 8px; font-size: 12px; }
    .topbar h1 { font-size: 18px; }
    .hud .name { font-size: 24px; }
  }
</style>
</head>
<body>
  <div id="bg"></div>

  <div class="topbar">
    <h1>📏 长度有多大？</h1>
    <p>点「▲ 更大」或「▼ 更小」改变量级，看看 1 个长度单位到底有多大</p>
  </div>

  <div class="stage">
    <div class="scene" id="scene">
      <div class="floor"></div>
      <div class="shadow" id="shadow"></div>

      <div class="cube-wrap">
        <div class="cube" id="cube">
          <div class="face f-front"><span class="unit">1 m</span></div>
          <div class="face f-back"><span class="unit">1 m</span></div>
          <div class="face f-right"><span class="unit">1 m</span></div>
          <div class="face f-left"><span class="unit">1 m</span></div>
          <div class="face f-top"><span class="unit">1 m</span></div>
          <div class="face f-bottom"><span class="unit">1 m</span></div>
        </div>
        <div class="cube-cap">每条边长 = 1 个长度单位</div>
      </div>

      <div class="ref" id="ref">
        <span class="emoji" id="refEmoji"></span>
        <div class="ref-cap" id="refCap">小学生</div>
      </div>
    </div>
  </div>

  <div class="hud">
    <div class="name" id="levelName">1 米</div>
    <div class="conv" id="conv">基准长度</div>
    <div class="note" id="note">一名小学生大约 1.3 米高，比 1 米立方体高一点</div>
  </div>

  <div class="ladder" id="ladder"></div>

  <div class="controls">
    <button class="down" id="btnDown">▼ 更小</button>
    <button class="auto" id="btnAuto">▶ 自动</button>
    <button class="up" id="btnUp">▲ 更大</button>
  </div>

<script>
  // 量级数据：从毫米到千米，每级 ×10
  var LEVELS = [
    { unit:"毫米", sym:"mm",  cubeLabel:"1 mm", name:"1 毫米",
      conv:"1 毫米 = 0.001 米 = 千分之一米",
      kind:"svg", svg:"sesame", ratio:2, vb:[70,120], cap:"芝麻",
      note:"一粒芝麻大约 2 毫米长，正好是 1 毫米立方体的 2 倍大",
      bg:["#fff3e0","#ffe0b2"] },
    { unit:"厘米", sym:"cm",  cubeLabel:"1 cm", name:"1 厘米",
      conv:"1 厘米 = 0.01 米 = 百分之一米",
      kind:"svg", svg:"fingernail", ratio:1, vb:[80,100], cap:"指甲盖",
      note:"指甲盖大约 1 厘米，和 1 厘米立方体一样大",
      bg:["#fff8e1","#ffecb3"] },
    { unit:"分米", sym:"dm",  cubeLabel:"1 dm", name:"1 分米",
      conv:"1 分米 = 0.1 米 = 十分之一米",
      kind:"svg", svg:"pencil", ratio:1.8, vb:[56,170], cap:"铅笔",
      note:"一支铅笔大约 1.8 分米（18 厘米）长，是立方体的 1.8 倍",
      bg:["#e8f5e9","#c8e6c9"] },
    { unit:"米",   sym:"m",   cubeLabel:"1 m",  name:"1 米",
      conv:"1 米 = 基准长度",
      kind:"svg", svg:"student", ratio:1.3, vb:[100,160], cap:"小学生",
      note:"一名小学生大约 1.3 米高，是 1 米立方体的 1.3 倍",
      bg:["#e3f2fd","#bbdefb"] },
    { unit:"十米", sym:"dam", cubeLabel:"1 dam", name:"1 十米",
      conv:"1 十米 = 10 米",
      kind:"svg", svg:"bus", ratio:1.2, vb:[170,100], cap:"校车",
      note:"一辆校车大约 12 米长，是 1 十米立方体的 1.2 倍",
      bg:["#e1f5fe","#b3e5fc"] },
    { unit:"百米", sym:"hm",  cubeLabel:"1 hm", name:"1 百米",
      conv:"1 百米 = 100 米",
      kind:"svg", svg:"soccerfield", ratio:1.05, vb:[170,100], cap:"足球场",
      note:"一个足球场大约 105 米长，和 1 百米立方体差不多大",
      bg:["#ede7f6","#d1c4e9"] },
    { unit:"千米", sym:"km",  cubeLabel:"1 km", name:"1 千米",
      conv:"1 千米 = 1000 米",
      kind:"svg", svg:"mountain", ratio:1.0, vb:[150,200], cap:"高山",
      note:"一座高山大约 1000 米高，正好等于 1 千米立方体",
      bg:["#cfd8dc","#90caf9"] }
  ];

  var index = 3; // 默认从「米」开始
  var animating = false;
  var autoTimer = null;

  var scene = document.getElementById('scene');
  var cube = document.getElementById('cube');
  var refEmoji = document.getElementById('refEmoji');
  var refCap = document.getElementById('refCap');
  var refBox = document.getElementById('ref');
  var shadow = document.getElementById('shadow');
  var levelName = document.getElementById('levelName');
  var conv = document.getElementById('conv');
  var note = document.getElementById('note');
  var bg = document.getElementById('bg');
  var ladder = document.getElementById('ladder');
  var btnUp = document.getElementById('btnUp');
  var btnDown = document.getElementById('btnDown');
  var btnAuto = document.getElementById('btnAuto');

  // 构建量级阶梯
  LEVELS.forEach(function (lv, i) {
    var b = document.createElement('button');
    b.textContent = lv.unit;
    b.dataset.i = i;
    b.addEventListener('click', function () {
      if (animating || i === index) return;
      go(i > index ? 1 : -1, i);
    });
    ladder.appendChild(b);
  });

  // 所有参考物体都用 SVG 直接绘制（不使用 emoji，保证跨平台一致）
  // 缩放规则：以「最长边 = target(px)」为基准等比缩放；target 由 layout() 按真实 ratio 算出。
  function svgArt(name, target) {
    function sz(vbw, vbh) {
      var s = target / Math.max(vbw, vbh);
      return { w: Math.round(vbw * s), h: Math.round(vbh * s) };
    }
    if (name === 'sesame') {
      var d0 = sz(70,120);
      return '<svg width="' + d0.w + '" height="' + d0.h + '" viewBox="0 0 70 120" xmlns="http://www.w3.org/2000/svg">' +
        '<ellipse cx="35" cy="60" rx="27" ry="53" fill="#e3d0a2" stroke="#c3ad76" stroke-width="3"/>' +
        '<path d="M35 16 Q29 60 35 104" stroke="#cbb383" stroke-width="2.5" fill="none"/>' +
        '<ellipse cx="24" cy="46" rx="8" ry="17" fill="#ffffff" opacity="0.35"/>' +
        '</svg>';
    }
    if (name === 'fingernail') {
      var d1 = sz(80,100);
      return '<svg width="' + d1.w + '" height="' + d1.h + '" viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">' +
        '<rect x="16" y="8" width="48" height="84" rx="24" fill="#efe1ea" stroke="#d3b3c1" stroke-width="3"/>' +
        '<path d="M28 78 a12 9 0 0 1 24 0" fill="#ffffff"/>' +
        '<rect x="24" y="16" width="9" height="56" rx="4" fill="#ffffff" opacity="0.5"/>' +
        '</svg>';
    }
    if (name === 'pencil') {
      var d2 = sz(56,170);
      return '<svg width="' + d2.w + '" height="' + d2.h + '" viewBox="0 0 56 170" xmlns="http://www.w3.org/2000/svg">' +
        '<rect x="18" y="150" width="20" height="14" rx="3" fill="#f2a0b8"/>' +
        '<rect x="18" y="140" width="20" height="10" fill="#c9ccd1"/>' +
        '<rect x="18" y="32" width="20" height="108" rx="3" fill="#f4c430"/>' +
        '<polygon points="18,32 38,32 28,10" fill="#e9c39b"/>' +
        '<polygon points="24,18 28,10 32,18" fill="#3a3a3a"/>' +
        '<rect x="22" y="38" width="4" height="96" fill="#e0b020"/>' +
        '</svg>';
    }
    if (name === 'student') {
      var d3 = sz(100,160);
      return '<svg width="' + d3.w + '" height="' + d3.h + '" viewBox="0 0 100 160" xmlns="http://www.w3.org/2000/svg">' +
        '<rect x="42" y="104" width="9" height="44" rx="4" fill="#3a4a5a"/>' +
        '<rect x="49" y="104" width="9" height="44" rx="4" fill="#3a4a5a"/>' +
        '<ellipse cx="46" cy="150" rx="9" ry="5" fill="#26303a"/>' +
        '<ellipse cx="54" cy="150" rx="9" ry="5" fill="#26303a"/>' +
        '<rect x="24" y="52" width="11" height="42" rx="5" fill="#4f9dff"/>' +
        '<rect x="65" y="52" width="11" height="42" rx="5" fill="#4f9dff"/>' +
        '<circle cx="29.5" cy="95" r="6" fill="#f6c9a6"/>' +
        '<circle cx="70.5" cy="95" r="6" fill="#f6c9a6"/>' +
        '<rect x="34" y="48" width="32" height="60" rx="14" fill="#4f9dff"/>' +
        '<circle cx="50" cy="28" r="19" fill="#f6c9a6"/>' +
        '<path d="M30 27 a20 20 0 0 1 40 0 q-20 -15 -40 0 Z" fill="#5b3b22"/>' +
        '<circle cx="43" cy="29" r="2.4" fill="#333"/>' +
        '<circle cx="57" cy="29" r="2.4" fill="#333"/>' +
        '<path d="M43 37 q7 7 14 0" stroke="#b5654d" stroke-width="2.2" fill="none" stroke-linecap="round"/>' +
        '</svg>';
    }
    if (name === 'bus') {
      var d4 = sz(170,100);
      return '<svg width="' + d4.w + '" height="' + d4.h + '" viewBox="0 0 170 100" xmlns="http://www.w3.org/2000/svg">' +
        '<rect x="10" y="28" width="150" height="48" rx="12" fill="#f6c12e"/>' +
        '<rect x="10" y="28" width="150" height="14" rx="12" fill="#f7cf5c"/>' +
        '<g fill="#bfe3f5" stroke="#fff" stroke-width="1.5">' +
        '<rect x="20" y="46" width="20" height="18" rx="2"/>' +
        '<rect x="46" y="46" width="20" height="18" rx="2"/>' +
        '<rect x="72" y="46" width="20" height="18" rx="2"/>' +
        '<rect x="98" y="46" width="20" height="18" rx="2"/>' +
        '<rect x="124" y="44" width="20" height="22" rx="2"/>' +
        '</g>' +
        '<text x="85" y="68" font-size="15" font-family="sans-serif" font-weight="700" fill="#b5651d" text-anchor="middle">校车</text>' +
        '<circle cx="42" cy="80" r="13" fill="#222"/><circle cx="42" cy="80" r="5" fill="#9aa0a6"/>' +
        '<circle cx="128" cy="80" r="13" fill="#222"/><circle cx="128" cy="80" r="5" fill="#9aa0a6"/>' +
        '<circle cx="156" cy="58" r="4" fill="#fff3b0"/>' +
        '</svg>';
    }
    if (name === 'soccerfield') {
      var d5 = sz(170,100);
      return '<svg width="' + d5.w + '" height="' + d5.h + '" viewBox="0 0 170 100" xmlns="http://www.w3.org/2000/svg">' +
        '<rect x="0" y="0" width="170" height="100" fill="#3fa14a"/>' +
        '<rect x="0" y="0" width="42" height="100" fill="#46ad52"/>' +
        '<rect x="84" y="0" width="42" height="100" fill="#46ad52"/>' +
        '<rect x="8" y="8" width="154" height="84" fill="none" stroke="#fff" stroke-width="3"/>' +
        '<line x1="85" y1="8" x2="85" y2="92" stroke="#fff" stroke-width="2"/>' +
        '<circle cx="85" cy="50" r="18" fill="none" stroke="#fff" stroke-width="2"/>' +
        '<circle cx="85" cy="50" r="2.2" fill="#fff"/>' +
        '<rect x="8" y="30" width="24" height="40" fill="none" stroke="#fff" stroke-width="2"/>' +
        '<rect x="138" y="30" width="24" height="40" fill="none" stroke="#fff" stroke-width="2"/>' +
        '</svg>';
    }
    if (name === 'mountain') {
      var d6 = sz(150,200);
      return '<svg width="' + d6.w + '" height="' + d6.h + '" viewBox="0 0 150 200" xmlns="http://www.w3.org/2000/svg">' +
        '<polygon points="0,190 42,108 84,190" fill="#7d8aa0"/>' +
        '<polygon points="70,190 112,118 150,190" fill="#7d8aa0"/>' +
        '<polygon points="8,190 75,16 142,190" fill="#5d6b80"/>' +
        '<polygon points="60,68 75,16 90,68 84,60 75,66 66,60" fill="#ffffff"/>' +
        '<rect x="0" y="186" width="150" height="14" fill="#9fb070"/>' +
        '</svg>';
    }
    return '';
  }

  // 立方体在所有量级保持同一尺寸（它就是「1 个单位」的固定参照物），
  // 只有物体按 ratio（真实尺寸 / 1 单位）等比变化：物体最长边 = 立方体边长 × ratio。
  // ratio = 物体真实尺寸 / 1 单位立方体；vb = 物体 SVG 的 viewBox 宽高。
  function layout(ratio, vbw, vbh) {
    var cubeLeft = 80, gap = 46, cubeEdge = 180;   // cubeEdge 恒定，不随量级变化
    var objLong = cubeEdge * ratio;
    var taller = vbh >= vbw;
    var objW = taller ? objLong * (vbw / vbh) : objLong;
    var objH = taller ? objLong : objLong * (vbh / vbw);
    var refLeft = cubeLeft + cubeEdge + gap;
    return { cubeLeft:cubeLeft, gap:gap, cubeEdge:cubeEdge, objLong:objLong, objW:objW, objH:objH, refLeft:refLeft };
  }

  function applyContent() {
    var lv = LEVELS[index];
    // 立方体六个面文字
    var faces = cube.querySelectorAll('.unit');
    for (var i = 0; i < faces.length; i++) faces[i].textContent = lv.cubeLabel;
    // 参考物体（svg 直接绘制，严格按 ratio 与立方体等比）
    if (lv.kind === 'svg') {
      var L = layout(lv.ratio, lv.vb[0], lv.vb[1]);
      cube.style.setProperty('--e', Math.round(L.cubeEdge) + 'px');
      refEmoji.style.fontSize = '0';
      refEmoji.innerHTML = svgArt(lv.svg, Math.round(L.objLong));
      ref.style.left = Math.round(L.refLeft) + 'px';
      // 地面阴影跟随这一对
      var pairW = L.cubeEdge + L.gap + L.objW;
      shadow.style.width = Math.round(pairW + 40) + 'px';
      shadow.style.left = Math.round(L.cubeLeft + pairW / 2) + 'px';
    } else {
      refEmoji.innerHTML = '';
      refEmoji.textContent = lv.emoji;
      refEmoji.style.fontSize = Math.round(120 * lv.objScale) + 'px';
    }
    refCap.textContent = lv.cap;
    // 文字面板
    levelName.textContent = lv.name;
    conv.textContent = lv.conv;
    note.textContent = lv.note;
    // 背景
    bg.style.background = 'linear-gradient(180deg, ' + lv.bg[0] + ' 0%, ' + lv.bg[1] + ' 100%)';
    // 阶梯高亮
    var btns = ladder.querySelectorAll('button');
    for (var j = 0; j < btns.length; j++) {
      btns[j].classList.toggle('active', Number(btns[j].dataset.i) === index);
    }
    // 边界禁用
    btnUp.disabled = (index >= LEVELS.length - 1);
    btnDown.disabled = (index <= 0);
  }

  // dir: +1 向上（更大），-1 向下（更小）；target 为阶梯跳转目标
  function go(dir, target) {
    if (animating) return;
    var dest = (target !== undefined) ? target : index + dir;
    if (dest < 0 || dest >= LEVELS.length || dest === index) return;
    animating = true;
    stopAuto();

    var outClass = dir > 0 ? 'out-up' : 'out-down';
    var inClass  = dir > 0 ? 'in-up'  : 'in-down';

    scene.classList.add(outClass);
    onAnimEnd(function () {
      index = dest;
      applyContent();
      scene.classList.remove(outClass);
      scene.classList.add(inClass);
      onAnimEnd(function () {
        scene.classList.remove(inClass);
        animating = false;
      });
    });
  }

  // 监听动画结束（带超时兜底）
  function onAnimEnd(cb) {
    var done = false;
    function handler() {
      if (done) return; done = true;
      scene.removeEventListener('animationend', handler);
      cb();
    }
    scene.addEventListener('animationend', handler);
    setTimeout(handler, 700);
  }

  function stopAuto() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    btnAuto.textContent = '▶ 自动';
  }
  function startAuto() {
    autoTimer = setInterval(function () {
      var next = index + 1;
      if (next >= LEVELS.length) next = 0;
      go(next > index ? 1 : -1, next);
    }, 2600);
    btnAuto.textContent = '⏸ 暂停';
  }
  btnAuto.addEventListener('click', function () {
    if (autoTimer) stopAuto(); else startAuto();
  });

  btnUp.addEventListener('click', function () { go(1); });
  btnDown.addEventListener('click', function () { go(-1); });

  // 键盘：↑/→ 更大，↓/← 更小
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  });

  applyContent();
</script>
</body>
</html>
