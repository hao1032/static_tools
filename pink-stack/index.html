<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#35266f">
  <title>粉色方块：上涌危机</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-page">
    <header class="page-head">
      <a class="back" href="../#game" aria-label="返回游戏列表">←</a>
      <div><p class="eyebrow">SIMPLE QUICK PLAY</p><h1>粉色方块 <span>上涌危机</span></h1></div>
      <button class="icon-button" id="sound" type="button" aria-label="关闭音效" title="音效开关">♫</button>
    </header>

    <section class="game-layout" aria-label="粉色方块游戏">
      <div class="cabinet">
        <div class="hud">
          <div><span>LEVEL</span><strong id="level">1</strong></div>
          <div class="score"><span>SCORE</span><strong id="score">000000</strong></div>
          <div><span>SPEED</span><strong id="speed">1</strong></div>
          <div class="next-piece"><span>NEXT</span><canvas id="next" width="72" height="72" aria-label="下一个方块"></canvas></div>
        </div>
        <div class="board-wrap">
          <canvas id="board" width="400" height="800" aria-label="俄罗斯方块游戏区域" role="img"></canvas>
          <div class="game-overlay" id="overlay">
            <div class="overlay-card">
              <span class="overlay-mark">▦</span>
              <h2 id="overlay-title">准备好了吗？</h2>
              <p id="overlay-copy">清除整行，别让粉色浪潮追上来。</p>
              <button class="primary-button" id="start">开始游戏</button>
            </div>
          </div>
        </div>
        <div class="cabinet-foot"><span>RISING TIDE · STAGE <b id="stage">01</b></span><span>INSERT COURAGE</span></div>
      </div>

      <aside class="side-panel">
        <div class="mission"><span class="live-dot"></span><span id="status">待机中</span><span class="mission-rule"></span><span>最高纪录 <b id="best">0</b></span></div>
        <div class="next-info"><div><span class="label">即将上涌</span><strong id="surge">每 4 块</strong></div><div class="surge-meter" aria-label="上涌进度"><i id="surge-meter"></i></div></div>
        <button class="pause-button" id="pause" type="button" disabled><span>Ⅱ</span> 暂停</button>
        <p class="desktop-hint">方向键移动　↑ / X 旋转　空格硬降</p>
      </aside>
    </section>

    <nav class="touch-controls" aria-label="触屏操作">
      <div class="move-controls">
        <button type="button" data-action="left" aria-label="左移">←</button>
        <button type="button" data-action="down" aria-label="软降">↓</button>
        <button type="button" data-action="right" aria-label="右移">→</button>
      </div>
      <button type="button" data-action="rotate" aria-label="旋转方块"><span>↻</span><small>旋转</small></button>
      <button type="button" data-action="drop" aria-label="直接落下"><span>⇊</span><small>落下</small></button>
    </nav>
    <footer class="page-foot"><span>每清 10 行进入下一关</span><span>上涌行会留下一个随机缺口</span></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
