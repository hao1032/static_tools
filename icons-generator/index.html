<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICO 文字图标生成器</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <a class="back" href="../">← 返回工具箱</a>
    <h1>ICO 文字图标生成器</h1>
  </header>

  <main class="layout">
    <!-- 左侧：控制面板 -->
    <section class="panel">
      <!-- 图标基础设置 -->
      <div class="card">
        <h2>图标设置</h2>
        <div class="row">
          <label class="check">
            <input type="checkbox" id="transparent" />
            <span>透明背景</span>
          </label>
        </div>
        <div class="row">
          <label>背景颜色</label>
          <input type="color" id="bgColor" value="#2563eb" />
        </div>
        <div class="row">
          <label>圆角大小 <span class="val" id="radiusVal">0</span></label>
          <input type="range" id="cornerRadius" min="0" max="128" value="0" />
        </div>
        <div class="row">
          <label class="check">
            <input type="checkbox" id="border" />
            <span>边框</span>
          </label>
        </div>
        <div class="row">
          <label>边框宽度 <span class="val" id="borderWidthVal">16</span></label>
          <input type="range" id="borderWidth" min="1" max="64" value="16" />
        </div>
        <div class="row">
          <label>边框颜色</label>
          <input type="color" id="borderColor" value="#111827" />
        </div>
        <p class="hint">圆角同时作用于背景与边框，单位为 256×256 画布基准像素。勾选“边框”后，即使在透明背景下也能生成带圆角边框的镂空图标。</p>
      </div>

      <!-- 图层 -->
      <div class="card">
        <div id="layers"></div>
        <div class="add-layer-wrap">
          <button id="addLayer" class="btn btn-primary btn-block" type="button">+ 添加层</button>
        </div>
        <p class="hint">每层用右上角「文字 / 图片」切换内容类型，二者互斥。列表越靠上的层显示在越上层，可拖动 ⠿ 调整顺序；在右侧预览里按住内容即可直接拖动改位置。图片缩放 100% 表示等比铺满 256 画布。</p>
      </div>
    </section>

    <!-- 右侧：实时预览 -->
    <aside class="preview-pane">
      <div class="preview-stage">
        <div class="checker"></div>
        <canvas id="preview" width="512" height="512"></canvas>
      </div>
      <div class="preview-meta">
        <span id="previewLabel">预览 256×256</span>
        <div class="preview-tiles" id="tiles"></div>
      </div>

      <!-- 属性：编辑激活层的缩放 / 透明度 / 位置 / 旋转 -->
      <div class="card props-card" id="propsCard">
        <h2 id="propsTitle">属性</h2>
        <div class="layer-body" id="propsBody"></div>
      </div>

      <!-- 导出 -->
      <div class="card export-card">
        <h2>导出</h2>
        <div class="row">
          <label>文件名</label>
          <input type="text" id="fileName" value="icon" class="text-input" />
          <span class="ext">.ico</span>
        </div>
        <div class="export-sizes" id="sizeList"></div>
        <button id="download" class="btn btn-primary btn-block" type="button">生成并下载</button>
      </div>
    </aside>
  </main>

  <script src="./app.js"></script>
</body>
</html>
