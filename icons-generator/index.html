<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="stylesheet" href="../assets/pure-min.css" />
  <link rel="stylesheet" href="../assets/grids-responsive-min.css" />
  <link rel="stylesheet" href="../assets/site.css" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICO 文字图标生成器</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="/version-check.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="back" href="../">← 返回工具箱</a>
    <h1>ICO 文字图标生成器</h1>
    <div class="history-actions" role="group" aria-label="编辑历史">
      <button id="undo" class="btn" type="button" title="撤销（Ctrl/Cmd+Z）" aria-keyshortcuts="Control+Z Meta+Z" disabled>↶ 撤销</button>
      <button id="redo" class="btn" type="button" title="重做（Ctrl+Y 或 Ctrl/Cmd+Shift+Z）" aria-keyshortcuts="Control+Y Control+Shift+Z Meta+Shift+Z" disabled>↷ 重做</button>
    </div>
  </header>

  <main class="layout">
    <!-- 左侧：控制面板 -->
    <section class="panel">
      <!-- 图标基础设置 -->
      <div class="card">
        <h2>图标设置</h2>
        <div class="row">
          <label for="bgColor">背景颜色</label>
          <input type="color" id="bgColor" value="#2563eb" />
        </div>
        <div class="row">
          <label for="backgroundOpacity">背景透明度 <span class="val" id="backgroundOpacityVal">100%</span></label>
          <input type="range" id="backgroundOpacity" min="0" max="100" value="100" />
        </div>
        <div class="row">
          <label>圆角大小 <span class="val" id="radiusVal">0</span></label>
          <input type="range" id="cornerRadius" min="0" max="128" value="0" />
        </div>
        <div class="row">
          <label for="borderWidth">边框宽度 <span class="val" id="borderWidthVal">0</span></label>
          <input type="range" id="borderWidth" min="0" max="64" value="0" />
        </div>
        <div class="row">
          <label>边框颜色</label>
          <input type="color" id="borderColor" value="#111827" />
        </div>
        <p class="hint">背景透明度为 0% 时完全透明；边框宽度为 0 时不显示边框。圆角同时作用于背景与边框，单位为 256×256 画布基准像素。</p>
      </div>

      <!-- 图层 -->
      <div class="card">
        <div id="layers"></div>
        <div class="add-layer-wrap">
          <button id="addLayer" class="btn btn-primary btn-block" type="button">+ 添加层</button>
        </div>
        <p class="hint">每层用右上角「文字 / 图片」切换内容类型，二者互斥。列表越靠上的层显示在越上层，可拖动 ⠿ 调整顺序；在右侧预览里按住内容即可直接拖动改位置。图片缩放 100% 表示等比铺满 256 画布。</p>
      </div>

      <div class="card snapshots-card">
        <h2>快照</h2>
        <div class="snapshot-save">
          <input id="snapshotName" class="text-input" type="text" maxlength="100" aria-label="快照名称" placeholder="快照名称（可选）" />
          <button id="saveSnapshot" class="btn btn-primary" type="button">保存快照</button>
        </div>
        <p class="hint">保存在此浏览器，包含图层和导入图片。下次打开可载入快照继续编辑，载入操作也可以撤销。</p>
        <p id="snapshotStatus" class="snapshot-status" role="status" aria-live="polite"></p>
        <div id="snapshotList" class="snapshot-list"></div>
      </div>
    </section>

    <!-- 右侧：实时预览 -->
    <aside class="preview-pane">
      <div class="preview-stage">
        <div class="checker"></div>
        <canvas id="preview" width="512" height="512"></canvas>
      </div>
      <div class="preview-meta">
        <span id="previewLabel">预览 256×256</span>
        <div class="preview-tiles" id="tiles"></div>
      </div>

      <!-- 属性：编辑激活层的缩放 / 透明度 / 位置 / 旋转 -->
      <div class="card props-card" id="propsCard">
        <h2 id="propsTitle">属性</h2>
        <div class="layer-body" id="propsBody"></div>
      </div>

      <!-- 导出 -->
      <div class="card export-card">
        <h2>导出</h2>
        <div class="row">
          <label>文件名</label>
          <input type="text" id="fileName" value="icon" class="text-input" />
          <span class="ext">.ico</span>
        </div>
        <div class="export-sizes" id="sizeList"></div>
        <button id="download" class="btn btn-primary btn-block" type="button">生成并下载</button>
      </div>
    </aside>
  </main>

  <script src="./app.js"></script>
</body>
</html>
