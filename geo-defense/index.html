<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>几何防线 GEO DEFENSE · 几何塔防</title>
<style>
/* 《几何防线 GEO DEFENSE》样式 */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
:root {
  --bg: #070a12; --panel: rgba(13, 17, 28, 0.92); --line: rgba(148, 163, 184, 0.22);
  --txt: #e2e8f0; --dim: #94a3b8; --gold: #fbbf24; --red: #f87171; --green: #4ade80; --blue: #7dd3fc;
}
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--txt); }
#app { position: absolute; inset: 0; }
canvas#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; z-index: 0; }
.hidden { display: none !important; }

/* ---------- HUD ---------- */
#hud { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; padding: 0 14px; gap: 18px;
  background: linear-gradient(180deg, rgba(7,10,18,0.95), rgba(7,10,18,0.82)); border-bottom: 1px solid var(--line); z-index: 20; }
.hud-group { display: flex; align-items: center; gap: 14px; }
.hud-spacer { flex: 1; }
.stat { display: flex; align-items: center; gap: 6px; font-size: 15px; color: var(--dim); }
.stat b { font-size: 17px; color: var(--txt); font-variant-numeric: tabular-nums; }
.stat.gold b { color: var(--gold); }
.stat.lives b { color: var(--red); }
.stat.wave b { color: var(--blue); }
.hud-btn { background: rgba(30, 41, 59, 0.8); border: 1px solid var(--line); color: var(--txt); font-size: 13px; padding: 5px 11px; border-radius: 4px; cursor: pointer; transition: all .15s; }
.hud-btn:hover { border-color: var(--blue); color: var(--blue); }
.hud-btn.on { background: rgba(125, 211, 252, 0.18); border-color: var(--blue); color: var(--blue); }
.hud-btn.warn { color: var(--gold); border-color: rgba(251, 191, 36, 0.4); }
.hud-btn.warn:hover { background: rgba(251, 191, 36, 0.15); }
.hud-btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }
.hud-btn.off { opacity: 0.45; filter: grayscale(1); }
#waveInfo { font-size: 13px; color: var(--blue); min-width: 150px; }
#waveInfo.urgent { color: var(--red); animation: pulse 0.8s infinite; }
@keyframes pulse { 50% { opacity: 0.45; } }

/* ---------- 武器介绍通栏（页面顶部） ---------- */
#infobar { position: absolute; top: 54px; left: 0; right: 0; height: 62px; background: var(--panel);
  border-bottom: 1px solid var(--line); z-index: 18; display: flex; align-items: stretch; overflow: hidden; }
.bar-tag { flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
  font-size: 12px; letter-spacing: 2px; border-right: 1px dashed var(--line); }
#infobar .bar-tag { color: var(--blue); background: rgba(125, 211, 252, 0.06); min-width: 86px; }
#topbar .bar-tag { color: var(--gold); background: rgba(251, 191, 36, 0.06); min-width: 62px; }
#tinfo { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 12px; }
#tinfo h3 { font-size: 14px; display: flex; align-items: center; gap: 5px; white-space: nowrap; flex: 0 0 auto; }
#tinfo .lv { font-size: 11px; color: var(--gold); white-space: nowrap; }
#tinfo .desc { color: var(--dim); font-size: 11px; line-height: 1.45; flex: 1 1 auto; min-width: 0; }
#tinfo .hint { color: var(--dim); font-size: 11px; white-space: nowrap; flex: 0 0 auto; }
.tstats { display: flex; align-items: center; flex-wrap: wrap; gap: 3px 10px; font-size: 11px; color: var(--dim); flex: 0 1 auto; }
.tstats b { color: var(--txt); margin-left: 2px; font-variant-numeric: tabular-nums; }
.tstats .up b { color: var(--green); }
.syn-badges { display: flex; flex-wrap: wrap; gap: 3px; flex: 0 1 auto; }
.syn-badge { font-size: 10px; background: rgba(125, 211, 252, 0.15); border: 1px solid rgba(125, 211, 252, 0.4); color: var(--blue); padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
.tbtns { display: flex; gap: 6px; flex: 0 0 auto; }
.tbtn { background: rgba(30, 41, 59, 0.9); border: 1px solid var(--line); color: var(--txt); font-size: 12px; padding: 5px 10px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
.tbtn:hover { border-color: var(--blue); }
.tbtn.up { color: var(--green); border-color: rgba(74, 222, 128, 0.35); }
.tbtn.up:hover { background: rgba(74, 222, 128, 0.12); }
.tbtn.sell { color: var(--red); border-color: rgba(248, 113, 113, 0.3); }
.tbtn.sell:hover { background: rgba(248, 113, 113, 0.12); }
.tbtn:disabled { opacity: 0.4; cursor: default; }

/* ---------- 群攻武器一排（顶部通栏，正方形卡居中，不滚动） ---------- */
#topbar { position: absolute; top: 116px; left: 0; right: 0; height: 68px; background: var(--panel);
  border-bottom: 1px solid var(--line); z-index: 18; display: flex; align-items: stretch; }
#twlist { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 0 12px; height: 100%;
  overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
#twlist::-webkit-scrollbar { height: 5px; } #twlist::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.3); border-radius: 3px; }

/* ---------- 左侧：单体武器（正方形卡单列，窄栏省空间） ---------- */
#side { position: absolute; top: 184px; left: 0; bottom: 0; width: 84px; background: var(--panel); border-right: 1px solid var(--line); z-index: 15; display: flex; flex-direction: column; }
.wgroup { grid-column: 1 / -1; font-size: 10px; color: var(--dim); letter-spacing: 1px; line-height: 1.2; padding: 3px 2px 2px; border-bottom: 1px dashed rgba(148, 163, 184, 0.18); flex: 0 0 auto; text-align: center; }
#wlist { flex: 1; overflow-y: auto; padding: 5px 6px 6px; display: grid; grid-template-columns: 64px; gap: 5px; justify-content: center; align-content: start; }
#wlist::-webkit-scrollbar { width: 6px; } #wlist::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.3); border-radius: 3px; }

/* ---------- 右侧：减速 / 辅助 / 无人机（正方形卡单列，窄栏省空间） ---------- */
#rside { position: absolute; top: 184px; right: 0; bottom: 0; width: 84px; background: var(--panel); border-left: 1px solid var(--line); z-index: 15; display: flex; flex-direction: column; }
.rgroup { grid-column: 1 / -1; font-size: 10px; color: var(--dim); letter-spacing: 1px; line-height: 1.2; padding: 3px 2px 2px; border-bottom: 1px dashed rgba(148, 163, 184, 0.18); flex: 0 0 auto; text-align: center; }
#rwlist { flex: 1; overflow-y: auto; padding: 5px 6px 6px; display: grid; grid-template-columns: 64px; gap: 5px; justify-content: center; align-content: start; }
#rwlist::-webkit-scrollbar { width: 6px; } #rwlist::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.3); border-radius: 3px; }

/* ---------- 武器卡（三端统一：64×64 正方形，竖排 图标/名称/价格） ---------- */
.witem, .ritem, .titem { width: 64px; height: 64px; flex: 0 0 auto; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 1px; background: rgba(30, 41, 59, 0.55);
  border: 1px solid var(--line); border-radius: 7px; padding: 2px; text-align: center; cursor: pointer;
  transition: all .12s; position: relative; }
.witem:hover, .ritem:hover, .titem:hover { border-color: var(--blue); transform: translateY(-1px); }
.witem.sel, .ritem.sel, .titem.sel { border-color: var(--gold); background: rgba(251, 191, 36, 0.14); box-shadow: 0 0 10px rgba(251, 191, 36, 0.25); }
.witem.poor, .ritem.poor, .titem.poor { opacity: 0.45; }
.wi-ico { line-height: 1; display: flex; align-items: center; justify-content: center; height: 26px; }
.wi-ico canvas { display: block; width: 26px !important; height: 26px !important; }
.wi-name { width: 100%; font-size: 10px; color: var(--txt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wi-cost { font-size: 9px; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
.wi-key { position: absolute; top: 2px; left: 4px; font-size: 8px; color: var(--dim); }
/* 顶部群攻排：窄窗自适应收缩，aspect-ratio 保持正方形（≤64px） */
.titem { width: auto; height: auto; flex: 1 1 0; min-width: 0; max-width: 64px; aspect-ratio: 1 / 1; }
#synbar { position: absolute; left: 96px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; z-index: 12; pointer-events: none; }
.syn-chip { font-size: 11px; background: rgba(13, 17, 28, 0.85); border: 1px solid rgba(125, 211, 252, 0.35); color: var(--blue); padding: 3px 9px; border-radius: 4px; animation: chipIn .3s; }
@keyframes chipIn { from { transform: translateX(-16px); opacity: 0; } }

/* ---------- 全屏界面 ---------- */
.screen { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 35%, rgba(30, 41, 59, 0.4), rgba(7, 10, 18, 0.96) 70%); }
.screen h1 { font-size: 64px; letter-spacing: 10px; font-weight: 900;
  background: linear-gradient(135deg, #7dd3fc, #c084fc, #f472b6); -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: 0 0 60px rgba(125, 211, 252, 0.3); margin-bottom: 4px; }
.screen .sub { color: var(--dim); letter-spacing: 4px; font-size: 14px; margin-bottom: 42px; }
.big-btn { min-width: 220px; margin: 7px; padding: 13px 34px; font-size: 17px; letter-spacing: 3px; color: var(--txt);
  background: rgba(30, 41, 59, 0.7); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; transition: all .18s; }
.big-btn:hover { border-color: var(--blue); color: var(--blue); box-shadow: 0 0 24px rgba(125, 211, 252, 0.25); transform: translateY(-2px); }
.big-btn.primary { background: linear-gradient(135deg, rgba(125,211,252,0.22), rgba(192,132,252,0.22)); border-color: rgba(125,211,252,0.5); }
.credit { position: absolute; bottom: 26px; color: rgba(148, 163, 184, 0.5); font-size: 12px; letter-spacing: 2px; }
/* 标题动画 */
.title-deco { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.title-deco i { position: absolute; border: 1px solid rgba(125, 211, 252, 0.25); animation: floatRot linear infinite; opacity: 0.5; }
@keyframes floatRot { from { transform: rotate(0deg) translateY(0); } to { transform: rotate(360deg) translateY(-30px); } }

/* 地图选择 */
#scr-maps h2 { font-size: 26px; letter-spacing: 6px; margin-bottom: 6px; }
.diff-row { display: flex; gap: 8px; margin: 12px 0 18px; }
.diff-btn { padding: 6px 20px; font-size: 13px; background: rgba(30,41,59,0.7); border: 1px solid var(--line); color: var(--dim); border-radius: 4px; cursor: pointer; }
.diff-btn.on { color: var(--gold); border-color: rgba(251,191,36,0.5); background: rgba(251,191,36,0.1); }
#mapGrid { display: grid; grid-template-columns: repeat(4, 218px); gap: 12px; max-height: 62vh; overflow-y: auto; padding: 4px; }
.map-card { background: rgba(15, 23, 42, 0.8); border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; transition: all .15s; position: relative; overflow: hidden; }
.map-card:hover { border-color: var(--blue); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
.map-card .mc-no { position: absolute; top: 8px; left: 10px; font-size: 20px; font-weight: 900; color: rgba(255,255,255,0.14); }
.map-card canvas { width: 100%; height: 62px; border-radius: 4px; background: rgba(0,0,0,0.3); display: block; }
.map-card .mc-name { font-size: 15px; font-weight: 700; margin: 7px 0 3px; }
.map-card .mc-meta { font-size: 11px; color: var(--dim); display: flex; justify-content: space-between; }
.map-card .mc-tags { display: flex; gap: 3px; margin-top: 5px; flex-wrap: wrap; }
.mc-tag { font-size: 9px; padding: 1px 5px; border-radius: 3px; background: rgba(125,211,252,0.12); color: var(--blue); border: 1px solid rgba(125,211,252,0.25); }
.mc-tag.boss { background: rgba(248,113,113,0.12); color: var(--red); border-color: rgba(248,113,113,0.3); }
.mc-best { position: absolute; top: 8px; right: 10px; font-size: 10px; color: var(--gold); }

/* 帮助 / 暂停 / 结算 */
.panel-box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 26px 34px; max-width: 760px; max-height: 76vh; overflow-y: auto; }
.panel-box h2 { font-size: 22px; letter-spacing: 4px; margin-bottom: 14px; text-align: center; }
.panel-box h3 { font-size: 15px; color: var(--blue); margin: 14px 0 6px; }
.panel-box p, .panel-box li { font-size: 13px; color: var(--dim); line-height: 1.8; }
.panel-box ul { padding-left: 20px; }
.kbd { display: inline-block; background: rgba(30,41,59,0.9); border: 1px solid var(--line); border-radius: 3px; padding: 0 6px; font-size: 11px; color: var(--txt); }
.syn-table { width: 100%; font-size: 12px; border-collapse: collapse; margin-top: 6px; }
.syn-table td { padding: 5px 8px; border-bottom: 1px solid rgba(148,163,184,0.12); color: var(--dim); }
.syn-table td:first-child { color: var(--blue); white-space: nowrap; font-weight: 700; }
.end-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 26px; margin: 16px 0; font-size: 14px; }
.end-stats div { display: flex; justify-content: space-between; color: var(--dim); }
.end-stats b { color: var(--txt); font-variant-numeric: tabular-nums; }
.end-stars { font-size: 34px; letter-spacing: 8px; margin: 6px 0; color: var(--gold); text-align: center; }
.end-title { font-size: 40px; letter-spacing: 8px; font-weight: 900; text-align: center; margin-bottom: 4px; }
.end-title.win { background: linear-gradient(135deg, #fde047, #f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent; }
.end-title.lose { color: var(--red); }

/* 横幅 */
#banner { position: absolute; top: 24%; left: 0; right: 0; text-align: center; z-index: 30; pointer-events: none; font-size: 42px; font-weight: 900; letter-spacing: 6px; opacity: 0; }
#banner.show { animation: bannerSweep 2.2s ease-out; }
@keyframes bannerSweep {
  0% { opacity: 0; transform: scale(1.6); filter: blur(8px); }
  14% { opacity: 1; transform: scale(1); filter: blur(0); }
  78% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(0.92) translateY(-14px); }
}

/* 提示浮层 */
#tooltip { position: absolute; z-index: 50; pointer-events: none; background: rgba(10, 14, 24, 0.96); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; font-size: 12px; max-width: 230px; display: none; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
#tooltip h4 { font-size: 13px; margin-bottom: 3px; }
#tooltip .tt-cost { color: var(--gold); }
#tooltip .tt-desc { color: var(--dim); line-height: 1.5; margin-top: 3px; }
#tooltip .tt-stats { color: var(--txt); font-size: 11px; margin-top: 4px; line-height: 1.7; }

</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-group">
      <div class="stat gold">💰 <b id="hud-gold">0</b></div>
      <div class="stat lives">❤ <b id="hud-lives">20</b></div>
      <div class="stat wave">🌊 <b id="hud-wave">0</b>/20</div>
      <div class="stat score">⭐ <b id="hud-score">0</b></div>
    </div>
    <div class="hud-spacer"></div>
    <div class="hud-group">
      <span id="waveInfo">准备中</span>
      <button id="btn-early" class="hud-btn warn">⚡ 提前出击</button>
      <label class="hud-btn on" style="cursor:pointer"><input type="checkbox" id="autoWaveChk" checked style="vertical-align:-2px"> 自动</label>
      <button id="spd0" class="hud-btn" title="暂停">⏸</button>
      <button id="spd1" class="hud-btn on" title="正常速度">▶</button>
      <button id="spd2" class="hud-btn" title="2倍速">▶▶</button>
      <button id="spd3" class="hud-btn" title="3倍速">▶▶▶</button>
      <button id="btn-sound" class="hud-btn" title="音效开关">🔊</button>
      <button id="btn-pause" class="hud-btn">⏸ 菜单</button>
    </div>
  </div>

  <!-- 武器介绍（顶部通栏） -->
  <div id="infobar" class="hidden">
    <div class="bar-tag">武器介绍</div>
    <div id="tinfo"></div>
  </div>

  <!-- 群攻武器一排（顶部通栏） -->
  <div id="topbar" class="hidden">
    <div class="bar-tag">群攻</div>
    <div id="twlist"></div>
  </div>

  <!-- 侧栏：单体武器单列 -->
  <div id="side" class="hidden">
    <div id="wlist"></div>
  </div>

  <!-- 右侧：减速 / 辅助 / 无人机 -->
  <div id="rside" class="hidden">
    <div id="rwlist"></div>
  </div>
  <div id="synbar" class="hidden"></div>

  <!-- 横幅 -->
  <div id="banner"></div>

  <!-- 标题 -->
  <div id="scr-title" class="screen">
    <div class="title-deco" id="titleDeco"></div>
    <h1>几何防线</h1>
    <div class="sub">GEO DEFENSE · 12 战区 · 30 武器 · 25 强敌</div>
    <button id="btn-start" class="big-btn primary">开 始 游 戏</button>
    <button id="btn-help" class="big-btn">玩 法 说 明</button>
    <div class="credit">WorkBuddy「1024 造物挑战」程序员节应用创作大赛 · 参赛作品</div>
  </div>

  <!-- 地图选择 -->
  <div id="scr-maps" class="screen hidden">
    <h2>选择战区</h2>
    <div class="diff-row">
      <button class="diff-btn" data-d="0">☕ 休闲</button>
      <button class="diff-btn on" data-d="1">⚔ 标准</button>
      <button class="diff-btn" data-d="2">💀 噩梦</button>
    </div>
    <div id="mapGrid"></div>
    <div style="margin-top:14px"><button id="btn-maps-back" class="big-btn" style="min-width:160px;padding:8px 26px;font-size:14px">← 返回主菜单</button></div>
  </div>

  <!-- 帮助 -->
  <div id="scr-help" class="screen hidden">
    <div class="panel-box"><div id="helpBody"></div>
      <div style="text-align:center;margin-top:16px"><button id="btn-help-back" class="big-btn" style="min-width:160px;padding:8px 26px;font-size:14px">← 返 回</button></div>
    </div>
  </div>

  <!-- 暂停 -->
  <div id="scr-pause" class="screen hidden">
    <div class="panel-box" style="min-width:380px">
      <h2>游戏暂停</h2>
      <div class="end-stats" id="pauseStats"></div>
      <div style="text-align:center;margin-top:8px">
        <button id="btn-resume" class="big-btn primary" style="min-width:150px;padding:10px 24px;font-size:15px">继续游戏</button>
        <button id="btn-restart" class="big-btn" style="min-width:150px;padding:10px 24px;font-size:15px">重新开始</button>
        <button id="btn-pause-help" class="big-btn" style="min-width:150px;padding:10px 24px;font-size:15px">玩法说明</button>
        <button id="btn-pause-quit" class="big-btn" style="min-width:150px;padding:10px 24px;font-size:15px">主菜单</button>
      </div>
    </div>
  </div>

  <!-- 结算 -->
  <div id="scr-end" class="screen hidden">
    <div class="panel-box" style="min-width:440px">
      <div class="end-title" id="endTitle"></div>
      <div class="end-stars" id="endStars"></div>
      <div class="end-stats" id="endStats"></div>
      <div style="text-align:center;margin-top:10px">
        <button id="btn-end-again" class="big-btn primary" style="min-width:140px;padding:10px 22px;font-size:15px">再来一次</button>
        <button id="btn-end-maps" class="big-btn" style="min-width:140px;padding:10px 22px;font-size:15px">选择战区</button>
        <button id="btn-end-menu" class="big-btn" style="min-width:140px;padding:10px 22px;font-size:15px">主菜单</button>
      </div>
    </div>
  </div>

  <div id="tooltip"></div>
</div>
<script>
/* ============================================================
 * 《几何防线 GEO DEFENSE》— 数据配置
 * 12 张地图 / 30 种几何武器 / 15 种怪物 / 10 种 BOSS / 组合叠加
 * ============================================================ */
var GAME_NAME = '几何防线';
var GAME_SUB = 'GEO DEFENSE · 1024 造物挑战';

/* ---------- 世界常量 ---------- */
var TILE = 42, GW = 24, GH = 15;
/* 布局：HUD / 武器介绍通栏 / 群攻横排 / 左单体单列 / 右侧功能栏 */
var SIDE_W = 84, RSIDE_W = 84, HUD_H = 54, INFOBAR_H = 62, TOPBAR_H = 68;
var FIELD_X = SIDE_W + 18, FIELD_Y = HUD_H + INFOBAR_H + TOPBAR_H + 18;
/* 世界尺寸由布局推导：战场 + 右/下 18px 留白，保证 24×15 网格完整入画 */
var WORLD_W = FIELD_X + GW * TILE + 18, WORLD_H = FIELD_Y + GH * TILE + 18;

/* ---------- 难度 ---------- */

    if (live < 3) {

      spawnEffect('ring', t.x, t.y, 0, 20, '#2dd4bf', 0.3);

/* ---------- 弹道更新 ---------- */
function updateProj(p, dt) {
  p.t += dt;
  if (p.kind === 'satMark') return;
  if (p.lobbed && p.target) { p.tx = p.target.x; p.ty = p.target.y; }
  if (p.target && !p.target.dead && (p.kind === 'missile' || p.kind === 'dart' || p.kind === 'arrow' || p.kind === 'bolt' || p.kind === 'orbbolt' || p.kind === 'dronebolt' || p.kind === 'star' || p.kind === 'glob' || p.kind === 'frost' || p.kind === 'glue')) {
    var a = Math.atan2(p.target.y - p.y, p.target.x - p.x);
    p.vx = Math.cos(a) * p.spd; p.vy = Math.sin(a) * p.spd;
  }
  if (p.kind === 'boom' && p.ret) {
    if (p.t > 0.75) {
      if (!p.turned) { p.turned = 1; p.hitList = []; }  // 掉头瞬间清空命中记录，回程可再打击一次
      var b = Math.atan2(p.from.y - p.y, p.from.x - p.x); p.vx = Math.cos(b) * p.spd; p.vy = Math.sin(b) * p.spd;
    }
  }
  p.x += p.vx * dt; p.y += p.vy * dt;
  p.rot = Math.atan2(p.vy, p.vx);
  // 碰撞
  for (var i = 0; i < G.enemies.length; i++) {
    var e = G.enemies[i];
    if (e.dead || p.hitSet[i] || p.hitList.indexOf(e) >= 0) continue;
    var from = p.from;
    if (from && !canTarget(from, e)) continue;
    if (dist(p.x, p.y, e.x, e.y) < e.size + 5) {
      if (p.pierce > 0) { p.hitSet[i] = 1; p.pierce--; damageEnemy(e, p.dmg, p.dtype, from); applyProjEffects(p, e); spawnEffect('spark', p.x, p.y, 0, 0, p.color, 0.2, 4); }
      else if (p.bounces > 0) {
        p.hitSet[i] = 1;
        damageEnemy(e, p.dmg, p.dtype, from); applyProjEffects(p, e);
        spawnEffect('spark', p.x, p.y, 0, 0, p.color, 0.2, 4);
        var next = null, bd = 1e9;
        for (var j = 0; j < G.enemies.length; j++) {
          var e2 = G.enemies[j];
          if (e2.dead || p.hitSet[j] || (from && !canTarget(from, e2))) continue;
          var dd = dist(p.x, p.y, e2.x, e2.y);
          if (dd < p.brad && dd < bd) { bd = dd; next = e2; }
        }
        if (next) { var a2 = Math.atan2(next.y - p.y, next.x - p.x); p.vx = Math.cos(a2) * p.spd; p.vy = Math.sin(a2) * p.spd; p.bounces--; }
        else p.life = 0;
      } else {
        damageEnemy(e, p.dmg, p.dtype, from);
        applyProjEffects(p, e);
        /* 有溅射时用爆炸统一结算：直击目标已在爆炸中心，不应再吃一次直接伤害 */
        if (p.splash) explode(p.x, p.y, p.splash * (from && from.syn.focus ? 1.25 : 1), p.dmg, p.dtype, from, e);
        else spawnEffect('spark', p.x, p.y, rnd(-80, 80), rnd(-80, 80), p.color, 0.25, 4);
        if (p.kind === 'dronebolt') spawnEffect('ring', p.x, p.y, 0, 12, '#5eead4', 0.22);
        if (p.kind !== 'boom') p.life = 0;      // 普通弹道命中即消失
        else p.hitList.push(e);                 // 回旋镖存活：同一敌人本次经过只结算一次
      }
    }
  }
  // 落地（投石）——本帧已被碰撞销毁的弹丸不重复爆炸
  if (p.lobbed && p.target && p.life > 0 && dist(p.x, p.y, p.tx, p.ty) < 14) {
    explode(p.x, p.y, p.splash * (p.from && p.from.syn.focus ? 1.25 : 1), p.dmg, p.dtype, p.from);
    p.life = 0;
  }
  if (p.ret && p.t > 1.5 && dist(p.x, p.y, p.from.x, p.from.y) < 16) p.life = 0;
  if (p.t > p.life) p.life = 0;
}
function applyProjEffects(p, e) {
  if (p.slow) { e.slowT = Math.max(e.slowT, p.sdur); e.slowV = Math.max(e.slowV, p.slow); e.iced = true; }
  if (p.poison) { e.poisT = Math.max(e.poisT, p.pdur); e.poisDps = Math.max(e.poisDps, p.poison * (p.from && p.from.syn.toxfire ? 1.5 : 1)); }
}
function explode(x, y, radius, dmg, dtype, from, skipE) {
  spawnEffect('ring', x, y, 0, radius, '#fca5a5', 0.35, 4);
  for (var i = 0; i < 8; i++) spawnEffect('shard', x, y, rnd(-160, 160), rnd(-160, 60), '#f97316', rnd(0.3, 0.6), rnd(3, 6));
  for (var j = 0; j < G.enemies.length; j++) {
    var e = G.enemies[j];
    if (e.dead || e === skipE) continue;   // skipE：已被直击结算的目标，不重复吃爆炸伤害
    var d = dist(x, y, e.x, e.y);
    if (d > radius) continue;
    if (from && !canTarget(from, e)) continue;
    damageEnemy(e, dmg * (1 - 0.5 * d / radius), dtype, from);
  }
  if (SFX) SFX.play('boom');
}

/* ---------- 敌人更新 ---------- */
function updateEnemy(e, dt) {
  if (e.dead) return;
  e.hitFlash = Math.max(0, e.hitFlash - dt);
  // 状态
  if (e.slowT > 0) e.slowT -= dt; else { e.slowV = 0; e.iced = false; }
  if (e.burnT > 0) { e.burnT -= dt; damageEnemy(e, e.burnDps * dt, 'fire'); if (Math.random() < dt * 12) spawnEffect('flame', e.x + rnd(-8, 8), e.y + rnd(-8, 8), 0, -30, '#f97316', 0.3, 3); }
  if (e.poisT > 0) { e.poisT -= dt; damageEnemy(e, e.poisDps * dt, 'poison'); if (Math.random() < dt * 6) spawnEffect('spark', e.x + rnd(-8, 8), e.y + rnd(-8, 8), 0, 20, '#a3e635', 0.4, 3); }
  if (e.invuln > 0) e.invuln -= dt;
  if (e.reflectT > 0) e.reflectT -= dt;
  var spd = e.spd;
  if (e.slowT > 0) spd *= (1 - e.slowV);
  spd *= e.timeSlow;
  e.timeSlow = 1;
  // 引力偏移衰减
  if (e.px || e.py) {
    e.px *= Math.max(0, 1 - 3 * dt); e.py *= Math.max(0, 1 - 3 * dt);
    if (Math.abs(e.px) < 0.3) e.px = 0;
    if (Math.abs(e.py) < 0.3) e.py = 0;
  }
  // dash / 跳跃 / 相位（普通怪与 BOSS 通用）
  if (e.dashT > 0) { e.dashT -= dt; spd *= 3; if (Math.random() < dt * 30) spawnEffect('spark', e.x, e.y, 0, 0, '#fde047', 0.25, 3); }
  else if (e.def.dash) {
    e.dashCd -= dt;

  }

      var lg = !!(G.lowGrav && e.def.jump);

      e.jumpCd = lg ? rnd(1.1, 1.9) : rnd(2, 3);
    }
    if (e.jumpT > 0) { e.jumpT -= dt; }
  }
  if (e.def.ghost) { e.phaseT += dt; }
  if (e.def.weave) e.weaveT += dt;
  // 移动
  if (e.fly) {
    e.ft += spd * dt;
    syncEnemyPos(e);
    if (e.ft >= e.flen) leakEnemy(e);
  } else {
    e.dist += spd * dt;
    syncEnemyPos(e);
    if (e.dist >= G.paths[e.path].len) leakEnemy(e);
  }
  // 治疗
  if (e.def.heal) {
    e.healCd -= dt;
    if (e.healCd <= 0) {
      e.healCd = 2;
      for (var i = 0; i < G.enemies.length; i++) {
        var o = G.enemies[i];
        if (o.dead || o === e) continue;
        if (dist(o.x, o.y, e.x, e.y) < 65 && o.hp < o.maxHp * 0.9) {
          o.hp = Math.min(o.maxHp, o.hp + o.maxHp * 0.03);
          if (Math.random() < 0.3) addBeam(e.x, e.y, o.x, o.y, '#4ade80', 0.2, 2, 'heal');
        }
      }
    }
  }
  // 章鱼远程
  if (e.def.ranged) {
    e.rangedCd -= dt;
    if (e.rangedCd <= 0) {

      var best = null, bd = 110;
      for (var ti = 0; ti < G.towers.length; ti++) {

        var dd = dist(tt.x, tt.y, e.x, e.y);
        if (dd < bd) { bd = dd; best = tt; }
      }
      if (best) {
        best.disabled = Math.max(best.disabled, 2);
        addBeam(e.x, e.y, best.x, best.y, '#f472b6', 0.3, 3, 'glob');
        addText(best.x, best.y - 28, '墨弹瘫痪!', '#f472b6', 11);
        spawnEffect('ring', best.x, best.y, 0, 24, '#f472b6', 0.3);
      }

}

/* ---------- 波次管理 ---------- */
function startWave(early) {
  if (G.waveState !== 'ready') return;
  if (early && G.waveTimer > 0.5) {
    var bonus = Math.ceil(G.waveTimer * 4);
    G.gold += bonus; G.goldEarned += bonus;
    addText(G.base.x, G.base.y - 60, '提前出击 +' + bonus, '#4ade80', 15);
  }
  G.wave++;
  G.waveState = 'spawning';
  var waveDef = G.waves[G.wave - 1];
  G.spawnQ = [];
  var groups = waveDef.groups;
  for (var gi = 0; gi < groups.length; gi++) {
    var gr = groups[gi];
    var nPaths = G.paths.length;
    for (var i = 0; i < gr.n; i++) {
      var pIdx = nPaths > 1 ? ((gr.path || 0) + i) % nPaths : 0;
      G.spawnQ.push({ t: G.spawnClock + gr.d + i * gr.gap, type: gr.t, path: pIdx, wave: G.wave });
    }
  }
  addBanner('第 ' + G.wave + ' 波 / ' + G.waveTotal, waveDef.boss ? '#f87171' : '#7dd3fc');
  if (SFX) SFX.play('wave');
  if (G.onWaveStart) G.onWaveStart(G.wave);
}
function updateWave(dt) {
  G.spawnClock += dt;
  // 生成
  for (var i = G.spawnQ.length - 1; i >= 0; i--) {
    var s = G.spawnQ[i];
    if (s.t <= G.spawnClock) {
      if (s.type === 'BOSS') {
        var wd = G.waves[G.wave - 1];
        spawnBoss(wd.boss, wd.ex);
      } else if (s.type === 'ELITE') {
        var pool = G.map.pool.filter(function (p) { return EMAP[p].armor >= 3 || EMAP[p].hp > 100; });
        var et = pool.length ? pool[(G.wave * 3) % pool.length] : 'hexarmor';
        spawnEnemy(et, { path: 0, dist: 0, elite: true });
      } else spawnEnemy(s.type, { path: s.path % G.paths.length });
      G.spawnQ.splice(i, 1);
    }
  }
  if (G.waveState === 'spawning' && G.spawnQ.length === 0 && G.enemies.length === 0) {
    // 波次完成
    var bonus = 30 + G.wave * 10;
    G.gold += bonus; G.goldEarned += bonus;
    G.score += 40 + G.wave * 10;
    addText(G.base.x, G.base.y - 56, '波次奖励 +' + bonus, '#4ade80', 14);
    if (G.wave >= G.waveTotal) { victory(); return; }
    G.waveState = 'ready';
    G.waveTimer = 6;
  }
  if (G.waveState === 'ready') {
    G.waveTimer -= dt;
    if (G.waveTimer <= 0 && G.autoWave !== false) startWave(false);
    if (G.waveTimer < 0) G.waveTimer = 0;
  }
}
function gameOver() {
  G.over = true; G.win = false;
  if (SFX) SFX.play('lose');
  if (G.onEnd) G.onEnd(false);
}
function victory() {
  G.over = true; G.win = true;
  G.score += G.lives * 80;
  if (SFX) SFX.play('win');
  if (G.onEnd) G.onEnd(true);
}

/* ---------- 主更新 ---------- */
function update(dt) {
  if (!G || G.paused || G.over) {
    // 仍更新效果（暂停时冻结）
    return;
  }
  var sdt = dt * G.speed;
  G.elapsed += sdt;
  var i;
  for (i = 0; i < G.towers.length; i++) updateTower(G.towers[i], sdt);
  for (i = 0; i < G.enemies.length; i++) updateEnemy(G.enemies[i], sdt);
  for (i = G.enemies.length - 1; i >= 0; i--) if (G.enemies[i].dead) G.enemies.splice(i, 1);
  for (i = G.projs.length - 1; i >= 0; i--) { updateProj(G.projs[i], sdt); if (G.projs[i].life <= 0) G.projs.splice(i, 1); }
  // 锯轮
  for (i = G.saws.length - 1; i >= 0; i--) {
    var sw = G.saws[i];
    sw.life -= sdt; sw.dist += 150 * sdt; sw.rot += sdt * 14;
    for (var hk in sw.hitCd) if (sw.hitCd[hk] > 0) sw.hitCd[hk] -= sdt;
    var pp = pathPos(sw.path, sw.dist);
    sw.x = pp.x; sw.y = pp.y;
    for (var j = 0; j < G.enemies.length; j++) {
      var e = G.enemies[j];
      if (e.dead || e.def.fly || e.def.swim) continue;
      var key = G.enemies.indexOf(e);
      if ((sw.hitCd[key] || 0) > 0) continue;
      if (dist(sw.x, sw.y, e.x, e.y) < e.size + 14) {
        sw.hitCd[key] = 0.35;
        damageEnemy(e, sw.dps * 0.35, 'phys', sw.from);
        spawnEffect('spark', e.x, e.y, rnd(-100, 100), rnd(-100, 100), '#cbd5e1', 0.2, 3);
      }
    }
    if (Math.random() < sdt * 20) spawnEffect('spark', sw.x, sw.y, rnd(-60, 60), rnd(-60, 60), '#94a3b8', 0.3, 2);
    if (sw.life <= 0 || sw.dist >= sw.path.len) { sw.from.sawActive = 0; G.saws.splice(i, 1); }
  }
  // 无人机
  for (i = G.drones.length - 1; i >= 0; i--) {
    var d = G.drones[i];
    d.ang += sdt * 10;
    if (d.flash > 0) d.flash -= sdt;
    if (d.state === 'out') {
      var tgt = d.target;
      if (!tgt || tgt.dead) { tgt = findTarget(d.from, towerRange(d.from)); d.target = tgt; }
      if (!tgt) { d.state = 'back'; }
      else {
        var a = Math.atan2(tgt.y - d.y, tgt.x - d.x);
        d.face = a;
        var sp = 260;
        d.x += Math.cos(a) * sp * sdt; d.y += Math.sin(a) * sp * sdt;
        if (dist(d.x, d.y, tgt.x, tgt.y) < 40) { d.state = 'attack'; d.orbitT = 3; }
      }
    } else if (d.state === 'attack') {
      var t2 = d.target;

        if (d.fireCd <= 0) {

          d.flash = 0.09;
          if (SFX) SFX.play('drone');

      }

      d.face = a2;
      d.x += Math.cos(a2) * 240 * sdt; d.y += Math.sin(a2) * 240 * sdt;
      if (dist(d.x, d.y, d.from.x, d.from.y) < 14) G.drones.splice(i, 1);
    }
    if (Math.random() < sdt * 10) spawnEffect('spark', d.x, d.y, 0, 10, '#2dd4bf', 0.2, 2);

    if (f.kind === 'beam' || f.kind === 'ring' || f.kind === 'satMark') continue;
    f.x += f.vx * sdt; f.y += f.vy * sdt;
    if (f.kind === 'shard') { f.vy += 320 * sdt; f.rot += f.vr * sdt; }
    if (f.kind === 'flame') { f.vy -= 60 * sdt; f.vx *= 0.96; }
    if (f.t >= f.life) G.effects.splice(i, 1);
  }
  for (i = G.texts.length - 1; i >= 0; i--) {
    var tx = G.texts[i];
    tx.t += sdt; tx.y += tx.vy * sdt; tx.vy *= 0.94;
    if (tx.t >= tx.life) G.texts.splice(i, 1);
  }
  // 屏幕震动 / 闪屏
  if (G.shake > 0) G.shake = Math.max(0, G.shake - sdt * 26);
  if (G.flashT > 0) G.flashT -= sdt;
  // 卫星打击
  for (i = G.effects.length - 1; i >= 0; i--) {
    var sm = G.effects[i];
    if (sm.kind !== 'satMark') continue;
    /* 准星跟随目标，保证轰击落点命中（目标已死则保留最后位置） */
    if (sm.target && !sm.target.dead) { sm.x = sm.target.x; sm.y = sm.target.y; }
    if (sm.t >= sm.life) {
      var dmg = sm.dmg;
      addBeam(sm.x, 0, sm.x, sm.y, '#e879f9', 0.25, 26, 'satbeam');

      G.shake = Math.max(G.shake, 7);
      G.effects.splice(i, 1);
    }
  }
  updateWave(sdt);
  // 清理结束的beam/ring
  for (i = G.effects.length - 1; i >= 0; i--) {
    var f2 = G.effects[i];
    if ((f2.kind === 'beam' || f2.kind === 'ring') && f2.t >= f2.life) G.effects.splice(i, 1);

}

    ctx.restore();
    return;
  }
  ctx.globalAlpha = 0.12; ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.globalAlpha = 0.55; ctx.strokeStyle = color; ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  ctx.restore();
}

/* ---------- 敌人 ---------- */
function drawEnemy(ctx, e) {
  var x = e.x, y = e.y, s = e.size;
  ctx.save();
  // 相位虚化
  if (e.def.ghost && e.phaseT % 3.2 > 2.0) ctx.globalAlpha = 0.3;
  // 腾空阴影
  if (e.def.jump && e.jumpT > 0) {
    ctx.save(); ctx.globalAlpha = 0.3; ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(x, y + 14, s * 0.8, s * 0.35, 0, 0, TAU); ctx.fill(); ctx.restore();
    y -= 22;
  }
  var col = enemyColor(e);
  if (e.iced) { col = '#bae6fd'; }
  if (e.hitFlash > 0) { col = '#fff'; }
  var t = performance.now() / 1000;
  if (e.isBoss) {
    drawBoss(ctx, e, x, y, t);
  } else {
    ctx.save(); ctx.translate(x, y);
    switch (e.def.shape) {
      case 'circle':
        ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, s, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(-s * 0.3, -s * 0.3, s * 0.28, 0, TAU); ctx.fill();
        break;
      case 'square':
        ctx.rotate(e.dist * 0.02);
        ctx.fillStyle = col; ctx.fillRect(-s, -s, s * 2, s * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5; ctx.strokeRect(-s, -s, s * 2, s * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(-s * 0.4, -s * 0.4, s * 0.8, s * 0.8);
        break;
      case 'triangle':
        ctx.rotate(e.dist * 0.03);
        fillPoly(ctx, 0, 0, s * 1.15, 3, 0, col, 'rgba(255,255,255,0.7)');
        break;
      case 'hexagon':
        ctx.rotate(t * 0.8);
        fillPoly(ctx, 0, 0, s, 6, 0, col, 'rgba(255,255,255,0.7)');
        if (e.def.heal) { ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, s + 4, 0, TAU); ctx.stroke(); }
        break;
      case 'star8':
        ctx.rotate(t * 3);
        starPath(ctx, 0, 0, s * 1.15, 8, 0, 0.5);
        ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke();
        break;
      case 'drill':
        ctx.rotate(e.dist * 0.05);
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.moveTo(s * 1.4, 0); ctx.lineTo(-s, -s * 0.7); ctx.lineTo(-s, s * 0.7); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
        break;
      case 'bat':
        ctx.rotate(Math.sin(e.weaveT * 10) * 0.3);
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(0, 0, s * 0.6, 0, TAU); ctx.fill();
        var wfl = Math.sin(t * 18) * 0.5 + 0.5;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-s, -s * (0.5 + wfl), -s * 1.6, 0); ctx.quadraticCurveTo(-s, s * 0.4, 0, 0); ctx.fill();
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(s, -s * (0.5 + wfl), s * 1.6, 0); ctx.quadraticCurveTo(s, s * 0.4, 0, 0); ctx.fill();
        break;
      case 'saucer':
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.ellipse(0, 2, s * 1.2, s * 0.5, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke();
        ctx.fillStyle = 'rgba(186,230,253,0.9)';
        ctx.beginPath(); ctx.arc(0, -3, s * 0.45, Math.PI, 0); ctx.fill();
        break;
      case 'diamond':
        ctx.rotate(t * 1.6);
        ctx.fillStyle = col; ctx.fillRect(-s * 0.8, -s * 0.8, s * 1.6, s * 1.6);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.strokeRect(-s * 0.8, -s * 0.8, s * 1.6, s * 1.6);
        break;
      case 'frog':
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.ellipse(0, 0, s * 1.1, s * 0.85, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke();
        ctx.fillStyle = '#052e16';
        ctx.beginPath(); ctx.arc(-s * 0.4, -s * 0.3, 2.4, 0, TAU); ctx.arc(s * 0.4, -s * 0.3, 2.4, 0, TAU); ctx.fill();
        break;
      case 'drop':
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.moveTo(0, -s * 1.3); ctx.quadraticCurveTo(s, 0, 0, s); ctx.quadraticCurveTo(-s, 0, 0, -s * 1.3); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke();
        break;
      case 'octo':
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(0, -s * 0.2, s * 0.75, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke();
        ctx.strokeStyle = col; ctx.lineWidth = 3;
        for (var tk = -2; tk <= 2; tk++) {
          ctx.beginPath(); ctx.moveTo(tk * s * 0.35, s * 0.3);
          ctx.quadraticCurveTo(tk * s * 0.5, s * 0.9 + Math.sin(t * 6 + tk) * 3, tk * s * 0.35, s * 1.2);
          ctx.stroke();
        }
        break;
      default:
        fillPoly(ctx, 0, 0, s, 6, 0, col, '#fff');
    }
    // 护盾泡
    if (e.shieldHp > 0) {
      ctx.strokeStyle = 'rgba(103,232,249,' + (0.5 + 0.3 * Math.sin(t * 5)) + ')'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, s + 6, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }
  // 血条
  if (!e.isBoss && e.hp < e.maxHp) {
    var bw = Math.max(26, s * 2.4);
    var by2 = y - s - 10;
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(x - bw / 2, by2, bw, 4);
    var pct = clamp(e.hp / e.maxHp, 0, 1);
    ctx.fillStyle = pct > 0.5 ? '#4ade80' : pct > 0.25 ? '#fbbf24' : '#f87171';
    ctx.fillRect(x - bw / 2, by2, bw * pct, 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 0.8; ctx.strokeRect(x - bw / 2, by2, bw, 4);
  }
  // 状态图标
  if (e.burnT > 0 || e.poisT > 0 || e.slowT > 0) {
    ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
    var st = '';
    if (e.burnT > 0) st += '🔥';
    if (e.poisT > 0) st += '☠';
    if (e.slowT > 0) st += '❄';
    ctx.fillText(st, x, y - s - 14);
  }
  ctx.restore();
}
function drawBoss(ctx, b, x, y, t) {
  var col = enemyColor(b);
  if (b.reflectT > 0) col = '#e879f9';
  ctx.save(); ctx.translate(x, y);
  var s = b.size;
  switch (b.def.shape) {
    case 'bossCube':
      ctx.rotate(t * 0.7);
      ctx.fillStyle = col; ctx.fillRect(-s, -s, s * 2, s * 2);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(-s, -s, s * 2, s * 2);
      ctx.rotate(-t * 1.4);
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(-s * 0.5, -s * 0.5, s, s);
      break;
    case 'bossTri':
      ctx.rotate(t * 0.5);
      fillPoly(ctx, 0, 0, s * 1.3, 3, 0, col, '#fff');
      ctx.rotate(-t * 1.2);
      fillPoly(ctx, 0, 0, s * 0.6, 3, Math.PI, 'rgba(255,255,255,0.4)', null);
      break;
    case 'bossRing':
      ctx.rotate(t);
      ctx.strokeStyle = col; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(0, 0, s, 0, TAU); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, s * 0.45, 0, TAU); ctx.fill();
      ctx.rotate(-t * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, s * 0.7, 0, TAU); ctx.stroke();
      break;
    case 'bossHydra':
      for (var h = 0; h < 3; h++) {
        var ha = t * 0.9 + h * TAU / 3;
        var hx = Math.cos(ha) * s * 0.55, hy = Math.sin(ha) * s * 0.55;
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(hx, hy, s * 0.45, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#f87171';
        ctx.beginPath(); ctx.arc(hx + Math.cos(ha) * s * 0.5, hy + Math.sin(ha) * s * 0.5, 3, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(0, 0, s * 0.4, 0, TAU); ctx.fill();
      break;
    case 'bossHive':
      ctx.rotate(Math.sin(t * 1.5) * 0.2);
      fillPoly(ctx, 0, 0, s * 1.1, 6, 0, col, '#fff');
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, s * 0.6, 0, TAU); ctx.stroke();
      ctx.fillStyle = '#fde047';
      ctx.beginPath(); ctx.arc(0, 0, s * 0.25, 0, TAU); ctx.fill();
      break;
    case 'bossPrism':
      ctx.rotate(t * 0.8);
      fillPoly(ctx, 0, 0, s * 1.2, 3, 0, 'rgba(232,121,249,0.3)', '#e879f9');
      fillPoly(ctx, 0, 0, s * 0.65, 3, Math.PI, col, '#fff');
      break;
    case 'bossDread':
      ctx.rotate(Math.sin(t) * 0.15);
      fillPoly(ctx, 0, 0, s * 1.15, 6, Math.PI / 6, '#334155', '#94a3b8');
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(0, -s * 0.3, s * 0.55, s * 0.3, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(248,113,113,' + (0.6 + 0.4 * Math.sin(t * 4)) + ')';
      ctx.beginPath(); ctx.arc(0, s * 0.4, s * 0.16, 0, TAU); ctx.fill();
      break;
    case 'bossLevi':
      ctx.rotate(Math.sin(t * 1.2) * 0.12);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(0, 0, s * 1.35, s * 0.62, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      for (var tk2 = -2; tk2 <= 2; tk2++) {
        ctx.strokeStyle = col; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(tk2 * s * 0.28, s * 0.5);
        ctx.quadraticCurveTo(tk2 * s * 0.4, s * 1.1 + Math.sin(t * 5 + tk2) * 5, tk2 * s * 0.25, s * 1.5);
        ctx.stroke();
      }
      ctx.fillStyle = '#fde047';
      ctx.beginPath(); ctx.arc(-s * 0.5, -s * 0.15, 3.5, 0, TAU); ctx.arc(s * 0.5, -s * 0.15, 3.5, 0, TAU); ctx.fill();
      break;
    case 'bossChaos':
      var n = 5 + Math.floor((Math.sin(t * 1.3) + 1) * 2.5);
      ctx.rotate(t * 0.9);
      fillPoly(ctx, 0, 0, s * 1.15, n, 0, 'rgba(192,132,252,0.35)', '#c084fc');
      fillPoly(ctx, 0, 0, s * 0.55, 4, t * 2, col, '#fff');
      break;
    case 'bossCore':
      ctx.rotate(t * 0.6);
      ctx.strokeStyle = col; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(0, 0, s * 1.15, 0, TAU); ctx.stroke();
      ctx.rotate(-t * 1.6);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
      for (var cr = 0; cr < 6; cr++) {
        var ca = cr / 6 * TAU;
        ctx.beginPath(); ctx.moveTo(Math.cos(ca) * s * 0.5, Math.sin(ca) * s * 0.5);
        ctx.lineTo(Math.cos(ca) * s * 1.05, Math.sin(ca) * s * 1.05); ctx.stroke();
      }
      drawGlow(ctx, 0, 0, s * 1.1, b.enraged ? '#f87171' : col, 0.8);
      ctx.fillStyle = b.enraged ? '#f87171' : '#fff';
      ctx.beginPath(); ctx.arc(0, 0, s * 0.42, 0, TAU); ctx.fill();
      break;
    default:
      fillPoly(ctx, 0, 0, s, 6, 0, col, '#fff');
  }
  ctx.restore();
  // 无敌/反射
  if (b.invuln > 0) {
    ctx.strokeStyle = 'rgba(103,232,249,' + (0.5 + 0.4 * Math.sin(t * 8)) + ')'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, s * 1.5, 0, TAU); ctx.stroke();
  }
  if (b.reflectT > 0) {
    ctx.strokeStyle = 'rgba(232,121,249,0.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, s * 1.35, 0, TAU); ctx.stroke();
  }
  if (b.telegraph > 0) {
    ctx.strokeStyle = 'rgba(248,113,113,' + (0.4 + 0.4 * Math.sin(t * 12)) + ')'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, s * 1.8, 0, TAU); ctx.stroke();
  }
}

/* ---------- BOSS 血条（HUD 层：最后绘制，不受震屏/元素遮挡） ---------- */
function drawBossBars(ctx) {
  var bosses = [];
  for (var i = 0; i < G.enemies.length; i++) if (G.enemies[i].isBoss) bosses.push(G.enemies[i]);
  if (!bosses.length) return;
  var bw2 = 420, bx2 = FIELD_X + (GW * TILE) / 2 - bw2 / 2;
  for (var k = 0; k < bosses.length; k++) {
    var b = bosses[k];
    // 多个 BOSS 时纵向堆叠，避免互相覆盖
    var by3 = FIELD_Y + 20 + k * 24;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(bx2 - 2, by3 - 2, bw2 + 4, 14);
    ctx.fillStyle = '#7f1d1d'; ctx.fillRect(bx2, by3, bw2, 10);
    var pct2 = clamp(b.hp / b.maxHp, 0, 1);
    var bg2 = ctx.createLinearGradient(bx2, 0, bx2 + bw2, 0);
    bg2.addColorStop(0, '#f87171'); bg2.addColorStop(1, '#fbbf24');
    ctx.fillStyle = bg2; ctx.fillRect(bx2, by3, bw2 * pct2, 10);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1; ctx.strokeRect(bx2, by3, bw2, 10);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(b.def.name + (b.ex ? '·EX' : '') + '  ' + Math.ceil(b.hp) + '/' + Math.ceil(b.maxHp), bx2 + bw2 / 2, by3 - 6);
  }
}

/* ---------- 弹道/效果 ---------- */
function drawProj(ctx, p) {
  ctx.save();
  var t = performance.now() / 1000;
  switch (p.kind) {
    case 'bolt': case 'arrow': case 'dart': case 'orbbolt': case 'star':
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-5, 3.5); ctx.lineTo(-5, -3.5); ctx.closePath(); ctx.fill();
      drawGlow(ctx, 0, 0, 10, p.color, 0.5);
      break;
    case 'dronebolt':
      /* 无人机微型导弹：弹体 + 白弹头 + 尾焰 */
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-4, -1.8, 9, 3.6);
      fillPoly(ctx, 5.5, 0, 2.6, 1.8, 0, '#fff', null);
      if (Math.random() < 0.7) spawnEffect('flame', p.x - Math.cos(p.rot) * 6, p.y - Math.sin(p.rot) * 6, -Math.cos(p.rot) * 50, -Math.sin(p.rot) * 50, '#5eead4', 0.18, 2);
      drawGlow(ctx, 0, 0, 9, p.color, 0.55);
      break;
    case 'rail': case 'railbolt':
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-14, -1.6, 28, 3.2);
      drawGlow(ctx, 0, 0, 16, p.color, 0.7);
      break;
    case 'boom':
      ctx.translate(p.x, p.y); ctx.rotate(t * 12);
      ctx.strokeStyle = p.color; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, 0, 10, -0.8, 0.8); ctx.stroke();
      break;
    case 'glob': case 'glue': case 'frost':
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 5.5, 0, TAU); ctx.fill();
      drawGlow(ctx, p.x, p.y, 12, p.color, 0.5);
      break;
    case 'lob':
      ctx.fillStyle = p.color;
      polyPath(ctx, p.x, p.y, 7, 5, t * 4); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1; ctx.stroke();
      break;
    case 'missile':
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-8, -3, 16, 6);
      fillPoly(ctx, 8, 0, 4, 3, 0, '#fff', null);
      if (Math.random() < 0.6) spawnEffect('flame', p.x - Math.cos(p.rot) * 10, p.y - Math.sin(p.rot) * 10, -Math.cos(p.rot) * 40, -Math.sin(p.rot) * 40, '#f97316', 0.25, 3);
      break;
    case 'bounce':
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
      drawGlow(ctx, p.x, p.y, 12, p.color, 0.4);
      break;
    case 'satMark': break;
    default:
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function drawEffects(ctx) {
  var t = performance.now() / 1000;
  ctx.save();
  for (var i = 0; i < G.effects.length; i++) {
    var f = G.effects[i];
    var k = f.t / f.life, alpha = 1 - k;
    if (f.kind === 'spark') {
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = f.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x - f.vx * 0.02, f.y - f.vy * 0.02); ctx.stroke();
    } else if (f.kind === 'shard') {
      ctx.globalAlpha = alpha;
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
      ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.moveTo(-f.size, -f.size * 0.6); ctx.lineTo(f.size, 0); ctx.lineTo(-f.size * 0.4, f.size * 0.8); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (f.kind === 'flame') {
      ctx.globalAlpha = alpha * 0.85;
      drawGlow(ctx, f.x, f.y, f.size * (1 + k * 1.6), f.color, alpha * 0.8);
    } else if (f.kind === 'muzzle') {
      ctx.globalAlpha = alpha * 0.9;
      ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.size * (0.5 + k * 1.6), 0, TAU); ctx.fill();
    } else if (f.kind === 'ring') {
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = f.color; ctx.lineWidth = f.size * 0.5;
      ctx.beginPath(); ctx.arc(f.x, f.y, 6 + (f.size || 30) * k, 0, TAU); ctx.stroke();
    } else if (f.kind === 'beam') {
      ctx.globalAlpha = Math.min(1, alpha * 1.6);
      if (f.style === 'lightning') {
        ctx.strokeStyle = f.color; ctx.lineWidth = f.size; ctx.lineCap = 'round';
        ctx.shadowColor = f.color; ctx.shadowBlur = 8;
        ctx.beginPath();
        var segs = 6;
        ctx.moveTo(f.x, f.y);
        for (var s = 1; s <= segs; s++) {
          var px = f.x + (f.x2 - f.x) * s / segs + (s < segs ? rnd(-7, 7) : 0);
          var py = f.y + (f.y2 - f.y) * s / segs + (s < segs ? rnd(-7, 7) : 0);
          ctx.lineTo(px, py);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
      } else if (f.style === 'satbeam') {
        var g2 = ctx.createLinearGradient(f.x, 0, f.x, f.y2);
        g2.addColorStop(0, 'rgba(232,121,249,0.1)'); g2.addColorStop(1, f.color);
        ctx.fillStyle = g2;
        ctx.fillRect(f.x - f.size / 2, 0, f.size, f.y2);
        ctx.globalAlpha = alpha * 0.9;
        ctx.fillStyle = '#fff';
        ctx.fillRect(f.x - 2, 0, 4, f.y2);
      } else {
        ctx.strokeStyle = f.color; ctx.lineWidth = f.size; ctx.lineCap = 'round';
        if (f.style === 'heal') { ctx.setLineDash([4, 4]); ctx.lineDashOffset = -t * 30; }
        if (f.style === 'glob') { ctx.setLineDash([8, 5]); }
        ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x2, f.y2); ctx.stroke();
        ctx.setLineDash([]);
      }
    } else if (f.kind === 'satMark') {
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 20);
      ctx.strokeStyle = f.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(f.x, f.y, 20 + k * 14, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(f.x - 26, f.y); ctx.lineTo(f.x - 14, f.y); ctx.moveTo(f.x + 14, f.y); ctx.lineTo(f.x + 26, f.y);
      ctx.moveTo(f.x, f.y - 26); ctx.lineTo(f.x, f.y - 14); ctx.moveTo(f.x, f.y + 14); ctx.lineTo(f.x, f.y + 26); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawTexts(ctx) {
  ctx.save();
  ctx.textAlign = 'center';
  for (var i = 0; i < G.texts.length; i++) {
    var tx = G.texts[i];
    ctx.globalAlpha = 1 - tx.t / tx.life;
    ctx.font = 'bold ' + tx.size + 'px sans-serif';
    ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 3;
    ctx.strokeText(tx.text, tx.x, tx.y);
    ctx.fillStyle = tx.color;
    ctx.fillText(tx.text, tx.x, tx.y);
  }
  ctx.restore();
}
/* 四旋翼无人机：机身 + X 旋臂 + 四点旋转旋翼 + 枪口闪光 */
function drawDrone(ctx, d) {
  ctx.save();
  ctx.translate(d.x, d.y);
  ctx.rotate(d.face || 0);
  var t = performance.now() / 1000;
  var rotor = 0.55 + 0.45 * Math.abs(Math.sin(t * 22));   // 旋翼转速脉动
  // 旋臂（X 形）
  ctx.strokeStyle = '#0f766e'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  var arm = [[7, -7], [-7, -7], [-7, 7], [7, 7]];
  for (var i = 0; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(arm[i][0], arm[i][1]); ctx.stroke();
  }
  // 旋翼（四点，旋转模糊圈）
  for (var j = 0; j < 4; j++) {
    var ax = arm[j][0], ay = arm[j][1];
    ctx.fillStyle = '#134e4a';
    ctx.beginPath(); ctx.arc(ax, ay, 1.8, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(153,246,228,' + (0.35 + 0.3 * rotor) + ')'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(ax, ay, 5.5 * rotor + 2.5, 0, TAU); ctx.stroke();
  }
  // 机身（椭圆）
  ctx.fillStyle = '#2dd4bf';
  ctx.beginPath(); ctx.ellipse(0, 0, 6.5, 4.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
  // 风挡（朝向方向的高亮）
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(3.6, 0, 1.6, 0, TAU); ctx.fill();
  // 枪口闪光
  if (d.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (d.flash / 0.09) + ')';
    ctx.beginPath(); ctx.arc(7, 0, 3.4, 0, TAU); ctx.fill();
  }
  ctx.restore();
  drawGlow(ctx, d.x, d.y, 12, '#2dd4bf', 0.4);
}
function drawSaw(ctx, sw) {
  ctx.save();
  ctx.translate(sw.x, sw.y); ctx.rotate(sw.rot);
  starPath(ctx, 0, 0, 15, 9, 0, 0.6);
  ctx.fillStyle = '#cbd5e1'; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, TAU); ctx.fill();
  ctx.restore();
  drawGlow(ctx, sw.x, sw.y, 14, '#94a3b8', 0.4);
}

/* ---------- 主渲染 ---------- */
function render(ctx) {
  if (!G) return;
  ctx.clearRect(0, 0, WORLD_W, WORLD_H);
  ctx.save();
  if (G.shake > 0.3) ctx.translate(rnd(-G.shake, G.shake) * 0.5, rnd(-G.shake, G.shake) * 0.5);
  drawMap(ctx);
  // 塔（后方层）
  for (var i = 0; i < G.towers.length; i++) drawTower(ctx, G.towers[i], false);
  // 选中范围
  if (G.sel) drawRange(ctx, G.sel.x, G.sel.y, towerRange(G.sel) || 60, G.sel.def.color);
  // 锯轮 & 无人机
  for (var s2 = 0; s2 < G.saws.length; s2++) drawSaw(ctx, G.saws[s2]);
  for (var d2 = 0; d2 < G.drones.length; d2++) drawDrone(ctx, G.drones[d2]);
  // 敌人
  for (var e = 0; e < G.enemies.length; e++) drawEnemy(ctx, G.enemies[e]);
  // 激光束
  for (var l = 0; l < G.towers.length; l++) {
    var t2 = G.towers[l];
    if (t2.def.proj === 'laser' && t2.beam) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(240,171,252,0.35)'; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(t2.x, t2.y); ctx.lineTo(t2.beam.x, t2.beam.y); ctx.stroke();
      ctx.strokeStyle = '#f5d0fe'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(t2.x, t2.y); ctx.lineTo(t2.beam.x, t2.beam.y); ctx.stroke();
      ctx.restore();
      drawGlow(ctx, t2.beam.x, t2.beam.y, 12, '#f0abfc', 0.8);
    }
  }
  // 弹道
  for (var p = 0; p < G.projs.length; p++) drawProj(ctx, G.projs[p]);
  drawEffects(ctx);
  drawTexts(ctx);
  // 放置预览
  if (G.placing && G.hover) {
    var c = G.hover.c, r = G.hover.r;
    var ok = isBuildable(c, r) && !towerAt(c, r) && G.gold >= WMAP[G.placing].cost;
    var px = FIELD_X + (c + 0.5) * TILE, py = FIELD_Y + (r + 0.5) * TILE;
    var w = WMAP[G.placing];
    drawRange(ctx, px, py, w.range || 60, ok ? '#4ade80' : '#f87171');
    ctx.save();
    ctx.globalAlpha = 0.75;
    drawTower(ctx, { x: px, y: py, def: w, lvl: 1, angle: -Math.PI / 2, bornT: 0, syn: { dmg: 1, spd: 1, list: [] }, disabled: 0 }, true);
    ctx.restore();
    if (!ok) {
      ctx.strokeStyle = '#f87171'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(px - 9, py - 9); ctx.lineTo(px + 9, py + 9); ctx.moveTo(px + 9, py - 9); ctx.lineTo(px - 9, py + 9); ctx.stroke();
    }
  }
  ctx.restore();
  // BOSS 血条（震屏之外、所有实体之上：不被任何元素覆盖）
  drawBossBars(ctx);
  // 闪屏
  if (G.flashT > 0 && G.flash) {
    ctx.save();
    ctx.globalAlpha = G.flashT * 1.2;
    ctx.fillStyle = G.flash;
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);
    ctx.restore();
  }
}

/* ============================================================
 * 《几何防线 GEO DEFENSE》— 音效系统（Web Audio 合成，零素材）
 * 默认开启；开关状态持久化到 localStorage('geodef_sound')。
 * 所有音效由振荡器 + 包络实时合成，首次用户手势时初始化 AudioContext。
 * ============================================================ */

var cv, ctx, DPR = 1;

/* ---------- 画布缩放 ----------
 * 可用区域 = 窗口减去左(单体)/右(减速·辅助·无人机)侧栏与顶部 HUD+介绍通栏+群攻横排。
 * 按"战场贴满可用区"取缩放；水平在可行域居中，垂直顶格（留 8px 呼吸缝），
 * 保证任何窗口尺寸下战场完整可见、不被 UI 遮挡或拦截点击。 */
function fitCanvas() {
  var zoneL = SIDE_W, zoneR = window.innerWidth - RSIDE_W;
  var zoneT = HUD_H + INFOBAR_H + TOPBAR_H, zoneB = window.innerHeight;
  var s = Math.min((zoneR - zoneL) / (WORLD_W - FIELD_X), (zoneB - zoneT) / (WORLD_H - FIELD_Y));
  var w = WORLD_W * s, h = WORLD_H * s;
  var minL = zoneL - FIELD_X * s, maxL = zoneR - WORLD_W * s;   // 左界：不遮战场 / 不超右缘
  var minT = zoneT - FIELD_Y * s, maxT = zoneB - WORLD_H * s;   // 上界：不遮战场 / 不超底缘
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.style.left = Math.max(minL, Math.min(maxL, (minL + maxL) / 2)) + 'px';
  cv.style.top = Math.max(minT, Math.min(maxT, minT + 8)) + 'px';
}
function toWorld(cx, cy) {
  var r = cv.getBoundingClientRect();
  return { x: (cx - r.left) / r.width * WORLD_W, y: (cy - r.top) / r.height * WORLD_H };
}
function worldTile(p) {
  var c = Math.floor((p.x - FIELD_X) / TILE), r = Math.floor((p.y - FIELD_Y) / TILE);
  if (c < 0 || r < 0 || c >= GW || r >= GH) return null;
  return { c: c, r: r };
}

function drawMapPreview(pcv, m) {
  var g = pcv.getContext('2d');

  var s = Math.min(W / (GW * TILE), H / (GH * TILE)) * 0.92;
  var ox = (W - GW * TILE * s) / 2, oy = (H - GH * TILE * s) / 2;
  var gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, m.bg[0]); gr.addColorStop(1, m.bg[1]);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  (m.blocked || []).forEach(function (p) {
    g.fillStyle = 'rgba(0,0,0,0.5)';
    g.fillRect(ox + p[0] * TILE * s, oy + p[1] * TILE * s, TILE * s, TILE * s);
  });
  g.lineCap = 'round'; g.lineJoin = 'round';
  m.paths.forEach(function (wp) {
    g.beginPath();
    wp.forEach(function (p, i) {
      var x = ox + (p[0] + 0.5) * TILE * s, y = oy + (p[1] + 0.5) * TILE * s;
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    });
    g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = TILE * s * 0.9; g.stroke();
    g.strokeStyle = m.pathCol; g.lineWidth = TILE * s * 0.72; g.stroke();
  });

  var bx = ox + (last[0] + 0.5) * TILE * s, by = oy + (last[1] + 0.5) * TILE * s;
  g.fillStyle = m.accent;
  g.beginPath(); g.arc(bx, by, 5, 0, TAU); g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.stroke();
}

  el.onmouseenter = function (e) { showTooltip(w, e); };
  el.onmousemove = function (e) { moveTooltip(e); };
  el.onmouseleave = hideTooltip;
  drawWIcon(el.querySelector('canvas'), w);
  return el;
}
function buildWeaponList() {
  var list = $('wlist'); list.innerHTML = '';
  var top = $('twlist'); top.innerHTML = '';
  var right = $('rwlist'); right.innerHTML = '';
  var idx = 0;
  CATS.forEach(function (c) {
    var onSide = SIDE_CATS.indexOf(c.id) >= 0, onTop = TOP_CATS.indexOf(c.id) >= 0, onRight = RIGHT_CATS.indexOf(c.id) >= 0;
    if (!onSide && !onTop && !onRight) return;
    var first = true;
    WEAPONS.forEach(function (w) {
      if (w.cat !== c.id) return;
      idx++;
      if (onSide) {
        if (first) {
          var gh = document.createElement('div');
          gh.className = 'wgroup'; gh.textContent = c.name;
          list.appendChild(gh);
        }
        list.appendChild(makeWItem(w, idx, 'witem'));
      }
      if (onTop) top.appendChild(makeWItem(w, idx, 'titem'));
      if (onRight) {
        if (first) {
          var rg = document.createElement('div');
          rg.className = 'rgroup'; rg.textContent = c.name;
          right.appendChild(rg);
        }
        right.appendChild(makeWItem(w, idx, 'ritem'));
      }
      first = false;
    });
  });
  refreshSidebar();
}
function selectWeapon(id) {
  if (!G) return;
  if (G.placing === id) { G.placing = null; } else { G.placing = id; G.sel = null; }
  refreshSidebar();
}
function drawWIcon(pcv, w) {
  var g = pcv.getContext('2d');
  g.clearRect(0, 0, 72, 72);
  g.save(); g.translate(36, 36); g.scale(1.15, 1.15);
  var col = w.color;
  switch (w.shape) {
    case 'triangle': fillPoly(g, 0, 0, 15, 3, 0, col, '#fff'); break;
    case 'square': g.fillStyle = col; g.fillRect(-11, -11, 22, 22); g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.strokeRect(-11, -11, 22, 22); break;
    case 'diamond': g.rotate(Math.PI / 4); g.fillStyle = col; g.fillRect(-10, -10, 20, 20); g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.strokeRect(-10, -10, 20, 20); break;
    case 'obelisk': g.fillStyle = col; g.beginPath(); g.moveTo(0, -17); g.lineTo(7, 2); g.lineTo(4, 13); g.lineTo(-4, 13); g.lineTo(-7, 2); g.closePath(); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.stroke(); break;
    case 'boomerang': g.strokeStyle = col; g.lineWidth = 6; g.lineCap = 'round'; g.beginPath(); g.arc(0, 0, 12, -0.9, 0.9); g.stroke(); break;
    case 'prism': fillPoly(g, 0, 0, 16, 3, 0, 'rgba(240,171,252,0.25)', col); fillPoly(g, 0, 0, 8, 3, Math.PI, col, '#fff'); break;
    case 'saw': starPath(g, 0, 0, 15, 8, 0, 0.62); g.fillStyle = col; g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.stroke(); break;
    case 'hexagon': fillPoly(g, 0, 0, 14, 6, Math.PI / 6, col, '#fff'); break;
    case 'circle': g.fillStyle = col; g.beginPath(); g.arc(0, 0, 12, 0, TAU); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.stroke(); break;
    case 'octagon': fillPoly(g, 0, 0, 14, 8, Math.PI / 8, col, '#fff'); break;
    case 'star6': starPath(g, 0, 0, 15, 6, 0, 0.5); g.fillStyle = col; g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.stroke(); break;
    case 'coil': g.strokeStyle = col; g.lineWidth = 3; g.beginPath(); g.arc(0, 0, 10, 0, TAU); g.stroke(); g.fillStyle = col; g.beginPath(); g.arc(0, -13, 4, 0, TAU); g.fill(); break;
    case 'ring': g.strokeStyle = col; g.lineWidth = 5; g.beginPath(); g.arc(0, 0, 12, 0, TAU); g.stroke(); break;
    case 'gear': starPath(g, 0, 0, 15, 8, 0, 0.72); g.fillStyle = col; g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.stroke(); break;
    case 'shield': g.beginPath(); g.moveTo(0, -14); g.lineTo(11, -8); g.lineTo(11, 4); g.quadraticCurveTo(11, 12, 0, 16); g.quadraticCurveTo(-11, 12, -11, 4); g.lineTo(-11, -8); g.closePath(); g.fillStyle = 'rgba(52,211,153,0.3)'; g.fill(); g.strokeStyle = col; g.lineWidth = 2; g.stroke(); break;
    case 'carrier': fillPoly(g, 0, 0, 16, 6, Math.PI / 6, 'rgba(45,212,191,0.2)', col); g.fillStyle = col; g.beginPath(); g.arc(0, -5, 5, 0, TAU); g.fill(); break;
    case 'sat': g.fillStyle = col; g.beginPath(); g.ellipse(0, 6, 13, 5, 0, 0, TAU); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(0, -3, 4.5, 0, TAU); g.fill(); break;
    default: fillPoly(g, 0, 0, 13, 6, 0, col, '#fff');
  }
  g.restore();
}

function showTooltip(w, e) {

  if (G.lives !== UI.lastLives) { $('hud-lives').textContent = G.lives; UI.lastLives = G.lives; }

  if (G.over) { txt = G.win ? '🏆 胜利！' : '💥 防线失守'; }

function showEnd(win) {
  var rec = { wave: G.wave, win: win, score: G.score };
  var best = getBest(G.mapIdx, UI.diff);
  if (!best || rec.wave > best.wave || (rec.win && !best.win)) setBest(G.mapIdx, UI.diff, rec);
  $('endTitle').textContent = win ? '防线永固！' : '防线失守';
  $('endTitle').className = 'end-title ' + (win ? 'win' : 'lose');
  var stars = win ? (G.lives >= G.maxLives * 0.85 ? 3 : G.lives >= G.maxLives * 0.5 ? 2 : 1) : 0;
  $('endStars').textContent = '★★★☆☆'.substr(3 - stars, 3);
  $('endStats').innerHTML =
    '<div><span>坚守波次</span><b>' + G.wave + ' / ' + G.waveTotal + '</b></div>' +
    '<div><span>剩余生命</span><b>' + G.lives + ' / ' + G.maxLives + '</b></div>' +

/* ---------- 输入 ---------- */
function bindInput() {
  cv.addEventListener('mousemove', function (e) {
    if (!G) return;
    var p = toWorld(e.clientX, e.clientY);
    G.hover = worldTile(p);
  });
  cv.addEventListener('click', function (e) {
    if (!G || G.over || G.paused) return;
    var p = toWorld(e.clientX, e.clientY);
    var tile = worldTile(p);
    if (!tile) return;
    if (G.placing) {
      var exist = towerAt(tile.c, tile.r);
      if (exist) { G.sel = exist; G.placing = null; refreshSidebar(); return; }
      var t = placeTower(G.placing, tile.c, tile.r);
      if (t) { G.sel = t; refreshSidebar(); }
      else if (SFX) SFX.play('error');   // 位置不可建 / 金币不足
    } else {
      var t2 = towerAt(tile.c, tile.r);
      G.sel = t2 || null;
      refreshSidebar();
    }
  });
  cv.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    if (!G) return;
    if (G.placing) { G.placing = null; refreshSidebar(); }
    else if (G.sel) { G.sel = null; refreshSidebar(); }
  });
  window.addEventListener('keydown', function (e) {
    if (!G || UI.screen !== null) return;
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    else if (e.code === 'Enter') { if (G.waveState === 'ready' && !G.over) startWave(true); }
    else if (e.code === 'Escape') { togglePause(); }
  });
  $('btn-pause').onclick = togglePause;
  $('btn-early').onclick = function () { if (G.waveState === 'ready') startWave(true); };
  $('autoWaveChk').onchange = function () { G.autoWave = this.checked; };
  /* 音效开关：默认开，状态持久化到 localStorage */
  var sndBtn = $('btn-sound');
  var syncSndBtn = function () { sndBtn.textContent = SFX.isEnabled() ? '🔊' : '🔇'; sndBtn.classList.toggle('off', !SFX.isEnabled()); };
  sndBtn.onclick = function () { SFX.setEnabled(!SFX.isEnabled()); syncSndBtn(); };
  syncSndBtn();
  /* 首次用户手势时解锁 AudioContext（浏览器自动播放限制） */
  window.addEventListener('pointerdown', function unlock() { SFX.unlock(); window.removeEventListener('pointerdown', unlock); });
  [['spd0', 0], ['spd1', 1], ['spd2', 2], ['spd3', 3]].forEach(function (p) {
    $(p[0]).onclick = function () { G.speed = p[1]; refreshSpeedBtns(); };
  });
}
function refreshSpeedBtns() {
  [['spd0', 0], ['spd1', 1], ['spd2', 2], ['spd3', 3]].forEach(function (p) {
    $(p[0]).classList.toggle('on', G && G.speed === p[1]);
  });
}
function togglePause() {
  if (!G || G.over) return;
  G.paused = !G.paused;
  if (G.paused) {
    $('pauseStats').innerHTML =
      '<div><span>波次</span><b>' + G.wave + ' / ' + G.waveTotal + '</b></div>' +
      '<div><span>金币</span><b>' + Math.floor(G.gold) + '</b></div>' +
      '<div><span>生命</span><b>' + G.lives + '</b></div>' +
      '<div><span>击杀</span><b>' + G.kills + '</b></div>' +
      '<div><span>建塔</span><b>' + G.stats.towersBuilt + '</b></div>' +
      '<div><span>地图</span><b>' + G.map.name + '</b></div>';
    showScreen('pause');
  } else showScreen(null);
}

window.GEO = {
  start: function (mi, d) { UI.diff = d || 0; startGame(mi); },

  setGold: function (n) { if (G) G.gold = n; },
  lives: function (n) { if (G) G.lives = n; },
  speed: function (s) { if (G) G.speed = s; },
  pause: function (p) { if (G) G.paused = !!p; },
  wave: function () { if (G && G.waveState === 'ready') startWave(false); },
  early: function () { if (G && G.waveState === 'ready') startWave(true); },
  spawn: function (type, n) { if (!G) return; for (var i = 0; i < (n || 1); i++) spawnEnemy(type, { path: rndi(0, G.paths.length - 1) }); },
  boss: function (id, ex) { if (G) spawnBoss(id, ex); },
  place: function (wid, c, r) { var t = placeTower(wid, c, r); return !!t; },
  upgrade: function (c, r) { var t = towerAt(c, r); return t ? upgradeTower(t) : false; },
  sell: function (c, r) { var t = towerAt(c, r); if (t) sellTower(t); },
  state: function () {
    if (!G) return null;
    return {
      gold: Math.floor(G.gold), lives: G.lives, wave: G.wave, waveState: G.waveState,
      enemies: G.enemies.length, towers: G.towers.length, projs: G.projs.length,
      effects: G.effects.length, kills: G.kills, over: G.over, win: G.win,
      map: G.mapIdx, diff: G.diff.id, elapsed: Math.round(G.elapsed)
    };
  },
  towers: function () { return G ? G.towers.map(function (t) { return { wid: t.wid, c: t.c, r: t.r, lvl: t.lvl }; }) : []; },
  enemies: function () { return G ? G.enemies.map(function (e) { return { id: e.id, hp: Math.round(e.hp), boss: !!e.isBoss, x: Math.round(e.x), y: Math.round(e.y) }; }) : []; },
  win: function () { if (G && !G.over) victory(); },
  lose: function () { if (G && !G.over) { G.lives = 1; var e = G.enemies[0]; if (e) leakEnemy(e); else { G.lives = 0; gameOver(); } } },
  auto: function (v) { if (G) G.autoWave = v !== false; },
  setWave: function (w) { if (G) { G.wave = Math.max(0, w - 1); G.waveState = 'ready'; G.waveTimer = 0.1; } },
  syn: function () { return G ? G.activeSyn : {}; },
  banner: showBanner
};

/* ---------- 启动 ---------- */
window.addEventListener('DOMContentLoaded', function () {
  cv = $('cv'); ctx = cv.getContext('2d');
  cv.width = WORLD_W; cv.height = WORLD_H;
  fitCanvas();
  window.addEventListener('resize', fitCanvas);
  initTitle();
  buildHelp();
  bindInput();
  // 按钮绑定
  $('btn-start').onclick = function () { showScreen('maps'); };
  $('btn-help').onclick = function () { showScreen('help'); };
  $('btn-help-back').onclick = function () { showScreen('title'); };
  $('btn-maps-back').onclick = function () { showScreen('title'); };
  $('btn-resume').onclick = togglePause;
  $('btn-restart').onclick = function () { startGame(G.mapIdx); };
  $('btn-pause-quit').onclick = function () { showScreen('title'); };
  $('btn-pause-help').onclick = function () { showScreen('help'); };
  $('btn-end-again').onclick = function () { startGame(G.mapIdx); };
  $('btn-end-maps').onclick = function () { showScreen('maps'); };
  $('btn-end-menu').onclick = function () { showScreen('title'); };
  document.querySelectorAll('.diff-btn').forEach(function (b) {
    b.onclick = function () {
      UI.diff = +b.dataset.d;
      document.querySelectorAll('.diff-btn').forEach(function (x) { x.classList.toggle('on', x === b); });
      renderMapGrid();
    };
  });
  showScreen('title');
  // 主循环（异常兜底：单帧出错只跳过该帧，不中断游戏）
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    try {
      if (G && UI.screen === null) {
        update(dt);
        refreshHUD();
        refreshSidebar();
      }
      if (G) render(ctx);
    } catch (err) {
      if (!loop._errN || loop._errMsg !== String(err)) { loop._errN = 0; loop._errMsg = String(err); console.error('[game loop]', err); }
      if (++loop._errN > 60) { console.error('[game loop] 同一错误连续超过 60 帧，停止刷屏'); loop._errN = -1e9; }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
});

</script>
</body>
</html>
