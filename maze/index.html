<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>迷宫大冒险</title>
<style>
  :root{
    --bg:#0a0e17; --panel:#121a2b; --panel2:#0f1726; --text:#e8eefc; --muted:#8b9ab5;
    --line:#1e2942; --accent:#5b8cff; --accent2:#22e0a1; --danger:#ff6b81;
    --shadow:0 18px 50px rgba(0,0,0,.45);
  }
  html[data-theme="light"]{
    --bg:#f2f5fa; --panel:#ffffff; --panel2:#ffffff; --text:#16203a; --muted:#6b7a95;
    --line:#e3e9f2; --accent:#3b6ef6; --accent2:#10b981; --danger:#e11d48;
    --shadow:0 18px 45px rgba(22,32,58,.10);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; touch-action:manipulation;
    display:flex; flex-direction:column; align-items:center;
  }
  .app{width:100%; max-width:1000px; padding:14px 18px 22px; display:flex; flex-direction:column; gap:12px; min-height:100%}

  /* ---------- 顶栏 ---------- */
  header{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:10px; margin-right:auto}
  .logo{
    width:36px;height:36px;border-radius:11px; display:grid;place-items:center; font-size:17px;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; flex:0 0 auto;
    box-shadow:0 6px 18px rgba(91,140,255,.35);
  }
  h1{font-size:16px; margin:0; letter-spacing:.3px}
  .sub{font-size:12px; color:var(--muted); margin:2px 0 0}

  .diffs{display:flex; gap:6px; flex-wrap:wrap; background:var(--panel); padding:4px; border-radius:12px; border:1px solid var(--line)}
  .diff{
    border:0; background:transparent; color:var(--muted); font:inherit; font-size:13px; font-weight:600;
    padding:7px 13px; border-radius:9px; cursor:pointer; transition:.18s; white-space:nowrap;
  }
  .diff:hover{color:var(--text)}
  .diff.on{background:var(--accent); color:#fff; box-shadow:0 4px 14px rgba(91,140,255,.35)}
  .diff.warn{background:var(--danger); color:#fff; box-shadow:0 4px 14px rgba(255,107,129,.35)}

  .actions{display:flex; gap:8px}
  .btn{
    border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; font-size:13px; font-weight:600;
    padding:8px 13px; border-radius:10px; cursor:pointer; transition:.16s; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover{filter:brightness(1.08); color:#fff}
  .btn[disabled]{opacity:.4; cursor:not-allowed; transform:none}
  kbd{
    font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace; padding:3px 5px; border-radius:5px;
    background:rgba(127,127,127,.16); color:inherit; opacity:.75;
  }

  /* ---------- HUD ---------- */
  .hud{display:flex; gap:10px; flex-wrap:wrap}
  .stat{
    flex:1 1 90px; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:8px 13px; display:flex; flex-direction:column; gap:2px; min-width:80px;
  }
  .stat .k{font-size:11px; color:var(--muted); letter-spacing:.5px}
  .stat strong{font-size:17px; font-variant-numeric:tabular-nums; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-weight:700}
  .stat.rec strong{color:var(--accent2)}

  /* ---------- 画布 ---------- */
  .canvasWrap{position:relative; margin:2px auto 0; border-radius:16px; overflow:hidden;
    box-shadow:var(--shadow); border:1px solid var(--line); background:var(--panel2); flex:0 0 auto}
  canvas{display:block; touch-action:none; cursor:crosshair}
  .overlay{
    position:absolute; inset:0; display:none; place-items:center; text-align:center;
    background:color-mix(in srgb, var(--panel) 82%, transparent); backdrop-filter:blur(6px);
  }
  .overlay.show{display:grid}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px 26px; box-shadow:var(--shadow); min-width:250px}
  .card h2{margin:0 0 4px; font-size:20px}
  .card .res{color:var(--muted); font-size:13px; margin:0 0 16px}
  .badge{display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;
    background:var(--accent2); color:#04231a; margin-bottom:10px}
  .rows{display:flex; gap:18px; justify-content:center; margin-bottom:18px}
  .rows div{display:flex; flex-direction:column; gap:3px}
  .rows span{font-size:11px; color:var(--muted)}
  .rows b{font-size:18px; font-family:ui-monospace,Menlo,monospace}
  .cardBtns{display:flex; gap:8px; justify-content:center}

  .hintbar{text-align:center; font-size:12px; color:var(--muted); line-height:1.4; margin-top:-2px}

  /* ---------- 方向键 ---------- */
  .dpad{display:none; justify-content:center; margin:0 auto; gap:8px; padding-top:2px}
  .dpad button{
    width:58px; height:58px; border-radius:16px; border:1px solid var(--line); background:var(--panel);
    color:var(--text); font-size:20px; cursor:pointer; user-select:none; -webkit-user-select:none;
    display:grid; place-items:center; transition:.1s; touch-action:none;
  }
  .dpad button.active{background:var(--accent); border-color:var(--accent); color:#fff; transform:scale(.94)}
  .dpadGrid{display:grid; grid-template-columns:repeat(3,58px); grid-template-rows:repeat(2,58px); gap:8px}
  .dpadGrid button:nth-child(1){grid-area:1/2}
  .dpadGrid button:nth-child(2){grid-area:2/1}
  .dpadGrid button:nth-child(3){grid-area:2/2}
  .dpadGrid button:nth-child(4){grid-area:2/3}
  @media (pointer:coarse), (max-width:820px){ .dpad{display:flex} }
  @media (max-width:640px){
    .app{padding:12px 12px 18px; gap:10px}
    .diffs .diff{padding:6px 9px; font-size:12px}
    .stat{flex:1 1 42%; padding:6px 10px}
    .stat strong{font-size:15px}
    .sub{display:none}
    .btn{padding:7px 10px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">◈</div>
      <div>
        <h1>迷宫大冒险</h1>
        <p class="sub" id="subTitle">选择难度，操控角色找到出口</p>
      </div>
    </div>
    <div class="diffs" id="diffs"></div>
    <div class="actions">
      <button class="btn" id="btnHint">提示 <kbd>空格</kbd></button>
      <button class="btn" id="btnRestart">重开 <kbd>R</kbd></button>
      <button class="btn" id="btnTheme" title="切换主题">◐ 主题</button>
    </div>
  </header>

  <div class="hud">
    <div class="stat"><span class="k">用时</span><strong id="sTime">00:00.0</strong></div>
    <div class="stat"><span class="k">步数</span><strong id="sMoves">0</strong></div>
    <div class="stat"><span class="k">关卡</span><strong id="sLevel">1</strong></div>
    <div class="stat rec"><span class="k">本关最佳</span><strong id="sBest">--</strong></div>
  </div>

  <div class="canvasWrap" id="wrap">
    <canvas id="cv"></canvas>
    <div class="overlay" id="overlay">
      <div class="card">
        <div class="badge" id="winBadge">新纪录</div>
        <h2 id="winTitle">通关！</h2>
        <p class="res" id="winRes"></p>
        <div class="rows">
          <div><span>用时</span><b id="winTime">--</b></div>
          <div><span>步数</span><b id="winMoves">--</b></div>
        </div>
        <div class="cardBtns">
          <button class="btn primary" id="btnNext">下一关 →</button>
          <button class="btn" id="btnRetry">再玩一次</button>
        </div>
      </div>
    </div>
  </div>
  <div class="hintbar" id="hintbar">方向键 / WASD 移动 · 空格提示 · R 重开</div>

  <div class="dpad">
    <div class="dpadGrid">
      <button data-dir="up">▲</button>
      <button data-dir="left">◀</button>
      <button data-dir="down">▼</button>
      <button data-dir="right">▶</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   1. 难度配置
   ========================================================= */
const DIFFS = [
  // 速通：唯一解是一条只往右/下走的阶梯，格数固定为 c+r-2，随时能冲纪录
  { key:'rush',   name:'速通', base:5,  max:7,  step:1, braid:0.00, fog:false, hints:99, cellMax:200,
    algo:'rush', tip:(c,r) => '速通模式：' + (c+r-2) + ' 步直达终点 · 一路向右下，不用回头',
    desc:'迷你直路，闭眼冲到底' },
  { key:'novice', name:'新手', base:9,  max:15, braid:0.00, fog:false, hints:99, desc:'笔直走廊，几乎没有岔路' },
  { key:'easy',   name:'简单', base:13, max:21, braid:0.06, fog:false, hints:6,  desc:'偶尔出现近路' },
  { key:'normal', name:'普通', base:19, max:29, braid:0.16, fog:false, hints:3,  desc:'岔路明显变多' },
  { key:'hard',   name:'困难', base:25, max:37, braid:0.26, fog:true,  hints:2,  light:4.0, desc:'全图迷雾笼罩' },
  { key:'hell',   name:'地狱', base:31, max:51, braid:0.42, fog:true,  hints:1,  light:3.5, desc:'迷雾 + 大量环路' },
  // 第 6 档（内部代号 abyss）：格子更密、短死路与回路同时变多，光照半径最小，且不给提示
  { key:'abyss',  name:'你确定？', base:37, max:59, braid:0.30, fog:true,  hints:0,  light:2.6,
    algo:'prim', confirm:'真的确定？', tip:'你确定？模式：光照只有 2.6 格 · 全靠自己摸索',
    desc:'密林迷宫，死路与回路密布' },
  // 第 7 档：比「你确定？」更密 —— 死路与回路同时更多（编织率拉高到 45%，靠更多格数把死路数也推上去），
  // 光照只剩 1 格（只能看见自己脚下这一格的四道墙），无提示
  { key:'invincible', name:'无敌', base:45, max:67, braid:0.45, fog:true, hints:0, light:1.0, lightInner:0.62,
    algo:'prim', confirm:'确定无敌？', tip:'无敌模式：光照只有 1 格 · 死路与回路比「你确定？」更密',
    desc:'最密迷宫，光照仅 1 格' },
];

const PALETTE = {
  dark:{
    bg:'#0a0e17', floorA:'#121b2e', floorB:'#0f1728', wall:'#4d7cfe', wallGlow:'rgba(77,124,254,.55)',
    hint:'rgba(255,209,102,.95)', player:'#ffd166', playerEye:'#1a2138',
    goal:'#22e0a1', goalSoft:'rgba(34,224,161,.20)', fogRGB:'10,14,23', glow:'rgba(255,214,140,.16)',
  },
  light:{
    bg:'#f2f5fa', floorA:'#ffffff', floorB:'#f7f9fd', wall:'#2b3a55', wallGlow:'rgba(43,58,85,.18)',
    hint:'rgba(240,150,20,.95)', player:'#f59e0b', playerEye:'#3a2a05',
    goal:'#10b981', goalSoft:'rgba(16,185,129,.18)', fogRGB:'242,245,250', glow:null,
  }
};

/* =========================================================
   2. 元素 & 状态
   ========================================================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');
const mazeCv = document.createElement('canvas');
const el = id => document.getElementById(id);
const $diffs = el('diffs'), $overlay = el('overlay'), $hintbar = el('hintbar');

const PLAYER_R = 0.33;      // 角色半径（格）
const ALIGN = 5.0;          // 自动对准走廊中线的速度（格/秒）
const LIGHT_R = 4.0;        // 迷雾模式的光照半径（格）
const PAD = 12;             // 画布内边距，避免外墙线被裁切
const LS = 'maze.v1';

let theme    = 'dark';
let diffKey  = 'normal';
let level    = 1;
let cols = 19, rows = 19;
let grid;                   // Uint8Array 墙位掩码 N=1 E=2 S=4 W=8
let exitCell = { x:18, y:18 };
let startCell = { x:0, y:0 };
let p = { x:0.5, y:0.5 };   // 角色位置（格坐标，浮点）
let facing = { x:1, y:0 };
let moves = 0, lastCellKey = '';
let elapsed = 0, running = false, solved = false;
let hintLeft = 3, hintUntil = 0, hintPath = null;
let cell = 30, mazeW = 0, mazeH = 0, cssW = 0, cssH = 0, dpr = 1;
let cam = { x:0, y:0 };
let camSnap = true;
let bestKey = '';
let lastFrame = performance.now();
let C = PALETTE.dark;

const keys = { up:false, down:false, left:false, right:false };

/* =========================================================
   3. 迷宫生成
   ========================================================= */
const idx = (x,y) => y*cols + x;

function genMaze(size, braid, algo){
  cols = rows = size;
  if(algo === 'prim') genCarvePrim();
  else if(algo === 'rush') genCarveRush();
  else genCarveDFS();

  // 编织：打通部分死胡同，制造环路与选择
  if(braid > 0){
    for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
      const w = grid[idx(x,y)];
      let n = 0; for(let b=1;b<=8;b<<=1) if(w & b) n++;
      if(n !== 3) continue;
      if(Math.random() > braid) continue;
      const cand = [];
      if((w&1) && y>0)      cand.push([x,y,'N']);
      if((w&2) && x<cols-1) cand.push([x,y,'E']);
      if((w&4) && y<rows-1) cand.push([x,y,'S']);
      if((w&8) && x>0)      cand.push([x,y,'W']);
      if(cand.length) { const c = cand[(Math.random()*cand.length)|0]; carve(c[0],c[1],c[2]); }
    }
  }

  startCell = { x:0, y:0 };
  exitCell  = { x:cols-1, y:rows-1 };
}

// 深度优先：主干长、岔路少（新手~普通）
function genCarveDFS(){
  grid = new Uint8Array(cols*rows).fill(15);
  const visited = new Uint8Array(cols*rows);
  const stack = [[0,0]];
  visited[0] = 1;

  while(stack.length){
    const [x,y] = stack[stack.length-1];
    const nbrs = [];
    if(y > 0        && !visited[idx(x,y-1)]) nbrs.push([x,y-1,'N']);
    if(x < cols-1   && !visited[idx(x+1,y)]) nbrs.push([x+1,y,'E']);
    if(y < rows-1   && !visited[idx(x,y+1)]) nbrs.push([x,y+1,'S']);
    if(x > 0        && !visited[idx(x-1,y)]) nbrs.push([x-1,y,'W']);
    if(!nbrs.length){ stack.pop(); continue; }
    const [nx,ny,dir] = nbrs[(Math.random()*nbrs.length)|0];
    carve(x,y,dir);
    visited[idx(nx,ny)] = 1;
    stack.push([nx,ny]);
  }
}

// 随机 Prim：四处生长、路口多、短死路多（深渊）
function genCarvePrim(){
  grid = new Uint8Array(cols*rows).fill(15);
  const visited = new Uint8Array(cols*rows);
  const frontier = [];

  const pushFrontier = (x,y) => {
    if(y > 0      && !visited[idx(x,y-1)]) frontier.push({ x, y, nx:x,   ny:y-1, dir:'N' });
    if(x < cols-1 && !visited[idx(x+1,y)]) frontier.push({ x, y, nx:x+1, ny:y,   dir:'E' });
    if(y < rows-1 && !visited[idx(x,y+1)]) frontier.push({ x, y, nx:x,   ny:y+1, dir:'S' });
    if(x > 0      && !visited[idx(x-1,y)]) frontier.push({ x, y, nx:x-1, ny:y,   dir:'W' });
  };

  visited[0] = 1;
  pushFrontier(0,0);
  while(frontier.length){
    const k = (Math.random()*frontier.length)|0;
    const f = frontier[k];
    frontier[k] = frontier[frontier.length-1];
    frontier.pop();
    if(visited[idx(f.nx,f.ny)]) continue;    // 已被别的格子接走
    carve(f.x, f.y, f.dir);
    visited[idx(f.nx,f.ny)] = 1;
    pushFrontier(f.nx, f.ny);
  }
}

// 速通：唯一解是固定的一条"只往右/只往下"阶梯（恰好 c+r-2 步，不可能更短），
// 其余格子全部按扫描顺序挂成一格死路枝杈 —— 保证仍是完美迷宫（树），解不会被绕出来
function genCarveRush(){
  grid = new Uint8Array(cols*rows).fill(15);
  const joined = new Uint8Array(cols*rows);
  let x = 0, y = 0;
  joined[idx(0,0)] = 1;
  while(x < cols-1 || y < rows-1){
    const canR = x < cols-1, canD = y < rows-1;
    const goR = canR && canD ? Math.random() < 0.5 : canR;
    carve(x, y, goR ? 'E' : 'S');
    if(goR) x++; else y++;
    joined[idx(x,y)] = 1;
  }
  // 只连到"已经接上"的上/左邻居（扫描顺序保证其已存在）→ 不会形成环路
  for(let cy=0; cy<rows; cy++) for(let cx=0; cx<cols; cx++){
    if(joined[idx(cx,cy)]) continue;
    const cand = [];
    if(cy > 0) cand.push('N');
    if(cx > 0) cand.push('W');
    carve(cx, cy, cand[(Math.random()*cand.length)|0]);
    joined[idx(cx,cy)] = 1;
  }
}

function carve(x,y,dir){
  const i = idx(x,y);
  if(dir === 'N'){ grid[i] &= ~1; grid[idx(x,y-1)] &= ~4; }
  if(dir === 'S'){ grid[i] &= ~4; grid[idx(x,y+1)] &= ~1; }
  if(dir === 'E'){ grid[i] &= ~2; grid[idx(x+1,y)] &= ~8; }
  if(dir === 'W'){ grid[i] &= ~8; grid[idx(x-1,y)] &= ~2; }
}

/* =========================================================
   4. 尺寸 / 主题 / 记录
   ========================================================= */
function loadRecords(){
  try{ return JSON.parse(localStorage.getItem(LS+'.best') || '{}'); }catch(e){ return {}; }
}
function saveRecord(k, v){
  const all = loadRecords(); all[k] = v;
  try{ localStorage.setItem(LS+'.best', JSON.stringify(all)); }catch(e){}
}
function diffCfg(){ return DIFFS.find(d => d.key === diffKey) || DIFFS.find(d => d.key === 'normal') || DIFFS[0]; }
function levelSize(){
  const d = diffCfg();
  return Math.min(d.base + (level-1)*(d.step || 2), d.max);
}

function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const host = wrap.parentElement;
  const cs = getComputedStyle(host);
  const availW = Math.max(220, host.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));

  // 视口高度扣掉顶栏 / HUD / 虚拟方向键等实际占用，再留出间距与内边距
  const gap = parseFloat(cs.rowGap || cs.gap) || 0;
  let others = 0, n = 0;
  for(const c of host.children){
    if(c === wrap) continue;
    const s = getComputedStyle(c);
    if(s.display === 'none') continue;
    others += c.getBoundingClientRect().height + (parseFloat(s.marginTop) || 0) + (parseFloat(s.marginBottom) || 0);
    n++;
  }
  const availH = Math.max(220, window.innerHeight - others - gap*(n+1)
                  - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 4);
  const side = Math.round(Math.min(availW, availH, 900));
  cssW = cssH = side;
  cv.style.width = side+'px'; cv.style.height = side+'px';
  cv.width  = Math.round(side*dpr); cv.height = Math.round(side*dpr);
  wrap.style.width  = side+'px';
  wrap.style.height = side+'px';

  // 每格像素：整图能放下就用大格，放不下则跟随镜头
  const d = diffCfg();
  cell = Math.max(18, Math.min(d.cellMax || 46, (side - PAD*2) / Math.max(cols, rows)));
  mazeW = cols*cell; mazeH = rows*cell;
  buildMazeCanvas();
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', theme);
  C = PALETTE[theme] || PALETTE.dark;
  try{ localStorage.setItem(LS+'.theme', theme); }catch(e){}
}

/* =========================================================
   5. 离屏绘制：迷宫本体
   ========================================================= */
function buildMazeCanvas(){
  mazeCv.width = Math.round(mazeW*dpr); mazeCv.height = Math.round(mazeH*dpr);
  const g = mazeCv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,mazeW,mazeH);

  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    g.fillStyle = ((x+y)&1) ? C.floorA : C.floorB;
    g.fillRect(x*cell, y*cell, cell, cell);
  }

  g.strokeStyle = C.wall;
  g.lineWidth = Math.max(1.6, cell*0.13);
  g.lineCap = 'round';
  g.beginPath();
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    const w = grid[idx(x,y)], x0 = x*cell, y0 = y*cell, x1 = x0+cell, y1 = y0+cell;
    if(w & 1){ g.moveTo(x0,y0); g.lineTo(x1,y0); }
    if(w & 2){ g.moveTo(x1,y0); g.lineTo(x1,y1); }
    if(w & 4){ g.moveTo(x0,y1); g.lineTo(x1,y1); }
    if(w & 8){ g.moveTo(x0,y0); g.lineTo(x0,y1); }
  }
  g.stroke();

  // 起点
  const s = cell*0.5;
  g.beginPath(); g.arc(s, s, cell*0.20, 0, Math.PI*2);
  g.fillStyle = theme === 'dark' ? 'rgba(91,140,255,.35)' : 'rgba(59,110,246,.20)'; g.fill();
  g.beginPath(); g.arc(s, s, cell*0.09, 0, Math.PI*2);
  g.fillStyle = theme === 'dark' ? '#5b8cff' : '#3b6ef6'; g.fill();
}

function lightRadius(){ return cell*(diffCfg().light || LIGHT_R); }
// 光心"全亮"区的比例：光照半径越小的档位，这个比例要越大，
// 否则连自己脚下这一格的四道墙都看不全 → 无敌档拿到 0.62
function lightInner(){ return diffCfg().lightInner || 0.45; }

/* =========================================================
   6. 关卡初始化
   ========================================================= */
function startLevel(newMaze){
  const d = diffCfg();
  const size = levelSize();
  if(newMaze || !grid || cols !== size) genMaze(size, d.braid, d.algo);
  p = { x: startCell.x + 0.5, y: startCell.y + 0.5 };
  facing = { x:1, y:0 };
  moves = 0; elapsed = 0; solved = false; running = false;
  lastCellKey = Math.floor(p.x) + ',' + Math.floor(p.y);
  hintLeft = d.hints; hintPath = null; hintUntil = 0;
  bestKey = diffKey + '.' + level;

  resize();
  $overlay.classList.remove('show');
  el('hintbar').textContent = typeof d.tip === 'function' ? d.tip(cols, rows)
                            : (d.tip || (d.fog ? '迷雾模式：只有角色身边是亮的' : '方向键 / WASD 移动'));
  updateHUD();
  renderStatic();
}

function updateHUD(){
  el('sTime').textContent  = fmt(elapsed);
  el('sMoves').textContent = moves;
  el('sLevel').textContent = level;
  const rec = loadRecords()[bestKey];
  el('sBest').textContent = rec ? fmt(rec.t) : '--';
  const d = diffCfg();
  el('btnHint').innerHTML = '提示 <kbd>'+(hintLeft>90?'∞':hintLeft)+'</kbd>';
  el('btnHint').disabled = hintLeft <= 0 || solved;
  el('subTitle').textContent = d.name + ' · ' + cols + '×' + rows + ' · ' + d.desc;
}

/* =========================================================
   7. 碰撞与移动
   ========================================================= */
function segDist(px,py,x1,y1,x2,y2){
  const dx = x2-x1, dy = y2-y1;
  const l2 = dx*dx + dy*dy;
  let t = l2 ? ((px-x1)*dx + (py-y1)*dy)/l2 : 0;
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}

function blocked(x,y){
  const r = PLAYER_R;
  if(x-r < 0 || y-r < 0 || x+r > cols || y+r > rows) return true;   // 迷宫外壁不可穿越
  const x0 = Math.floor(x-r), x1 = Math.floor(x+r);
  const y0 = Math.floor(y-r), y1 = Math.floor(y+r);
  for(let cy=y0; cy<=y1; cy++){
    for(let cx=x0; cx<=x1; cx++){
      if(cx<0||cy<0||cx>=cols||cy>=rows) continue;
      const w = grid[idx(cx,cy)];
      if((w&1) && segDist(x,y,cx,cy,cx+1,cy)     < r) return true;
      if((w&2) && segDist(x,y,cx+1,cy,cx+1,cy+1) < r) return true;
      if((w&4) && segDist(x,y,cx,cy+1,cx+1,cy+1) < r) return true;
      if((w&8) && segDist(x,y,cx,cy,cx,cy+1)     < r) return true;
    }
  }
  return false;
}

function tryMove(dx,dy){
  if(dx && !blocked(p.x+dx, p.y)) p.x += dx;
  if(dy && !blocked(p.x, p.y+dy)) p.y += dy;
}

/* =========================================================
   9. 主循环
   ========================================================= */
function speed(){ return Math.max(4.4, Math.min(7.6, 4.2 + cols*0.075)); }

function update(dt){
  if(solved) return;
  let dx = (keys.right?1:0) - (keys.left?1:0);
  let dy = (keys.down?1:0)  - (keys.up?1:0);
  const moving = !!(dx || dy);
  if(moving && !running){ running = true; }

  if(moving){
    if(dx && dy){ const k = Math.SQRT1_2; dx *= k; dy *= k; }
    const sp = speed();
    let remain = Math.min(dt, 0.05);
    const sub = 1/240;
    while(remain > 0){
      const h = Math.min(sub, remain);
      tryMove(dx*sp*h, dy*sp*h);
      remain -= h;
    }
    // 走廊自动对中，手感更顺
    if(dx && !dy) alignAxis('y', sp, dt);
    if(dy && !dx) alignAxis('x', sp, dt);
    if(dx || dy) facing = { x: Math.sign(dx) || facing.x, y: Math.sign(dy) || facing.y };
  }

  // 计时
  if(running) elapsed += dt;

  // 步数
  const ck = Math.floor(p.x) + ',' + Math.floor(p.y);
  if(ck !== lastCellKey){
    lastCellKey = ck;
    moves++;
  }

  // 到达终点
  if(Math.floor(p.x) === exitCell.x && Math.floor(p.y) === exitCell.y) win();

  // HUD 节流
  hudTick += dt;
  if(hudTick > 0.08){ hudTick = 0; updateHUD(); }
}
let hudTick = 0;

function alignAxis(axis, sp, dt){
  const v = p[axis];
  const target = Math.round(v - 0.5) + 0.5;
  const d = target - v;
  if(Math.abs(d) < 0.002 || Math.abs(d) > 0.5) return;
  const step = Math.sign(d) * Math.min(Math.abs(d), ALIGN*dt);
  if(axis === 'y'){ if(!blocked(p.x, p.y+step)) p.y += step; }
  else            { if(!blocked(p.x+step, p.y)) p.x += step; }
}

/* =========================================================
   10. 渲染
   ========================================================= */
function renderStatic(){
  camSnap = true;
  render(performance.now());
}

function render(now){
  const t = now/1000;
  // ---- 相机 ----
  const needX = mazeW > cssW - PAD*2, needY = mazeH > cssH - PAD*2;
  const tx = needX ? clamp(p.x*cell - cssW/2, -PAD, mazeW - cssW + PAD) : -(cssW - mazeW)/2 - PAD;
  const ty = needY ? clamp(p.y*cell - cssH/2, -PAD, mazeH - cssH + PAD) : -(cssH - mazeH)/2 - PAD;
  if(camSnap){ cam.x = tx; cam.y = ty; camSnap = false; }
  cam.x += (tx - cam.x) * 0.18;
  cam.y += (ty - cam.y) * 0.18;
  if(Math.abs(cam.x-tx) < .3) cam.x = tx;
  if(Math.abs(cam.y-ty) < .3) cam.y = ty;

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = C.bg;
  ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr,0,0,dpr,0,0);

  ctx.save();
  ctx.translate(-cam.x, -cam.y);

  // 迷宫
  ctx.drawImage(mazeCv, 0, 0, mazeW, mazeH);

  // 终点（迷雾里被黑暗盖住，靠近才看得见）
  {
    const gx = (exitCell.x+0.5)*cell, gy = (exitCell.y+0.5)*cell;
    const pulse = 0.5 + 0.5*Math.sin(t*3.2);
    ctx.fillStyle = C.goalSoft;
    ctx.beginPath(); ctx.arc(gx,gy,cell*(0.40+pulse*0.10),0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = C.goal;
    ctx.lineWidth = Math.max(1.6, cell*0.10);
    ctx.beginPath(); ctx.arc(gx,gy,cell*0.24,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(gx,gy,cell*(0.12+pulse*0.05),0,Math.PI*2);
    ctx.fillStyle = C.goal; ctx.fill();
  }

  // 角色
  drawPlayer(t);

  ctx.restore();

  // 迷雾：只有角色身边一圈是亮的，其余永远是黑的（不留探索痕迹）
  const fogOn = diffCfg().fog;
  const pxs = p.x*cell - cam.x, pys = p.y*cell - cam.y;
  if(fogOn){
    const R = lightRadius();
    const rgb = C.fogRGB;
    const g = ctx.createRadialGradient(pxs, pys, R*lightInner(), pxs, pys, R);
    g.addColorStop(0,   'rgba('+rgb+',0)');
    g.addColorStop(0.5, 'rgba('+rgb+',.5)');
    g.addColorStop(1,   'rgba('+rgb+',1)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cssW, cssH);

    if(C.glow){
      // 暖光晕必须留在光照圈内，否则会在光圈外透出一圈"能看见"的假象
      const gr = R*0.95;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const rg2 = ctx.createRadialGradient(pxs,pys,0,pxs,pys,gr);
      rg2.addColorStop(0, C.glow);
      rg2.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rg2;
      ctx.beginPath(); ctx.arc(pxs, pys, gr, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  // 提示路径（画在迷雾之上，否则付费提示会被黑暗吞掉）
  if(hintPath){
    if(now < hintUntil){
      const fade = Math.min(1, (hintUntil-now)/900);
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.strokeStyle = C.hint;
      ctx.lineWidth = Math.max(2, cell*0.14);
      ctx.setLineDash([cell*0.32, cell*0.34]);
      ctx.lineDashOffset = -(now/28) % 1000;
      ctx.beginPath();
      ctx.moveTo(hintPath[0].x*cell - cam.x, hintPath[0].y*cell - cam.y);
      for(let i=1;i<hintPath.length;i++) ctx.lineTo(hintPath[i].x*cell - cam.x, hintPath[i].y*cell - cam.y);
      ctx.stroke();
      ctx.restore();
    } else { hintPath = null; }
  }

  // 终点在视野外（或被黑暗盖住）时的方向指示
  if(!solved){
    const sx = (exitCell.x+0.5)*cell - cam.x, sy = (exitCell.y+0.5)*cell - cam.y;
    const pm = cell*0.6;
    const outside = sx < -pm || sy < -pm || sx > cssW+pm || sy > cssH+pm;
    const hidden  = fogOn && Math.hypot(sx-pxs, sy-pys) > lightRadius()*0.9;
    if(outside || hidden){
      const ang = Math.atan2(sy-pys, sx-pxs);
      const r = Math.min(cssW,cssH)*0.34;
      const ax = clamp(pxs + Math.cos(ang)*r, 26, cssW-26);
      const ay = clamp(pys + Math.sin(ang)*r, 26, cssH-26);
      ctx.save();
      ctx.translate(ax,ay); ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(cell*0.30,0); ctx.lineTo(-cell*0.18,-cell*0.20); ctx.lineTo(-cell*0.18,cell*0.20);
      ctx.closePath();
      ctx.fillStyle = C.goal;
      ctx.globalAlpha = 0.55 + 0.35*Math.sin(t*4);
      ctx.fill();
      ctx.restore();
    }
  }
}

function drawPlayer(t){
  const px = p.x*cell, py = p.y*cell, r = cell*0.30;
  const bob = Math.sin(t*9)*0.6;
  ctx.save();
  ctx.translate(px, py+bob);

  // 光晕 + 身体
  ctx.beginPath();
  ctx.arc(0, -bob, r*1.5, 0, Math.PI*2);
  ctx.fillStyle = theme === 'dark' ? 'rgba(255,209,102,.10)' : 'rgba(245,158,11,.13)';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI*2);
  ctx.fillStyle = C.player;
  ctx.fill();

  // 眼睛
  const ex = facing.x || 0, ey = facing.y || 0;
  const perp = { x:-ey, y:ex };
  const off = r*0.36, fr = r*0.30;
  for(const s of [-1,1]){
    const cx2 = perp.x*off*s + ex*r*0.16;
    const cy2 = perp.y*off*s + ey*r*0.16;
    ctx.beginPath(); ctx.arc(cx2, cy2, r*0.19, 0, Math.PI*2);
    ctx.fillStyle = theme === 'dark' ? 'rgba(255,255,255,.92)' : 'rgba(255,255,255,.85)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx2 + ex*fr*0.5, cy2 + ey*fr*0.5, r*0.10, 0, Math.PI*2);
    ctx.fillStyle = C.playerEye; ctx.fill();
  }
  ctx.restore();
}

function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }

/* =========================================================
   11. 提示 / 胜利
   ========================================================= */
function bfsPath(sx,sy,tx,ty){
  const prev = new Int32Array(cols*rows).fill(-2);
  const s = idx(sx,sy);
  prev[s] = -1;
  const q = [s];
  let head = 0, found = false;
  const goal = idx(tx,ty);
  while(head < q.length){
    const cur = q[head++];
    if(cur === goal){ found = true; break; }
    const cx = cur % cols, cy = (cur-cx)/cols;
    const w = grid[cur];
    const nb = [];
    if(!(w&1)) nb.push([cx,cy-1]);
    if(!(w&2)) nb.push([cx+1,cy]);
    if(!(w&4)) nb.push([cx,cy+1]);
    if(!(w&8)) nb.push([cx-1,cy]);
    for(const [nx,ny] of nb){
      if(nx<0||ny<0||nx>=cols||ny>=rows) continue;
      const ni = idx(nx,ny);
      if(prev[ni] !== -2) continue;
      prev[ni] = cur; q.push(ni);
    }
  }
  if(!found) return null;
  const path = [];
  let cur = goal;
  while(cur !== -1){ const cx = cur%cols, cy = (cur-cx)/cols; path.push({ x:cx+0.5, y:cy+0.5 }); cur = prev[cur]; }
  path.reverse();
  return path;
}

function useHint(){
  if(solved || hintLeft <= 0) return;
  const path = bfsPath(Math.floor(p.x), Math.floor(p.y), exitCell.x, exitCell.y);
  if(!path) return;
  hintPath = path;
  hintUntil = performance.now() + 4500;
  if(hintLeft < 90) hintLeft--;
  updateHUD();
}

function win(){
  if(solved) return;
  solved = true; running = false;
  hintPath = null;
  const rec = loadRecords()[bestKey];
  const isBest = !rec || elapsed < rec.t;
  if(isBest) saveRecord(bestKey, { t: elapsed, m: moves });

  const d = diffCfg();
  el('winBadge').style.display = isBest ? 'inline-block' : 'none';
  el('winBadge').textContent = rec ? '新纪录' : '首次通关';
  el('winTitle').textContent = d.name + ' · 第 ' + level + ' 关通关！';
  el('winRes').textContent = (cols+'×'+rows) + ' 迷宫已完成';
  el('winTime').textContent = fmt(elapsed);
  el('winMoves').textContent = moves;
  $overlay.classList.add('show');
  updateHUD();
}

function nextLevel(){
  level++;
  startLevel(true);
}
function retryLevel(){
  level = Math.max(1, level);
  startLevel(true);
}

function fmt(s){
  const m = Math.floor(s/60), sec = s - m*60;
  return String(m).padStart(2,'0') + ':' + (sec < 10 ? '0' : '') + sec.toFixed(1);
}

/* =========================================================
   12. 输入
   ========================================================= */
const KEYMAP = {
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right'
};
window.addEventListener('keydown', e => {
  if(KEYMAP[e.code]){ keys[KEYMAP[e.code]] = true; e.preventDefault(); return; }
  if(e.code === 'Space'){ e.preventDefault(); useHint(); return; }
  if(e.code === 'KeyR'){ e.preventDefault(); startLevel(true); return; }
  if(e.code === 'Enter' && solved){ e.preventDefault(); nextLevel(); }
});
window.addEventListener('keyup', e => { if(KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
window.addEventListener('blur', () => { keys.up = keys.down = keys.left = keys.right = false; });

document.querySelectorAll('[data-dir]').forEach(btn => {
  const dir = btn.dataset.dir;
  const on  = e => { e.preventDefault(); keys[dir] = true;  btn.classList.add('active'); };
  const off = e => { keys[dir] = false; btn.classList.remove('active'); };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointercancel', off);
  btn.addEventListener('pointerleave', off);
});

// 拖拽 / 滑动摇杆
let drag = null;
cv.addEventListener('pointerdown', e => {
  drag = { x:e.clientX, y:e.clientY, id:e.pointerId };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  const len = Math.hypot(dx,dy);
  if(len < 14){ keys.up = keys.down = keys.left = keys.right = false; return; }
  const ux = dx/len, uy = dy/len;
  keys.right = ux > 0.38; keys.left = ux < -0.38;
  keys.down  = uy > 0.38; keys.up   = uy < -0.38;
});
const endDrag = e => {
  if(!drag) return;
  drag = null;
  keys.up = keys.down = keys.left = keys.right = false;
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

/* =========================================================
   13. 按钮
   ========================================================= */
const diffBtns = [];
let pendingKey = null, pendingTimer = null;

function resetDiffLabels(){
  clearTimeout(pendingTimer); pendingTimer = null; pendingKey = null;
  diffBtns.forEach(b => { b.textContent = b.dataset.name; b.classList.remove('warn'); });
}

function applyDiff(key){
  resetDiffLabels();
  diffKey = key; level = 1;
  diffBtns.forEach(x => x.classList.toggle('on', x.dataset.key === diffKey));
  startLevel(true);
}

DIFFS.forEach(d => {
  const b = document.createElement('button');
  b.className = 'diff'; b.textContent = d.name; b.dataset.key = d.key; b.dataset.name = d.name;
  b.addEventListener('click', () => {
    // 需要二次确认的档位：第一下只是把按钮变成警示态
    if(d.confirm && pendingKey !== d.key){
      resetDiffLabels();
      pendingKey = d.key;
      b.textContent = d.confirm;
      b.classList.add('warn');
      pendingTimer = setTimeout(resetDiffLabels, 2600);
      return;
    }
    applyDiff(d.key);
  });
  diffBtns.push(b);
  $diffs.appendChild(b);
});

el('btnHint').addEventListener('click', useHint);
el('btnRestart').addEventListener('click', () => startLevel(true));
el('btnNext').addEventListener('click', nextLevel);
el('btnRetry').addEventListener('click', retryLevel);
el('btnTheme').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  if(grid){ buildMazeCanvas(); renderStatic(); render(performance.now()); }
});

let rTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(rTimer);
  rTimer = setTimeout(() => { if(grid){ resize(); renderStatic(); render(performance.now()); } }, 120);
});

/* =========================================================
   14. 启动
   ========================================================= */
function loop(now){
  const dt = Math.min(0.05, (now - lastFrame)/1000);
  lastFrame = now;
  update(dt);
  render(now);
  requestAnimationFrame(loop);
}

(function boot(){
  try{ theme = localStorage.getItem(LS+'.theme') || 'dark'; }catch(e){}
  applyTheme();
  document.querySelector('.diff[data-key="'+diffKey+'"]').classList.add('on');
  startLevel(true);
  requestAnimationFrame(loop);
})();

})();
</script>
