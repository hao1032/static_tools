<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>静态工具箱 · Static Tools</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --border: #e6e9ef;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-soft: #eff4ff;
      --shadow: 0 1px 3px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.05);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      padding: 56px 24px 32px;
      text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: .5px; }
    header p { margin: 0; color: var(--muted); }
    .wrap { max-width: 980px; margin: 0 auto; padding: 40px 24px 80px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .tool {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .tool:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 12px 32px rgba(37,99,235,.12); }
    .tool .ico {
      width: 52px; height: 52px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      margin-bottom: 16px;
    }
    .tool h3 { margin: 0 0 6px; font-size: 18px; }
    .tool p { margin: 0; color: var(--muted); font-size: 14px; }
    .deploy {
      margin-top: 48px;
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 24px;
      color: var(--muted);
      font-size: 14px;
    }
    .deploy code {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>静态工具箱</h1>
    <p>零依赖、可部署到 Cloudflare Pages 的纯静态小工具集合</p>
  </header>

  <main class="wrap">
    <section class="grid">
      <a class="tool" href="./icons-generator/">
        <div class="ico">字</div>
        <h3>ICO 文字图标生成器</h3>
        <p>多层文字（含中文）组合生成 .ico，支持字号、颜色、透明度、位置、背景与圆角。</p>
      </a>

      <!-- 新增工具：复制本卡片，在对应文件夹放一个 index.html 即可 -->
    </section>

    <section class="deploy">
      <strong>部署方式：</strong>
      将整个 <code>static_tools</code> 文件夹推送到 Git 仓库并在
      <a href="https://pages.cloudflare.com" target="_blank" rel="noreferrer">Cloudflare Pages</a>
      关联（构建设置选 “无 / None”，输出目录为根目录 <code>/</code>），或直接拖拽上传文件夹即可。
      每个工具独立放在自己的文件夹中，根目录 <code>index.html</code> 作为导航入口。
    </section>
  </main>
</body>
</html>
