<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLSF 刀轨预览</title>
  <link rel="stylesheet" href="./style.css?v=5" />
  <script type="importmap">
  {
    "imports": {
      "three": "./three.module.js",
      "three/addons/": "./jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="topbar">
    <a class="back" href="../">&larr; 返回工具箱</a>
    <h1>CLSF 刀轨预览</h1>
    <span class="topbar-hint">解析 NX CLSF 文件，3D 可视化刀轨，支持多刀轨叠加</span>
  </header>

  <main class="layout">
    <!-- 左侧控制面板 -->
    <section class="panel">
      <!-- CLSF 输入（支持多个刀轨） -->
      <div class="card">
        <div class="card-head">
          <h2>CLSF 输入</h2>
          <span id="clsfCount" class="badge">0</span>
        </div>
        <div id="clsfList" class="clsf-list"></div>
        <div class="row" style="margin-top:12px;">
          <button id="addClsfBtn" class="btn" type="button" style="flex:1;">＋ 添加 CLSF</button>
          <button id="clearAllBtn" class="btn" type="button">清空全部</button>
        </div>
      </div>

    </section>

    <!-- 右侧 3D 预览 -->
    <section class="viewer-pane">
      <div class="viewer-stage">
        <canvas id="canvas3d"></canvas>
        <div id="viewerHint" class="viewer-hint">
          <p>粘贴 CLSF 内容并点击「解析」以预览刀轨</p>
          <p class="viewer-hint-sub">支持 GOTO / CIRCLE / CYCLE / RAPID 等指令，可添加多个 CLSF 叠加显示</p>
        </div>
        <div id="coordDisplay" class="coord-display" style="display:none;"></div>
      </div>

      <!-- 动画控制栏 -->
      <div class="anim-bar">
        <button id="playBtn" class="btn btn-primary" type="button" disabled>&#9654; 播放</button>
        <button id="resetBtn" class="btn" type="button" disabled>&#8634; 重置</button>
        <span class="anim-progress-label">进度</span>
        <input type="range" id="progress" min="0" max="1000" value="0" disabled />
        <span class="anim-speed-label">速度</span>
        <input type="range" id="speed" min="1" max="50" value="10" />
        <span class="val" id="speedVal">10x</span>
      </div>
    </section>
  </main>

  <script>
    // 模块加载前同步检测本地 three.js 是否存在；不存在则回退到 CDN
    (function () {
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('HEAD', './three.module.js', false);
        xhr.send();
        var ct = xhr.getResponseHeader('Content-Type') || '';
        if (xhr.status === 200 && ct.indexOf('javascript') !== -1) return;
      } catch (e) {}
      var map = document.querySelector('script[type="importmap"]');
      if (map) {
        map.textContent = JSON.stringify({
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
          }
        });
      }
    })();
  </script>
  <script type="module" src="./app.js?v=5"></script>
  <script>
    // 兜底：若 3 秒后模块仍未初始化成功，给出明确错误提示
    setTimeout(function () {
      if (!window.__clsfReady) {
        var hint = document.getElementById("viewerHint");
        if (hint) {
          hint.innerHTML =
            '<p style="color:#dc2626;">初始化失败：无法加载 3D 渲染依赖。</p>' +
            '<p class="viewer-hint-sub">请通过本地 HTTP 服务器打开本页面（不要直接双击 file://），' +
            '并确认能访问互联网或 clsf-viewer/ 目录下存在 three.module.js 与 jsm/ 文件夹。</p>';
        }
      }
    }, 3000);
  </script>
</body>
</html>
